<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEST BUDS — Sistema de Gestão</title>
<style>
:root{
  --bg:#0D0D11;
  --surface:#181820; --surface-rgb:24,24,32;
  --border:#282836;
  --input-bg:#0f0f16;
  --text:#F3F4F6; --muted:#9CA3AF;
  --green:#00FF66; --green-rgb:0,255,102; --green-hover:#33FF85; --green-text:#04120A;
  --purple:#8B5CF6; --purple-rgb:139,92,246; --purple-hover:#A78BFA; --purple-light:#C4B5FD;
  --danger:#EF4444; --danger-rgb:239,68,68; --danger-light:#FCA5A5; --danger-soft:#F87171; --danger-strong:#B91C1C; --danger-strong-hover:#DC2626;
  --warning:#FBBF24; --warning-rgb:245,158,11; --warning-border:#F59E0B; --warning-light:#FCD34D;
  --info:#3B82F6; --info-rgb:59,130,246;
  --offwhite:#F3F4E8;
  --white:#FFFFFF;
  --r:12px; --sp:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:14px;background:var(--input-bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--purple)}
input:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.money{font-variant-numeric:tabular-nums;font-weight:700;color:var(--green)}
.money-neg{font-variant-numeric:tabular-nums;font-weight:700;color:var(--danger)}
.money-total{color:var(--text)}  /* Total/Valor em branco, como o card Volume Vendas Bruto */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge.gerente{background:rgba(var(--purple-rgb),.15);color:var(--purple);border:1px solid var(--purple)}
.badge.vendedor{background:rgba(var(--green-rgb),.12);color:var(--green);border:1px solid var(--green)}
.btn-export{background:rgba(var(--purple-rgb),.15);color:var(--purple-light);border:1px solid var(--purple)}
.btn-export:hover{background:rgba(var(--purple-rgb),.3);color:var(--white)}

.col-filter-head{position:relative;min-width:110px}.filter-funnel{background:transparent;color:var(--muted);font-size:11px;padding:1px 3px;border-radius:4px}.filter-funnel:hover,.filter-funnel.active{background:var(--purple);color:var(--white)}.excel-filter-dropdown{position:fixed;z-index:300;width:320px;max-height:380px;background:var(--surface);border:1px solid var(--purple);border-radius:10px;box-shadow:0 12px 35px rgba(0,0,0,.6);padding:12px}.efd-title{font-weight:800;margin-bottom:8px}.efd-search{height:34px;padding:7px 9px;margin-bottom:8px}.efd-actions{display:flex;gap:6px;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:8px}.efd-actions button{background:transparent;color:var(--purple);font-size:11px;font-weight:700;padding:0}.efd-options{max-height:190px;overflow:auto}.efd-option{display:flex;align-items:center;gap:8px;padding:6px 4px;margin:0;color:var(--text);font-size:12px;text-transform:none;letter-spacing:0;font-weight:400}.efd-option input{width:auto}.efd-datas{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}.efd-datas label{font-size:11px;margin-bottom:4px}.efd-datas input{padding:9px 10px;width:100%}
.efd-faixa{padding:16px 16px 12px;max-height:none}
.efd-faixa .fx-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.efd-faixa .fx-titulo{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.efd-faixa .fx-limpar{background:transparent;border:1px solid var(--border);color:var(--text);font-size:12px;padding:5px 10px;border-radius:8px}
.efd-faixa .fx-limpar:hover{border-color:var(--muted)}
.fx-campos{display:flex;align-items:center;gap:6px;margin:4px 0 14px}
.fx-campo{display:flex!important;align-items:center;gap:2px;margin:0!important;flex:1;min-width:0;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:0 8px;font-size:20px!important;font-weight:800!important;color:var(--text)!important;text-transform:none!important}
.fx-campo:focus-within{border-color:var(--purple)}
.fx-campo input{border:none;background:transparent;padding:6px 0;font-size:20px;font-weight:800;color:var(--text);width:100%;min-width:0;-moz-appearance:textfield}
.fx-campo input::-webkit-inner-spin-button,.fx-campo input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.fx-sep{color:var(--muted);font-weight:700}
.fx-barra{position:relative;height:26px;margin:0 10px}
.fx-trilho,.fx-preenchido{position:absolute;top:50%;height:8px;margin-top:-4px;border-radius:8px}
.fx-trilho{left:0;right:0;background:var(--border)}
.fx-preenchido{background:var(--text)}
.fx-barra input[type=range]{position:absolute;left:-10px;width:calc(100% + 20px);top:0;height:26px;margin:0;padding:0;background:none;border:none;-webkit-appearance:none;appearance:none;pointer-events:none;z-index:3}
.fx-barra input[type=range]:focus{outline:none}
.fx-barra input[type=range]::-webkit-slider-runnable-track{background:none;border:none;height:26px}
.fx-barra input[type=range]::-moz-range-track{background:none;border:none}
.fx-barra input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:20px;height:20px;margin-top:3px;border-radius:50%;background:var(--bg);border:3px solid var(--text);cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.fx-barra input[type=range]::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--text);cursor:grab}
.fx-barra input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(var(--purple-rgb),.35)}
.fx-marcas{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.efd-footer{display:flex;justify-content:flex-end;gap:6px;margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.record-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.record-tools .btn{white-space:nowrap}
.badge.ativo{background:rgba(var(--green-rgb),.1);color:var(--green)}
.badge.inativo{background:rgba(var(--danger-rgb),.12);color:var(--danger)}
.badge.socio{background:rgba(var(--warning-rgb),.15);color:var(--warning);border:1px solid var(--warning-border)}
.badge.diretor{background:rgba(var(--info-rgb),.15);color:var(--info);border:1px solid var(--info)}
.btn{padding:10px 18px;border-radius:10px;font-weight:700;font-size:14px;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--green);color:var(--green-text)}
.btn-primary:hover{background:var(--green-hover)}
.btn-purple{background:var(--purple);color:var(--white)}
.btn-purple:hover{background:var(--purple-hover)}
.pl-estoque{padding:12px 14px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px}
.pl-estoque-tit{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pl-estoque-grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.pl-estoque-cat{font-size:11px;color:var(--muted);min-width:130px}
.pl-chip{background:#22222c;color:var(--muted);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;border:1px solid transparent}.pl-chip b{color:var(--text);margin-left:4px}.pl-chip.bad{border-color:rgba(170,34,34,.6)}.pl-chip.bad b{color:#F87171}
.pl-lista{display:flex;flex-direction:column;gap:14px}
.pl-linha{padding:16px;display:flex;align-items:center;gap:16px}
.pl-cab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:170px;flex:none;text-align:center}.pl-cab img,.pl-sem-img{width:132px;height:132px;border-radius:14px;object-fit:cover;flex:none}.pl-sem-img{display:flex;align-items:center;justify-content:center;background:var(--input-bg);font-size:48px}.pl-cab b{font-size:16px;line-height:1.25}
/* cartões da linha (receitas e vende no Caixa) do mesmo tamanho, com a seta entre eles */
.pl-fluxo{flex:1;min-width:0;display:grid;grid-template-columns:var(--pl-cols,1fr);align-items:stretch}
.pl-box{border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-height:178px;background:rgba(255,255,255,.02);display:flex;flex-direction:column;gap:8px;min-width:0}
.pl-etapa.ok{border-color:rgba(0,204,82,.35)}.pl-final{justify-content:center;gap:2px;border-color:rgba(0,204,82,.25)}
.pl-et-nome{font-size:14px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:6px;border-bottom:1px solid var(--border)}
.pl-io{display:flex;flex-direction:column;gap:2px;min-width:0}
.pl-io-tit{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.pl-io-tit.sai{color:var(--warning-light)}.pl-io-tit.ent{color:var(--green)}
.pl-io-l{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl-io-l b{display:inline-block;min-width:30px;font-weight:700}
.pl-io.sai .pl-io-l b{color:var(--warning-light)}.pl-io.ent .pl-io-l b{color:var(--green)}
.pl-io-l.falta{color:#F87171}.pl-io-l.falta b{color:#F87171!important}
.pl-nome{font-size:15px;font-weight:800}.pl-sub{font-size:11px;color:var(--muted)}
.pl-seta{display:flex;align-items:center;justify-content:center;color:#4a4a5a;font-size:16px}
.pl-btn{margin-top:auto;align-self:center;padding:5px 14px;font-size:13px;font-weight:700}
.pl-btn.pl-off{border:1px dashed #3a3a4a;color:var(--muted);background:transparent}
@media(max-width:1100px){.pl-linha{flex-direction:column;align-items:stretch}.pl-cab{width:auto}.pl-fluxo{width:100%}}
@media(max-width:700px){.pl-et-nome{white-space:normal}.pl-fluxo{grid-template-columns:1fr}.pl-box{min-height:0}.pl-seta{transform:rotate(90deg);height:24px}.pl-estoque-cat{min-width:0;flex-basis:100%}.pl-io-l{white-space:normal}}
.prod-painel{display:flex;flex-direction:column;gap:16px;min-width:0}
.prod-cat{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prod-nome{font-size:20px;font-weight:800}
.prod-qtd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prod-step{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden}.prod-step button{background:transparent;color:var(--text);padding:7px 13px;font-size:16px;font-weight:700}.prod-step button:disabled{color:var(--muted);opacity:.5}.prod-step input{width:70px;border:none;border-radius:0;text-align:center;padding:7px 4px;background:var(--input-bg)}
.chip-max{border-radius:20px;padding:4px 11px;font-size:12px;font-weight:700;border:1px solid transparent}.chip-max.ok{background:rgba(0,204,82,.12);color:#2ee07a;cursor:pointer}.chip-max.cas{background:rgba(var(--purple-rgb),.18);color:var(--purple-light);cursor:pointer}.chip-max.zero{background:rgba(248,113,113,.12);color:#FCA5A5}
.chip-max.ok:hover{border-color:var(--green)}.chip-max.cas:hover{border-color:var(--purple)}
.prod-tab{width:100%;border-collapse:collapse;font-size:14px}.prod-tab th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px 6px 0}.prod-tab td{border-top:1px solid var(--border);padding:9px 8px 9px 0}
.prod-bloco{border:1px solid var(--border);border-left-width:4px;border-radius:10px;padding:10px 14px}.prod-bloco.sai{border-left-color:var(--warning-light)}.prod-bloco.ent{border-left-color:var(--green)}
.prod-bloco-tit{font-weight:800;font-size:13px;margin-bottom:4px}.prod-bloco.sai .prod-bloco-tit{color:var(--warning-light)}.prod-bloco.ent .prod-bloco-tit{color:var(--green)}.prod-bloco-vazio{font-size:13px;padding:4px 0}
.prod-bloco .prod-tab td:first-child{width:46%}
.r-final{display:flex;align-items:center;gap:10px;margin:2px 0 6px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;text-transform:none;font-size:13px;font-weight:400;color:var(--text);cursor:pointer}.r-final input{width:auto}.r-final:has(input:checked){border-color:var(--green);background:rgba(0,204,82,.06)}
.prod-sai{color:var(--warning-light)}.prod-ent{color:var(--green)}.prod-baixo{color:#F87171}
.prod-cascata{border:1px dashed var(--purple);border-radius:10px;padding:12px}.prod-cas-tit{font-weight:800;color:var(--purple-light);margin-bottom:4px}
.prod-passo{border-left:3px solid var(--purple);background:rgba(var(--purple-rgb),.06);border-radius:6px;padding:8px 10px;margin-top:8px}.prod-passo.pedida{border-left-color:var(--green);background:rgba(0,204,82,.06)}
.prod-passo-tag{font-size:11px;color:var(--purple-light)}.prod-passo.pedida .prod-passo-tag{color:var(--green)}.prod-passo-mov{font-size:12px;margin-top:4px}
.prod-alerta{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.35);border-radius:10px;padding:10px 12px;font-size:13px}
.prod-bloco.compra{border-left-color:var(--purple)}.prod-bloco.compra .prod-bloco-tit{color:var(--purple-light)}
.prod-compra-l{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:baseline;padding:6px 0;border-top:1px solid var(--border);font-size:13px}.prod-compra-l:first-of-type{border-top:none}
.prod-compra-l.total{border-top:1px solid var(--border);font-weight:700}
.cmp-origem{background:rgba(var(--purple-rgb),.1);border:1px solid rgba(var(--purple-rgb),.4);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.prod-falta{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.35);border-radius:10px;padding:12px;font-size:13px}
.prod-rodape{display:flex;flex-direction:column;gap:6px}.prod-acao{width:100%;justify-content:center;padding:12px;font-size:14px}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--muted)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn-danger:hover{background:rgba(var(--danger-rgb),.12)}
.btn-clear{background:var(--danger-strong);color:var(--white)}
.btn-clear:hover{background:var(--danger-strong-hover)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:rgba(var(--purple-rgb),.04)}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
h2.page-title{font-size:22px;font-weight:800;margin-bottom:18px}
p.page-sub{color:var(--muted);margin-bottom:20px;font-size:13px}
.section-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.empty{padding:32px;text-align:center;color:var(--muted)}
.field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.muted{color:var(--muted)}
/* ===== LOGIN ===== */
#login-screen{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;padding:16px;
  background-color:var(--bg);background-image:linear-gradient(rgba(0,0,0,var(--login-escurecer,.55)),rgba(0,0,0,var(--login-escurecer,.55))),var(--login-fundo,url('img/login-fundo.webp'));background-size:cover;background-position:center;background-repeat:no-repeat}
.login-form-col{display:flex;align-items:center;justify-content:center;padding:32px 24px}
.login-box{width:100%;max-width:440px}
.login-mobile-logo{display:none;margin-bottom:22px}
.login-mobile-logo .emb{font-size:40px}
.login-mobile-logo .logo-img{height:48px;max-width:160px;object-fit:contain}
.login-titulo{font-size:48px;font-weight:600;letter-spacing:-1.5px;line-height:1.1;color:var(--text)}
.login-sub{color:var(--muted);font-size:16px;margin:14px 0 30px}
.login-box .field{margin-bottom:18px}
.login-box label{font-size:13px;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0;margin-bottom:8px}
.login-box input[type=text],.login-box input[type=password]{height:54px;border-radius:14px;background:var(--input-bg);border:1px solid var(--border);padding:0 16px;font-size:15px;color:var(--text)}
.login-box input[type=text]:focus,.login-box input[type=password]:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(var(--purple-rgb),.18)}
.login-box input:-webkit-autofill,.login-box input:-webkit-autofill:hover,.login-box input:-webkit-autofill:focus,.login-box input:autofill{
  -webkit-box-shadow:0 0 0 1000px var(--input-bg) inset!important;box-shadow:0 0 0 1000px var(--input-bg) inset!important;
  -webkit-text-fill-color:var(--text)!important;caret-color:var(--text);transition:background-color 99999s ease-out 0s}
.login-box input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 3px rgba(var(--purple-rgb),.18),0 0 0 1000px var(--input-bg) inset!important;box-shadow:0 0 0 3px rgba(var(--purple-rgb),.18),0 0 0 1000px var(--input-bg) inset!important}
.login-senha-wrap{position:relative}
.login-senha-wrap input{padding-right:52px!important}
.login-olho{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:10px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
.login-olho:hover{color:var(--white);background:rgba(255,255,255,.06)}
.login-acoes{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin:4px 0 26px;font-size:14px}
.login-link{background:none;color:var(--info);font-size:14px;padding:0}
.login-link:hover{text-decoration:underline;filter:brightness(1.15)}
.login-entrar{width:100%;height:56px;border-radius:14px;background:var(--green);color:var(--green-text);font-size:16px;font-weight:700;transition:background .15s}
.login-entrar:hover{background:var(--green-hover)}
.login-entrar:disabled{opacity:.6;cursor:wait}
.login-painel{position:relative;min-height:calc(100vh - 32px);display:flex;align-items:center;justify-content:center;background:none;border:none}
.login-marca{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:62%;height:46%}
.login-marca img{max-width:100%;max-height:100%;object-fit:contain}
.login-marca-nome{font-size:clamp(40px,6vw,84px);font-weight:900;letter-spacing:-2px;line-height:.95;color:var(--text);text-align:center}
.login-marca-nome span{display:block;color:transparent;-webkit-text-stroke:2px var(--text)}
.login-vidro{position:absolute;z-index:2;left:50%;bottom:36px;transform:translateX(-50%);width:min(400px,86%);padding:22px 26px 22px 28px;border-radius:20px;background:var(--input-bg);border:1px solid var(--border);border-left:4px solid var(--green);box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.03) inset;color:var(--text)}
.login-vidro b{display:block;font-size:22px;font-weight:900;letter-spacing:.3px;color:var(--text);line-height:1.15}
.login-vidro small{display:block;color:var(--green);font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;margin-top:6px}
.login-vidro p{font-size:14px;line-height:1.55;margin-top:12px;color:var(--text);opacity:.88}
body:not(.logado) #sidebar-nav,body:not(.logado) #bottom-nav{display:none!important}
@media(max-width:900px){
  #login-screen{grid-template-columns:1fr;padding:0}
  .login-painel{display:none}
  .login-mobile-logo{display:block}
  .login-titulo{font-size:38px}
}
.login-err{background:rgba(var(--danger-rgb),.1);border:1px solid var(--danger);color:var(--danger-light);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
/* ===== APP LAYOUT ===== */
#app-header{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(var(--surface-rgb),.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:none;align-items:center;padding:0 16px;gap:12px;z-index:50}
#app-header .emb{font-size:26px}
#app-header .logo-img{height:34px;max-width:120px;object-fit:contain}
#app-header .who{line-height:1.2}
#app-header .who .nm{font-weight:700;font-size:13px}
#app-header .vselo{background:rgba(var(--green-rgb),.1);border:1px solid var(--green);color:var(--green);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap}
#btn-sair{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:8px;font-weight:600;font-size:13px}
#btn-sair:hover{color:var(--danger);border-color:var(--danger)}
#sidebar-nav{position:fixed;top:60px;left:0;bottom:0;width:240px;background:var(--surface);border-right:1px solid var(--border);display:none;flex-direction:column;padding:12px 10px;gap:4px;z-index:40}
#nav-mods{display:flex;flex-direction:column;gap:4px;flex:none}
#nav-cfg{flex:none;padding-top:8px;border-top:1px solid var(--border)}
#nav-cfg:empty{display:none}
/* Membros da equipe (presença em tempo real) + rodapé com o perfil */
.eq-sec{flex:1;min-height:0;overflow:auto;margin-top:10px;padding-top:6px;border-top:1px solid var(--border)}
.eq-grp{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted);padding:9px 8px;text-align:left}
.eq-grp:hover{color:var(--text);background:rgba(var(--purple-rgb),.08)}
.eq-grp .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.eq-grp.on .dot{background:var(--green);box-shadow:0 0 6px var(--green)}
.eq-grp .n{margin-left:auto;font-size:11px;font-weight:800;padding:0 7px;border-radius:999px;background:var(--input-bg);border:1px solid var(--border)}
.eq-grp .seta{font-size:10px;transition:transform .15s}
.eq-grp.aberto .seta{transform:rotate(90deg)}
.eq-lista{padding:2px 0 6px 14px}
.eq-sub{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 8px 3px}
.eq-sub span{font-size:10px;font-weight:700;opacity:.8}
.eq-sub.pc{color:var(--pc)}
.perm-grupos{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;max-height:52vh;overflow:auto;padding-right:4px}
.perm-grupo-tit{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.perm-op{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;cursor:pointer;text-transform:none;letter-spacing:0}
.perm-op input{width:auto;margin-top:3px}
.perm-op span{display:flex;flex-direction:column;gap:2px;font-size:13px}
.perm-op small{color:var(--muted);font-size:11px;font-weight:500}
.perm-op.bloq{opacity:.55;cursor:not-allowed}
.perfil-perms .tag{margin:1px 0}
.img-link{margin-top:12px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.img-link label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.img-link input{flex:1;min-width:0;font-size:13px}
/* v4.39: cor de cada perfil (Configurações › Usuários › Perfis) */
.pc-ouro{--pc:var(--warning)}.pc-azul{--pc:var(--info)}.pc-roxo{--pc:var(--purple)}.pc-verde{--pc:var(--green)}
.pc-laranja{--pc:#f97316}.pc-rosa{--pc:#ec4899}.pc-vermelho{--pc:var(--danger)}.pc-cinza{--pc:var(--muted)}
.badge.pc{background:color-mix(in srgb,var(--pc) 15%,transparent);color:var(--pc);border:1px solid var(--pc)}
.eq-item .foto-u{flex:none}
.eq-item{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px;min-width:0}
.eq-item .nm{flex:0 1 auto;min-width:0}
.badge.mini{flex:none;padding:1px 6px;font-size:9px;line-height:1.4}
.eq-item+.eq-item{margin-top:2px}
.eq-item.off{opacity:.55}
.eq-item .nm,.eq-perfil .nm{font-size:13px;font-weight:600;color:var(--text);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq-vazio{font-size:12px;color:var(--muted);padding:2px 8px 4px}
.eq-perfil{flex:none;display:flex;align-items:center;gap:10px;margin:8px -10px -12px;padding:12px 12px 12px 18px;border-top:1px solid var(--border);background:rgba(0,0,0,.18)}
.eq-perfil .info{min-width:0;flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.eq-perfil .nm{font-weight:700}
.eq-foto{flex:none;padding:0;background:none;border:0;border-radius:50%;cursor:pointer;line-height:0}.eq-foto:hover .foto-u{box-shadow:0 0 0 2px var(--green)}
.eq-sair{flex:none;background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 10px;border-radius:8px;font-weight:600;font-size:12px}
.eq-sair:hover{color:var(--danger);border-color:var(--danger)}
/* Topo: nome da loja com a tipografia da tela de login (sem logo) + versão ao lado */
.h-marca{font-weight:900;font-size:15px;letter-spacing:-.4px;line-height:.95;color:var(--text);white-space:nowrap;text-transform:uppercase}
.h-marca span{display:block;color:transparent;-webkit-text-stroke:1px var(--text)}
@media(min-width:768px){#app-header .who,#btn-sair{display:none}#btn-tutorial{margin-left:auto}}
@media(max-width:420px){#app-header .who .nm{display:none}}
/* celular (pedido do dono, v4.32.2): sem "Sair" e sem a versão no topo (não cabiam: o "Sair" era cortado); tocar no selo do perfil abre a conta, com o "Sair" */
@media(max-width:767px){#btn-sair,#h-versao{display:none}#app-header .who{cursor:pointer;display:flex;align-items:center;gap:6px;padding:4px;border-radius:8px}#app-header .who:active{background:rgba(255,255,255,.06)}}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px;background:transparent;width:100%;text-align:left}
.nav-item:hover{color:var(--text);background:rgba(var(--purple-rgb),.08)}
.nav-item.active{color:var(--green);background:rgba(var(--green-rgb),.08);border:1px solid rgba(var(--green-rgb),.25)}
.nav-item .ic{font-size:18px;width:22px;text-align:center}
.nav-selo{margin-left:auto;font-size:11px;font-weight:800;color:var(--warning);background:rgba(var(--warning-rgb),.14);border:1px solid var(--warning-border);border-radius:999px;padding:1px 7px;line-height:1.4}
#bottom-nav .nav-selo{margin-left:0;font-size:9px;padding:0 5px}
#bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:60px;background:rgba(var(--surface-rgb),.97);border-top:1px solid var(--border);z-index:50}
#bottom-nav .bn-inner{display:flex;height:100%}
#bottom-nav .nav-item{flex-direction:column;gap:2px;justify-content:center;font-size:9px;padding:4px;border-radius:0;flex:1}
#bottom-nav .nav-item .ic{font-size:16px;width:auto}
#bottom-nav .nav-item.active{border:none;border-top:2px solid var(--green);background:rgba(var(--green-rgb),.06)}
#main-content{display:none;margin:60px 0 0 240px;padding:24px;min-height:calc(100vh - 60px)}
/* ===== PDV ===== */
.pdv-layout{display:grid;grid-template-columns:1fr 460px;gap:20px;align-items:start}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:14px}
.cat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;transition:.15s;width:100%;cursor:pointer}
.cat-card:hover{border-color:var(--green);transform:translateY(-2px)}
.cat-card .cn{font-weight:700;font-size:16px;color:var(--offwhite)}
.cat-card .cc{color:var(--muted);font-size:12px;margin:3px 0 8px}
.cat-img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;margin-bottom:12px;background:var(--input-bg);display:flex;align-items:center;justify-content:center;font-size:40px;border:1px solid var(--border)}
.quick-row{display:flex;gap:5px;margin-top:12px}
.qbtn{flex:1;padding:7px 0;border-radius:7px;background:rgba(var(--purple-rgb),.15);color:var(--purple-light);font-weight:800;font-size:12px;border:1px solid transparent}
.qbtn:hover{border-color:var(--purple);color:var(--white)}
.cart-line{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.cart-line .qi{width:28px;height:28px;border-radius:6px;background:var(--border);color:var(--text);font-weight:800;font-size:15px}
.cart-line .qi:hover{background:var(--purple)}
.cart-line .nm{flex:1;font-weight:600;font-size:14px}
.qtd-in{width:64px;text-align:center;background:var(--input-bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 4px;font-weight:700}
.tot-line{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;color:var(--muted)}
.tot-line b{color:var(--text)}
.tot-line.grande{font-size:17px;border-top:1px solid var(--border);margin-top:8px;padding-top:12px}
.tot-line.grande b{color:var(--green);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
/* ===== RESUMOS ===== */
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.sum-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.sum-card .sl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.sum-card .sv{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:6px}
.sum-card.limite{border-color:var(--danger)}
/* ===== MODAL ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:17px;margin-bottom:18px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
/* ===== CONFIG TABS ===== */
.cfg-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.cfg-sub{display:inline-flex;flex-wrap:wrap;max-width:100%;gap:4px;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--border);margin:0 0 14px}
.cfg-sub-bt{background:transparent;border:0;padding:7px 14px;border-radius:9px;color:var(--muted);font-weight:700;font-size:13px}
.cfg-sub-bt.active{background:rgba(var(--purple-rgb),.18);color:var(--purple-light)}
.cfg-tab{padding:8px 16px;border-radius:20px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-weight:600;font-size:13px}
.cfg-tab.active{background:rgba(var(--purple-rgb),.15);border-color:var(--purple);color:var(--purple)}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:rgba(var(--purple-rgb),.12);color:var(--purple-light)}
.tag.g{background:rgba(var(--green-rgb),.1);color:var(--green)}
.tag.r{background:rgba(var(--danger-rgb),.12);color:var(--danger-light)}
.tag.y{background:rgba(var(--warning-rgb),.12);color:var(--warning-light)}
.mov-in{color:var(--green);font-weight:700}
.mov-out{color:var(--danger);font-weight:700}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.iconbtn{background:transparent;border:none;font-size:16px;padding:4px 6px;border-radius:6px}
.btn-del-linha{color:var(--danger);border:1px solid var(--danger);background:rgba(var(--danger-rgb),.08);font-weight:800}
.btn-del-suave{color:var(--danger-soft);border:1px solid rgba(var(--danger-rgb),.4);background:rgba(var(--danger-rgb),.05)}
.btn-del-suave:hover{background:rgba(var(--danger-rgb),.15)}
.btn-del-linha:hover{background:rgba(var(--danger-rgb),.25)}
.cart-line .iconbtn{color:var(--danger);border:1px solid var(--danger);background:rgba(var(--danger-rgb),.08);font-weight:800}
.cart-line .iconbtn:hover{background:rgba(var(--danger-rgb),.25)}
.iconbtn:hover{background:var(--border)}
.td-exp{width:34px;padding-left:6px!important;padding-right:0!important}
.btn-exp{display:inline-flex;align-items:center;gap:2px;background:#282836;color:var(--text);border-radius:6px;padding:2px 6px;font-size:11px;font-weight:800;line-height:18px;transition:background .15s}
.btn-exp small{font-size:10px;color:var(--muted)}
.btn-exp.aberto{background:var(--purple);color:#fff}.btn-exp.aberto small{color:#fff}
.btn-exp:hover{background:#34344A}.btn-exp.aberto:hover{background:var(--purple-hover)}
.btn-exp{display:inline-flex}.btn-exp:not(.aberto){transform:none}
tr.linha-pai.aberta td{border-bottom-color:transparent}
tr.linha-inativa td:not(:has(button,input,.btn-exp)){opacity:.5}
tr.sublinha td{background:rgba(var(--purple-rgb),.06);font-size:13px;border-bottom:1px dashed var(--border)}
tr.sublinha td:first-child{position:relative}
tr.sublinha .sub-guia{position:absolute;left:16px;top:0;bottom:0;border-left:2px solid var(--purple)}
tr.sublinha.ultima .sub-guia{bottom:50%}
tr.sublinha.ultima td{border-bottom:1px solid var(--border)}
.sub-seta{color:var(--purple);font-weight:800;margin-right:2px}
.aux-linha{display:grid;grid-template-columns:1fr 96px 34px;gap:6px;align-items:center;margin-bottom:6px}
.aux-valor{text-align:right;font-weight:700;color:var(--purple)}
.linha-aux td{background:rgba(var(--purple-rgb),.05)}
.linha-aux td:nth-child(n){font-size:13px}
.aux-resumo{font-size:12px;color:var(--muted);margin:4px 0 8px}
.iconbtn.btn-ordem{background:#282836;color:var(--text);width:28px;height:28px;padding:0;margin-right:4px;font-size:15px;font-weight:700;line-height:28px;text-align:center}
.iconbtn.btn-ordem:hover{background:#34344A}
.drop-zone{border:2px dashed var(--border);border-radius:var(--r);padding:32px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}
.drop-zone:hover,.drop-zone.drag{border-color:var(--purple);color:var(--purple)}
.lf-previa{position:relative;height:180px;border-radius:12px;overflow:hidden;border:1px solid var(--border);margin-bottom:14px;background-color:var(--bg);background-size:cover;background-position:center;display:grid;grid-template-columns:1fr 1.1fr;gap:8px;padding:8px}
.lf-previa .lf-form{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 10px}
.lf-previa .lf-form i{display:block;height:9px;border-radius:5px;background:var(--input-bg);border:1px solid var(--border)}
.lf-previa .lf-form i.t{height:12px;width:60%;background:var(--text);border:none;opacity:.9}
.lf-previa .lf-form i.b{background:var(--green);border:none}
.lf-previa .lf-painel{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--text)}
.lf-slider{display:flex;align-items:center;gap:10px}
.lf-slider input[type=range]{flex:1;padding:0;border:none;background:none;accent-color:var(--purple)}
.lf-slider b{min-width:42px;text-align:right;font-variant-numeric:tabular-nums}
.aviso-bg{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px}
.aviso-bg.open{display:flex}
.aviso-box{background:var(--surface);border:1px solid var(--warning-border);border-radius:16px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:22px 22px 18px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.aviso-topo{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--warning)}
.aviso-titulo{margin:6px 0 10px;font-size:20px}
.aviso-msg{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5}
.aviso-meta{margin-top:12px;font-size:12px;color:var(--muted)}
.aviso-img{display:block;margin:0 0 10px;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--input-bg)}
.aviso-img img{display:block;width:100%;max-height:50vh;object-fit:contain}
.aviso-lista .aviso-img img{max-height:220px}
.aviso-img-btn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-transform:none;letter-spacing:0}
.aviso-imgs-dupla{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px;align-items:center}
.aviso-imgs-dupla .aviso-img{margin:0}
.aviso-imgs-dupla .aviso-img img{max-height:40vh}
.aviso-lista .aviso-imgs-dupla .aviso-img img{max-height:180px}
.aviso-img-prevs{display:grid;grid-template-columns:minmax(0,260px);gap:8px;margin-top:8px}.aviso-img-prevs.dupla{grid-template-columns:1fr 1fr;max-width:420px}
.aviso-img-prevs .aviso-img-prev{margin-top:0;max-width:none}
.aviso-img-prev{position:relative;margin-top:8px;max-width:260px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.aviso-img-prev img{display:block;width:100%;max-height:180px;object-fit:contain;background:var(--input-bg)}
.aviso-img-prev .iconbtn{position:absolute;top:6px;right:6px;background:var(--surface)}
.aviso-lista{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto}
.aviso-item{border:1px solid var(--border);border-radius:10px;padding:12px}
.dc-ajuda{padding:10px 14px;margin:0 0 12px;font-size:13px}.dc-ajuda summary{cursor:pointer;font-weight:600}.dc-ajuda ol{margin:8px 0 0;padding-left:20px;line-height:1.55}
.dc-desligado{background:rgba(255,77,77,.08);border:1px solid rgba(255,77,77,.35);border-radius:8px;padding:8px 10px;font-size:12px;margin:0 0 10px}
.dc-ligado small{font-weight:400}
.dc-cargos-tit{font-weight:600;font-size:13px;margin:12px 0 6px}.dc-cargos-tit small{font-weight:500;color:var(--muted)}
.dc-cargos{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.dc-cargo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto auto;gap:6px;align-items:center}.dc-cargo .img-chk{font-size:12px;white-space:nowrap}
.dc-cargo input:not([type=checkbox]){min-width:0}
.dc-erro{font-size:11px;color:var(--warning-light);margin-top:2px;max-width:340px;white-space:normal}
.dc-log td{vertical-align:top}.dc-st{white-space:nowrap}.dc-erro+*{white-space:normal}
.aviso-discord-cargos{display:flex;flex-wrap:wrap;gap:6px 14px}
@media(max-width:520px){.dc-cargo{grid-template-columns:minmax(0,1fr) auto}.dc-cargo .dc-nome{grid-area:1/1}.dc-cargo .iconbtn{grid-area:1/2}.dc-cargo .dc-id{grid-area:2/1}.dc-cargo .img-chk{grid-area:2/2}}
.rk-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.rk-bloco h4{margin:0 0 10px;font-size:14px}.rk-bloco h4 .muted{font-weight:500;font-size:12px}
.rk-linha{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.rk-linha label{font-size:13px;color:var(--text);text-transform:none;letter-spacing:0;margin:0}
.rk-linha label small{display:block;color:var(--muted);font-size:11px}.rk-linha select{width:auto;max-width:170px}
.rk-num{display:flex;align-items:center;gap:6px}.rk-num input{width:72px}.rk-num span{font-size:12px;color:var(--muted)}
.rk-img-linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.rk-img-linha select{flex:1;min-width:220px;width:auto}
.rk-prev-l{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border)}.rk-prev-l:last-of-type{border-bottom:0}
.aviso-dur{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}.aviso-dur input[type=number]{width:90px}
/* aviso automático do vendedor ouro da semana */
.aviso-ouro{border-color:#E8B53A!important;box-shadow:0 0 0 1px rgba(232,181,58,.35),0 10px 40px rgba(232,181,58,.12);background:linear-gradient(180deg,rgba(232,181,58,.10),transparent 60%),var(--surface)}
.foto-u{border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--input-bg);border:2px solid var(--border);vertical-align:middle}
.foto-ini{font-family:var(--font-display,inherit);font-weight:800;color:var(--muted);letter-spacing:.5px}
.u-nome-foto{display:inline-flex;align-items:center;gap:10px}
.u-foto-campo{display:flex;align-items:center;gap:14px}.u-foto-bts{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.aviso-podio{display:grid;grid-template-columns:1fr 1.25fr 1fr;align-items:end;gap:8px;margin:4px 0 12px;text-align:center}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
/* ---- Data e hora: o site inteiro usa o horário de Brasília, seja qual for o fuso do aparelho ou do servidor ----
   O banco guarda o instante em UTC (correto). O erro clássico é tirar o DIA desse instante com toISOString().slice(0,10):
   isso dá o dia em UTC, que já é "amanhã" a partir das 21h de Brasília. Por isso todo dia, hora e "hoje" passa por aqui. */
const TZ_BR='America/Sao_Paulo';
const _fDia=new Intl.DateTimeFormat('en-CA',{timeZone:TZ_BR,year:'numeric',month:'2-digit',day:'2-digit'});
const _fHora=new Intl.DateTimeFormat('en-GB',{timeZone:TZ_BR,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
const _fParede=new Intl.DateTimeFormat('en-US',{timeZone:TZ_BR,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
function diaBR(v){const d=v instanceof Date?v:new Date(v);return isNaN(d)?'':_fDia.format(d)}          // instante → 'AAAA-MM-DD' em Brasília
function horaBR(v){const d=v instanceof Date?v:new Date(v);return isNaN(d)?'':_fHora.format(d)}         // instante → 'HH:MM:SS' em Brasília
/* 'AAAA-MM-DD' + 'HH:MM:SS' no relógio de Brasília → o instante correto (Date) */
function instanteBR(dia,hora){
  const alvo=Date.parse(dia+'T'+hora+'Z');                                   // relógio de parede desejado, lido como UTC
  const parede=x=>{const p=Object.fromEntries(_fParede.formatToParts(new Date(x)).map(o=>[o.type,o.value]));return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second)};
  let t=alvo+3*3600e3;                                                        // palpite: Brasília = UTC−3
  t+=alvo-parede(t);                                                          // ajuste (só muda se o país voltar ao horário de verão)
  return new Date(t);
}
function todayISO(){return diaBR(new Date())}
function dataBR(iso){return (iso||'').slice(0,10).split('-').reverse().join('/')}                       // só para datas puras 'AAAA-MM-DD'
function dataHoraBR(iso){if(!iso)return '—';const d=new Date(iso);if(isNaN(d))return '—';return d.toLocaleString('pt-BR',{timeZone:TZ_BR,day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}

}

async function uploadImagem(file,pasta,prefixo){
  if(!file)return null;

  const ext={'image/png':'png','image/jpeg':'jpg','image/webp':'webp'}[file.type];

}

const iniciais=n=>{const p=String(n||'').trim().split(/\s+/).map(w=>w.replace(/[^\p{L}\p{N}]/gu,'')).filter(Boolean);return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase()};

// recorte quadrado do centro, 400×400 em JPG (foto leve e sempre redonda certinha)
const FOTO_LADO=400;
async function fotoQuadrada(file){
  const url=URL.createObjectURL(file);
  try{const im=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=er;i.src=url});
    const l=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=Math.min(FOTO_LADO,l);
    c.getContext('2d').drawImage(im,(im.width-l)/2,(im.height-l)/2,l,l,0,0,c.width,c.height);
    const b=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.88));return new File([b],'foto.jpg',{type:'image/jpeg'})}
  finally{URL.revokeObjectURL(url)}
}

  const depositosP=sb.from('depositos_caixa').select('*').order('data',{ascending:false}).then(r=>r,e=>({data:[],error:e}));
  const[perfis,produtos,itens,receitas,receitaInsumos,fornecedores,parcerias,parceriaFaixas,
    taxas,vendas,vendaItens,compras,compraItens,bau,config,ajustesCaixa,fornItens,categorias,pedidosSenha]=await Promise.all([
    sb.from('profiles').select('*').order('criado_em'),
    sb.from('produtos').select('*').order('ordem'),
    sb.from('itens').select('*').order('ordem',{nullsFirst:false}).order('nome'),

    sb.from('receita_insumos').select('*'),
    sb.from('fornecedores').select('*').order('ordem',{nullsFirst:false}).order('nome'),
    sb.from('parcerias').select('*').order('ordem'),
    sb.from('parceria_faixas').select('*'),
    sb.from('taxas_deslocamento').select('*').order('ordem'),
    sb.from('vendas').select('*').order('data',{ascending:false}),
    sb.from('venda_itens').select('*'),
    sb.from('compras').select('*').order('data',{ascending:false}),
    sb.from('compra_itens').select('*'),

/* ================= SESSÃO / AUTENTICAÇÃO (SUPABASE AUTH) ================= */
async function doLogin(){
  const usuario=(document.getElementById('login-email').value||'').trim().toLowerCase();
  const senha=document.getElementById('login-senha').value||'';
  const err=document.getElementById('login-err'),btn=document.getElementById('login-btn');
  err.style.display='none';
  if(!usuario||!senha){err.textContent=!usuario?'Informe seu usuário.':'Informe sua senha.';err.style.display='block';return}
  btn.disabled=true;btn.textContent='Entrando…';
  const{data,error}=await sb.auth.signInWithPassword({email:usuario+'@'+EMAIL_DOMAIN,password:senha});
  btn.disabled=false;btn.textContent='Entrar';
  if(error||!data.user){
    const credenciaisErradas=error&&/invalid.*credentials/i.test(error.message||'');
    err.textContent=credenciaisErradas?'Nome de usuário ou senha inválidos.':('Erro ao entrar: '+(error?error.message:'resposta inesperada do servidor.'));
    err.style.display='block';return
  }
  const{data:perfil,error:perr}=await sb.from('profiles').select('*').eq('id',data.user.id).single();
  if(perr||!perfil){err.textContent='Perfil não encontrado. Procure um gerente.';err.style.display='block';await sb.auth.signOut();return}
  if(perfil.status!=='ativo'){err.textContent='Usuário inativo. Procure um gerente.';err.style.display='block';await sb.auth.signOut();return}
  session={usuario_id:perfil.id};
  if(perfil.troca_senha_obrigatoria){openTrocaSenha(perfil);return}
  await finishLogin(perfil);
}
async function finishLogin(perfil){
  await sb.from('profiles').update({ultimo_login:nowISO()}).eq('id',perfil.id);
  await carregarTudo();
  startApp();
}
async function logout(){try{if(_presCanal)await _presCanal.untrack()}catch(e){}await sb.auth.signOut();location.reload()}

/* gerir o perfil "alvo" (dar esse perfil, editar quem o tem): Sócio pode tudo; os outros precisam de "usuarios",
   o alvo não pode ser Sócio e as permissões dele têm de estar contidas nas de quem gerencia (mesma regra do banco) */
function podeGerirPerfil(alvo){
  if(isSocio())return true;
  if(!pode('usuarios')||!alvo||alvo==='socio')return false;
  const minhas=permissoesDoPerfil(perfilIdDe(sessionUser()));
  return permissoesDoPerfil(alvo).every(p=>minhas.includes(p));
}

function descontoFaixa(desconto,qtdItens){

  const f=(desconto.faixas||[]).find(fx=>qtdItens>=fx.quantidade_min&&(fx.quantidade_max===null||qtdItens<=fx.quantidade_max));
  return f?f.percentual_desconto:0;
}
function fatorRateio(prod){
  if(prod.rateio==='100% Equipe')return 1;
  if(prod.rateio==='100% Loja')return 0;

/* No jogo não existem centavos: descontos e repasse são arredondados para o inteiro mais próximo (metade sobe).
   O 1e-9 evita que 4,4999999… (erro de ponto flutuante) desça em vez de subir. */
const inteiroMaisProximo=v=>Math.round((Number(v)||0)+1e-9);
function calcCupom(){
  const itens=pdvState.cupom.map(l=>({prod:db.produtos.find(p=>p.id===l.prodId),qtd:l.qtd})).filter(x=>x.prod&&x.qtd>0);
  const qtdItens=itens.reduce((s,x)=>s+x.qtd,0);
  const parceria=db.parcerias.find(p=>p.id===pdvState.parceriaId)||null;
  const taxa=db.taxas_deslocamento.find(t=>t.id===pdvState.taxaId)||null;
  const pct=descontoFaixa(parceria,qtdItens);
  const subtotal=itens.reduce((s,x)=>s+x.qtd*x.prod.preco,0);
  const desconto=Math.min(subtotal,inteiroMaisProximo(subtotal*pct/100));   // 5% de 90 = 4,50 → $5
  const taxaValor=taxa?taxa.valor:0;
  const total=Math.max(0,subtotal-desconto+taxaValor);
  // o repasse parte do valor já com o desconto arredondado (o mesmo desconto que o cliente paga) e também vai para inteiro.
  // O custo do produto (Catálogo) sai antes de dividir: o repasse é a parte da equipe no lucro, não no preço.
  // No 100% Equipe o custo some da conta: não entra no caixa nem no repasse (o vendedor comprou o produto por esse valor).
  // Ex.: CBD $100, 100% Equipe, custo $75 → cliente paga $100, repasse $25 (o lucro real), caixa $0; os $75 não aparecem em lugar nenhum.
  // Nos outros rateios, o custo fica com a loja (entra no caixa).
  const fatorLiquido=subtotal>0?(subtotal-desconto)/subtotal:0;
  let custo=0,custoEquipe=0,cotaItens=0;
  itens.forEach(x=>{
    const liq=x.qtd*x.prod.preco*fatorLiquido,c=x.qtd*(x.prod.custo||0);
    custo+=c;cotaItens+=Math.max(0,liq-c)*fatorRateio(x.prod);
    if(x.prod.rateio==='100% Equipe')custoEquipe+=Math.min(c,liq);   // com desconto maior que o lucro, a equipe recupera só o que o cliente pagou
  });
  custoEquipe=inteiroMaisProximo(custoEquipe);
  const cota=inteiroMaisProximo(cotaItens+(taxaValor*(db.aliquota_taxa_deslocamento||0)/100));
  const loja=Math.max(0,total-cota-custoEquipe);
  return {itens,qtdItens,parceria,taxa,pct,subtotal,desconto,taxaValor,total,custo,custoEquipe,cota,loja};
}

   Pontuação 0–100 = peso × resultado + peso × volume + peso × constância, cada parte comparada com o melhor do período:
   - resultado: receita da loja, cada venda limitada a um teto (o valor das X% maiores vendas do período);
   - volume: nº de vendas; constância: dias de trabalho com venda (o dia vira na hora da virada).
   Medalha só com o mínimo de vendas. Semana de trabalho: do dia de início, na hora da virada, até o mesmo horário 7 dias depois. */
const RANKING_PADRAO={peso_resultado:50,peso_volume:25,peso_constancia:25,min_vendas:5,teto_percentil:90,virada_hora:6,semana_inicio:1,contar_pendentes:true,aviso_ativo:true,aviso_titulo:'Vendedor ouro da semana',aviso_podio:true};
const DIAS_SEMANA=['','segunda','terça','quarta','quinta','sexta','sábado','domingo'];   // 1 = segunda … 7 = domingo (como no banco)
function regrasRanking(){return{...RANKING_PADRAO,...((db&&db.ranking)||{})}}
const pnHora=h=>String(h).padStart(2,'0')+':00',pnHoraFim=h=>String((h+23)%24).padStart(2,'0')+':59';

function pnSemanaTrabalho(desloc){
  const r=regrasRanking(),hoje=pnDiaTrabalho(new Date()),[a,m,d]=hoje.split('-').map(Number),dow=new Date(Date.UTC(a,m-1,d,12)).getUTCDay()||7;   // 1 = segunda … 7 = domingo
  const seg=pnSomaDias(hoje,-((dow-r.semana_inicio+7)%7)+7*(desloc||0)),ini=instanteBR(seg,pnHora(r.virada_hora)),fim=instanteBR(pnSomaDias(seg,7),pnHora(r.virada_hora));
  return{seg,ini,fim,ultimoDia:pnSomaDias(seg,6)};
}
// a fórmula também está no banco (gerar_aviso_vendedor_semana); as regras (pesos, mínimo, teto…) vêm do mesmo lugar
function pnRankingFaixa(f){
  const r=regrasRanking(),vendas=pnVendasFaixa(f).filter(v=>r.contar_pendentes||v.status==='ativa');
  const lista=pnVendedoresDe(vendas).filter(p=>p.n);
  const vals=vendas.map(v=>v.receita_loja||0).sort((x,y)=>x-y),teto=vals.length?vals[Math.floor((vals.length-1)*r.teto_percentil/100)]:0;
  lista.forEach(p=>{p.ajust=p.vendas.reduce((s,v)=>s+Math.min(v.receita_loja||0,teto),0);p.dias=new Set(p.vendas.map(v=>f.dia(v.data))).size;p.elegivel=p.n>=r.min_vendas});
  const mx=k=>Math.max(0,...lista.map(p=>p[k])),pct=(v,k)=>mx(k)>0?v/mx(k)*100:0;
  lista.forEach(p=>{p.pRes=pct(p.ajust,'ajust');p.pVol=pct(p.n,'n');p.pCon=pct(p.dias,'dias');
    p.pont=Math.round((r.peso_resultado*p.pRes+r.peso_volume*p.pVol+r.peso_constancia*p.pCon)/100*10)/10});
  return{...f,vendas,lista,teto,regras:r};
}

  const T='pendentes',ger=pode('vendas_equipe'),todas=vendasPendentesVisiveis();
  [...selPend].forEach(id=>{if(!pendenteSelecionavel(todas.find(v=>v.id===id)))selPend.delete(id)});
  const F=tabelaFiltravel(T,vendasPendentesVisiveis,{data:v=>v.data,operacao_id:v=>v.operacao_id||'—',usuario_nome:v=>v.usuario_nome||'—',situacao:situacaoPend});
  const lista=F.rows,selecionaveis=lista.filter(pendenteSelecionavel);
  const todasMarcadas=selecionaveis.length>0&&selecionaveis.every(v=>selPend.has(v.id));
  const escolhidas=todas.filter(v=>selPend.has(v.id)),foraDoFiltro=escolhidas.filter(v=>!lista.includes(v)).length;
  const valorSel=escolhidas.reduce((s,v)=>s+(v.receita_loja||0),0);
  // gerência: quanto dinheiro de venda ainda está na mão de cada vendedor
  let porVendedor='';
  // clicar no cartão marca (ou desmarca) todas as vendas daquele vendedor
  if(ger&&todas.length){
    const m={};todas.filter(pendenteSelecionavel).forEach(v=>{const k=v.usuario_id||v.usuario_nome||'—';(m[k]=m[k]||{nome:v.usuario_nome||'—',n:0,val:0,antiga:v,ids:[]}).n++;m[k].val+=v.receita_loja||0;m[k].ids.push(v.id)});
    const ordem=Object.entries(m).sort((a,b)=>b[1].val-a[1].val);_pendChaves=ordem.map(([k])=>k);
    porVendedor=`<div class="pend-resumo">${ordem.map(([k,x],i)=>{const todasDele=x.ids.every(id=>selPend.has(id));
      return `<button type="button" class="pend-chip${todasDele?' ativo':''}" title="${todasDele?'Desmarcar':'Marcar'} todas as vendas de ${esc(x.nome)}" onclick="marcarVendedorPend(${i})"><b>${todasDele?'☑':'☐'} ${esc(x.nome)}</b><span class="money">${fmt(x.val)}</span><small>${x.n} venda(s) · mais antiga ${idadeVenda(x.antiga)}</small></button>`}).join('')}</div>`;
  }
  const linha=v=>{
    const rp=repasseDaVenda(v),pedido=v.cancelamento_status==='pedido',meu=v.usuario_id===sessionUser().id;
    let acoes='';
    if(pedido&&ger)acoes=`<button class="btn btn-ghost btn-sm" title="Aprovar o cancelamento" onclick="responderCancelamento('${v.id}',true)">✅ Aprovar</button> <button class="btn btn-ghost btn-sm" title="Recusar o cancelamento" onclick="responderCancelamento('${v.id}',false)">✖ Recusar</button>`;
    else if(!pedido&&ger)acoes=`<button class="iconbtn" title="Cancelar venda" onclick="reverterFin('venda','venda:${v.id}')">↩️</button>`;
    else if(!pedido&&meu)acoes=`<button class="btn btn-ghost btn-sm" onclick="modalPedirCancelamento('${v.id}')">Pedir cancelamento</button>`;
    const situacao=pedido?`<span class="tag r" title="${esc(v.cancelamento_motivo||'')}">Cancelamento pedido</span><div class="pend-motivo">${esc(v.cancelamento_motivo||'')}</div>`
      :v.cancelamento_status==='recusado'?`<span class="tag y" title="Recusado por ${esc(v.cancelamento_respondido_por_nome||'—')}">Cancelamento recusado</span>`
      :`<span class="tag y">Pendente</span>`;
    return `<tr class="${selPend.has(v.id)?'pend-sel':''}">
      <td><input type="checkbox" style="width:auto" ${pedido?'disabled title="Aguardando resposta do pedido de cancelamento"':''} ${selPend.has(v.id)?'checked':''} onchange="alternarPend('${v.id}',this.checked)"></td>
      <td>${esc(v.operacao_id||'—')}</td>
      <td class="pend-data">${dataHoraBR(v.data)} ${idadeVenda(v)}</td>
      ${ger?`<td>${esc(v.usuario_nome||'—')}</td>`:''}
      <td class="pend-opc" style="color:var(--muted)">${esc((v.itens||[]).map(i=>i.qtd+'× '+i.nome).join(', '))}</td>
      <td class="money money-total pend-opc">${fmt(v.total)}</td>
      <td class="pend-opc" style="color:var(--purple)">${fmt(v.cota_funcionario)}${rp.aux.length?`<div class="pend-motivo">${rp.aux.map(a=>'pagar '+esc(a.nome||'?')+' '+fmt(a.valor)).join('<br>')}</div>`:''}</td>
      <td class="money" style="color:var(--green);font-weight:800">${fmt(v.receita_loja)}</td>
      <td>${situacao}</td>
      <td style="white-space:nowrap">${acoes}</td></tr>`;
  };
  return `<div class="card pend-card" id="pend-card">
    <div class="pend-topo">
      <div class="section-title" style="margin:0">💰 Vendas a guardar no caixa</div>
      <button class="btn btn-primary" ${escolhidas.length?'':'disabled'} onclick="modalGuardarCaixa()">💰 Guardar no caixa${escolhidas.length?` (${escolhidas.length}) · ${fmt(valorSel)}`:''}</button>
    </div>
    ${porVendedor}
    ${F.barra}${foraDoFiltro?`<div class="muted" style="font-size:12px;margin-bottom:8px">${foraDoFiltro} venda(s) marcada(s) fora do filtro também vão ser guardadas.</div>`:''}
    ${todas.length?`<div class="table-wrap"><table>
      <tr><th><input type="checkbox" style="width:auto" title="Marcar todas (as que aparecem)" ${todasMarcadas?'checked':''} ${selecionaveis.length?'':'disabled'} onchange="alternarPendTodas(this.checked)"></th>${thCol(T,'operacao_id','ID')}${thCol(T,'data','Data/hora')}${ger?thCol(T,'usuario_nome','Vendedor'):''}<th class="pend-opc">Itens</th>${thCol(T,'total','Total').replace('<th class="','<th class="pend-opc ')}${thCol(T,'repasse','Repasse').replace('<th class="','<th class="pend-opc ')}${thCol(T,'caixa','Para o caixa')}${thCol(T,'situacao','Situação')}<th></th></tr>
      ${lista.map(linha).join('')||linhaSemResultado(ger?10:9,T)}
    </table></div>`:`<div class="empty" style="padding:16px">Nenhuma venda esperando para ser guardada.</div>`}
  </div>`;
}
function redesenharPendentes(){const el=document.getElementById('pend-card');if(!el)return;const d=document.createElement('div');d.innerHTML=htmlPendentes();el.replaceWith(d.firstElementChild)}
function alternarPend(id,marcado){if(marcado)selPend.add(id);else selPend.delete(id);redesenharPendentes()}
function alternarPendTodas(marcado){const l=pendentesFiltradas().filter(pendenteSelecionavel);l.forEach(v=>marcado?selPend.add(v.id):selPend.delete(v.id));redesenharPendentes()}
function pendentesFiltradas(){return regConsulta.pendentes?aplicarFiltros(vendasPendentesVisiveis(),'pendentes'):vendasPendentesVisiveis()}
let _pendChaves=[];   // cartões de "dinheiro na mão", na ordem em que aparecem
function marcarVendedorPend(i){
  const k=_pendChaves[i];if(k===undefined)return;
  const dele=vendasPendentesVisiveis().filter(v=>pendenteSelecionavel(v)&&(v.usuario_id||v.usuario_nome||'—')===k);if(!dele.length)return;
  const todasDele=dele.every(v=>selPend.has(v.id));dele.forEach(v=>todasDele?selPend.delete(v.id):selPend.add(v.id));redesenharPendentes();
}
/* Resumo antes de guardar: total vendido, descontos, repasse por pessoa e, em destaque, o valor que vai para o caixa */
/* Custo que ficou com a equipe numa venda gravada (produto 100% Equipe com custo): total − repasse − caixa */
function custoEquipeDaVenda(v){return Math.max(0,Math.round(((v.total||0)-(v.cota_funcionario||0)-(v.receita_loja||0))*100)/100)}
function resumoGuardar(vendas){
  const r={n:vendas.length,subtotal:0,desconto:0,taxa:0,total:0,repasse:0,custoEquipe:0,caixa:0,pessoas:{}};
  const soma=(nome,valor,papel)=>{const p=(r.pessoas[nome]=r.pessoas[nome]||{valor:0,papeis:new Set()});p.valor+=valor;p.papeis.add(papel)};
  vendas.forEach(v=>{
    r.subtotal+=v.subtotal||0;r.desconto+=v.desconto||0;r.taxa+=v.taxa_valor||0;r.total+=v.total||0;r.repasse+=v.cota_funcionario||0;r.custoEquipe+=custoEquipeDaVenda(v);r.caixa+=v.receita_loja||0;
    const rp=repasseDaVenda(v);soma(v.usuario_nome||'—',rp.principal,'vendedor');rp.aux.forEach(a=>soma(a.nome||'?',a.valor,'auxiliar'));
  });
  return r;
}
function modalGuardarCaixa(){
  const vendas=vendasPendentesVisiveis().filter(v=>selPend.has(v.id)&&pendenteSelecionavel(v));
  if(!vendas.length)return toast('⚠️ Marque ao menos uma venda.');
  const r=resumoGuardar(vendas),eu=sessionUser().nome;
  const auxDe=vendas.flatMap(v=>repasseDaVenda(v).aux.map(a=>({pagador:v.usuario_nome||'—',nome:a.nome||'?',valor:a.valor})));
  openModal(`<h3>💰 Guardar no caixa</h3>
  <div class="pend-lista">${vendas.map(v=>`<div class="pend-lista-linha"><span>${esc(v.operacao_id||'—')} · ${dataHoraBR(v.data)}${pode('vendas_equipe')?' · '+esc(v.usuario_nome||'—'):''}</span><span class="money">${fmt(v.receita_loja)}</span></div>`).join('')}</div>
  <div style="margin-top:12px">
    <div class="tot-line"><span>Vendas</span><b>${r.n}</b></div>
    <div class="tot-line"><span>Subtotal</span><b>${fmt(r.subtotal)}</b></div>
    <div class="tot-line"><span>Descontos</span><b style="color:var(--danger)">−${fmt(r.desconto)}</b></div>
    <div class="tot-line"><span>Taxas de deslocamento</span><b>+${fmt(r.taxa)}</b></div>
    <div class="tot-line"><span>Total vendido</span><b>${fmt(r.total)}</b></div>
    <div class="tot-line"><span>Repasse da equipe (fica fora do caixa)</span><b style="color:var(--purple)">−${fmt(r.repasse)}</b></div>
    ${Object.entries(r.pessoas).map(([nome,p])=>`<div class="tot-line pend-pessoa"><span>↳ ${esc(nome)}${nome===eu?' (você)':''}${p.papeis.has('auxiliar')&&!p.papeis.has('vendedor')?' · auxiliar':''}</span><b style="color:var(--purple)">${fmt(p.valor)}</b></div>`).join('')}
    ${r.custoEquipe>0?`<div class="tot-line"><span>Custo dos produtos (não entra no repasse nem no caixa)</span><b class="muted">−${fmt(r.custoEquipe)}</b></div>`:''}
  </div>
  ${auxDe.length?`<p class="muted" style="font-size:12px;margin-top:8px">Pague aos auxiliares: ${auxDe.map(a=>esc(a.pagador)+' → '+esc(a.nome)+' '+fmt(a.valor)).join(' · ')}</p>`:''}
  <div class="pend-destaque"><span>VALOR PARA O CAIXA</span><b>${fmt(r.caixa)}</b></div>
  <p class="muted" style="font-size:12px">Confirme só depois de guardar exatamente este valor no caixa do jogo. As vendas entram no caixa do sistema agora, num lote com número próprio.</p>
  <p id="gc-err" style="color:var(--danger);font-size:13px;display:none"></p>
  <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
  <button class="btn btn-primary" id="gc-ok" onclick="confirmarGuardarCaixa()">Guardei ${fmt(r.caixa)} — confirmar</button></div>`);
}
async function confirmarGuardarCaixa(){
  const vendas=vendasPendentesVisiveis().filter(v=>selPend.has(v.id)&&pendenteSelecionavel(v));
  if(!vendas.length)return closeModal();
  const btn=document.getElementById('gc-ok');if(btn)btn.disabled=true;
  const{data,error}=await sb.rpc('guardar_vendas',{p_ids:vendas.map(v=>v.id)});
  if(error){const e=document.getElementById('gc-err');if(e){e.textContent='⚠️ '+error.message;e.style.display='block'}if(btn)btn.disabled=false;return}
  const dep={...data,total_vendas:Number(data.total_vendas),repasse:Number(data.repasse),valor_caixa:Number(data.valor_caixa)};
  (db.depositos=db.depositos||[]).unshift(dep);
  vendas.forEach(v=>{v.status='ativa';v.guardada_em=dep.data;v.deposito_id=dep.id});
  selPend.clear();
  reg('Vendas guardadas no caixa',`Lote ${dep.operacao_id||'—'} — ${dep.qtd_vendas} venda(s) — ${fmt(dep.valor_caixa)} no caixa`);
  closeModal();render();agendarSincronizacao();
  toast(`✅ Lote ${dep.operacao_id||''} guardado!\n${dep.qtd_vendas} venda(s) · ${fmt(dep.valor_caixa)} entraram no caixa.`);
}
function modalPedirCancelamento(id){
  const v=db.vendas.find(x=>x.id===id);if(!v)return;
  openModal(`<h3>Pedir cancelamento da venda ${esc(v.operacao_id||'')}</h3>
  <p class="muted" style="margin-bottom:12px">${esc((v.itens||[]).map(i=>i.qtd+'× '+i.nome).join(', '))} · ${fmt(v.total)}. Quem cuida das vendas da equipe aprova ou recusa. Enquanto isso a venda não pode ser guardada.</p>
  <div class="field"><label>Motivo</label><textarea id="pc-motivo" maxlength="300" rows="3" placeholder="ex.: lancei em dobro, cliente desistiu"></textarea></div>
  <p id="pc-err" style="color:var(--danger);font-size:13px;display:none"></p>
  <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Voltar</button>
  <button class="btn btn-danger" onclick="pedirCancelamento('${id}')">Pedir cancelamento</button></div>`);
}
async function pedirCancelamento(id){
  const motivo=(document.getElementById('pc-motivo').value||'').trim(),e=document.getElementById('pc-err');
  if(motivo.length<3){e.textContent='Informe o motivo.';e.style.display='block';return}
  const{error}=await sb.rpc('pedir_cancelamento_venda',{p_id:id,p_motivo:motivo});
  if(error){e.textContent='⚠️ '+error.message;e.style.display='block';return}
  const v=db.vendas.find(x=>x.id===id);
  if(v)Object.assign(v,{cancelamento_status:'pedido',cancelamento_motivo:motivo,cancelamento_pedido_por_nome:sessionUser().nome,cancelamento_pedido_em:nowISO()});
  selPend.delete(id);
  reg('Cancelamento de venda pedido',`ID ${v&&v.operacao_id||'—'} — ${motivo}`);
  closeModal();render();toast('✅ Pedido enviado. A venda fica parada até a resposta do gerente.');
}
function responderCancelamento(id,aprovar){
  if(!pode('vendas_equipe'))return;
  const v=db.vendas.find(x=>x.id===id);if(!v)return;
  confirmar(aprovar?'Aprovar cancelamento':'Recusar cancelamento',
    `Venda ${v.operacao_id||''} de ${v.usuario_nome||'—'} (${fmt(v.total)}). Motivo: ${v.cancelamento_motivo||'—'}. `+(aprovar?'A venda será revertida e não entra no caixa.':'A venda volta a esperar para ser guardada.'),
    async()=>{
      const{error}=await sb.rpc('responder_cancelamento_venda',{p_id:id,p_aprovar:aprovar});
      if(error)return toast('⚠️ '+error.message);
      Object.assign(v,{status:aprovar?'revertida':'pendente',cancelamento_status:aprovar?'aprovado':'recusado',cancelamento_respondido_por_nome:sessionUser().nome,cancelamento_respondido_em:nowISO()});
      reg(aprovar?'Cancelamento de venda aprovado':'Cancelamento de venda recusado',`ID ${v.operacao_id||'—'} — ${v.cancelamento_motivo||''}`);
      render();toast(aprovar?'✅ Venda cancelada.':'✅ Pedido recusado.');
    });
}
/* Vendedor auxiliar: escolhido entre os usuários ativos (menos quem está vendendo e quem já foi escolhido) */
function opcoesAuxiliar(sel,idx){
  const usados=pdvState.auxiliares.filter((a,i)=>i!==idx).map(a=>a.usuario_id);
  const us=usuariosOrdenados().filter(u=>u.status==='ativo'&&u.id!==session.usuario_id&&!usados.includes(u.id)).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  return `<option value="" disabled hidden ${sel?'':'selected'}>Selecione o vendedor auxiliar...</option>`+us.map(u=>`<option value="${u.id}" ${u.id===sel?'selected':''}>${esc(u.nome)}${u.usuario?' ('+esc(u.usuario)+')':''}</option>`).join('');
}
/* Repasse dividido igualmente entre o vendedor principal e os auxiliares, em valores inteiros (o jogo não tem centavos).
   Cada auxiliar recebe a parte inteira; a sobra do arredondamento fica com o vendedor principal. */
function repartirRepasse(cota,auxiliares){
  const lista=auxiliares||[],n=lista.length+1,parte=Math.floor((Number(cota)||0)/n);
  const aux=lista.map(a=>({...a,valor:parte,pct:Math.round(10000/n)/100}));
  return{aux,principal:Math.round(((Number(cota)||0)-parte*lista.length)*100)/100,pessoas:n};
}
function atualizarValoresAux(){
  const cup=calcCupom(),r=repartirRepasse(cup.cota,pdvState.auxiliares);
  r.aux.forEach((a,i)=>{const el=document.querySelector(`[data-aux-valor="${i}"]`);if(el)el.textContent=fmt(a.valor)});
  const box=document.getElementById('aux-resumo');
  if(box)box.innerHTML=`Repasse total <b>${fmt(cup.cota)}</b> dividido entre ${r.pessoas} pessoas · cada auxiliar <b>${fmt(r.aux[0]?r.aux[0].valor:0)}</b> · fica com você <b style="color:var(--purple)">${fmt(r.principal)}</b>`;
}
function addCupom(pid,qtd){
  const l=pdvState.cupom.find(x=>x.prodId===pid);
  if(l)l.qtd+=(qtd||1);else pdvState.cupom.push({prodId:pid,qtd:qtd||1});
  renderPDV(document.getElementById('main-content'));
}
function decCupom(pid){
  const l=pdvState.cupom.find(x=>x.prodId===pid);
  if(!l)return;
  l.qtd--;if(l.qtd<=0)pdvState.cupom=pdvState.cupom.filter(x=>x.prodId!==pid);
  renderPDV(document.getElementById('main-content'));
}
function setQtd(pid,v){
  const l=pdvState.cupom.find(x=>x.prodId===pid);if(!l)return;
  const n=parseInt(v);
  if(!n||n<1){renderPDV(document.getElementById('main-content'));return}
  l.qtd=n;
  renderPDV(document.getElementById('main-content'));
}
function rmCupom(pid){pdvState.cupom=pdvState.cupom.filter(x=>x.prodId!==pid);renderPDV(document.getElementById('main-content'))}
function limparCupom(){pdvState={cupom:[],parceriaId:null,taxaId:null,auxiliares:[]};renderPDV(document.getElementById('main-content'))}
async function finalizarVenda(){
  const cup=calcCupom();
  if(!cup.itens.length)return;
  const auxs=pdvState.auxiliares||[];
  if(auxs.some(a=>!a.usuario_id))return toast('⚠️ Selecione o vendedor auxiliar em todas as linhas (ou remova a linha).');
  let operacaoId;try{operacaoId=await nextOpId()}catch(err){return toast('⚠️ Erro ao gerar o ID da venda: '+(err.message||err))}
  const cabecalho={
    operacao_id:operacaoId,usuario_id:sessionUser().id,usuario_nome:sessionUser().nome,
    parceria_id:pdvState.parceriaId,parceria_nome:cup.parceria?cup.parceria.nome:null,
    taxa_id:pdvState.taxaId,taxa_nome:cup.taxa?cup.taxa.nome:null,taxa_valor:cup.taxaValor,
    subtotal:cup.subtotal,desconto:cup.desconto,pct_desconto:cup.pct,
    total:cup.total,cota_funcionario:cup.cota,receita_loja:cup.loja,custo_total:cup.custo,
    auxiliares:repartirRepasse(cup.cota,auxs).aux.map(a=>{const u=db.usuarios.find(x=>x.id===a.usuario_id);return{usuario_id:a.usuario_id,nome:u?u.nome:'?',pct:a.pct,valor:a.valor}}),
    status:'pendente'
  };
  const{data:vRow,error:e1}=await sb.from('vendas').insert(cabecalho).select().single();
  if(e1)return toast('⚠️ Erro ao registrar venda: '+e1.message);
  const itensRows=cup.itens.map(x=>({venda_id:vRow.id,produto_id:x.prod.id,nome:x.prod.nome,qtd:x.qtd,preco_unit:x.prod.preco,custo_unit:x.prod.custo||0,rateio:x.prod.rateio}));
  const{data:itensInseridos,error:e2}=await sb.from('venda_itens').insert(itensRows).select();
  if(e2){await sb.from('vendas').delete().eq('id',vRow.id);return toast('⚠️ Erro ao registrar itens da venda: '+e2.message)}
  const v={...vRow,itens:itensInseridos.map(i=>({produto_id:i.produto_id,nome:i.nome,qtd:Number(i.qtd),preco_unit:Number(i.preco_unit),custo_unit:Number(i.custo_unit||0),rateio:i.rateio})),custo_total:Number(vRow.custo_total||0)};
  db.vendas.unshift(v);
  reg('Venda finalizada',`ID ${v.operacao_id||'—'} — ${v.itens.map(i=>i.qtd+'× '+i.nome).join(', ')} — total ${fmt(v.total)}`);
  limparCupom();
  toast(`✅ Venda registrada como pendente!\nTotal: ${fmt(v.total)} · Repasse: ${fmt(v.cota_funcionario)}\nGuarde ${fmt(v.receita_loja)} no caixa e confirme em "Vendas a guardar".`);
  render();
}

/* ================= BAÚ ================= */
/* Categorias vêm da tabela categorias_itens (Configurações → Cadastro Central de Itens) */
function catInfo(c){return (db&&db.categorias||[]).find(x=>x.codigo===c)||{codigo:c,nome:c,controla_estoque:true,compravel:false,aparece_receitas:true}}
function catNome(c){return catInfo(c).nome}
function controlaEstoque(c){return !!catInfo(c).controla_estoque}
function catCompravel(c){return !!catInfo(c).compravel}
function catReceitas(c){return !!catInfo(c).aparece_receitas}
/* ---- Ordem manual (setas ↑ ↓ na coluna Ordem de todas as tabelas de Configurações) ---- */
function ordenarPorOrdem(arr){return arr.sort((a,b)=>(a.ordem??1e9)-(b.ordem??1e9)||String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR'))}
function proximaOrdem(arr){return Math.max(0,...arr.map(x=>x.ordem||0))+1}
function setasOrdem(fn,id){return `<td style="white-space:nowrap"><button class="iconbtn btn-ordem" title="Subir" onclick="${fn}('${esc(id)}',-1)">↑</button><button class="iconbtn btn-ordem" title="Descer" onclick="${fn}('${esc(id)}',1)">↓</button></td>`}
/* quem reordena cada lista (mesma permissão que edita o cadastro) */
const PERM_ORDEM={produtos:'catalogo',itens:'itens',categorias_itens:'itens',receitas:'receitas',categorias_receitas:'receitas',fornecedores:'fornecedores',parcerias:'descontos',taxas_deslocamento:'descontos',perfis_acesso:'perfis'};
async function moverNaOrdem(tabela,arr,chave,id,dir){
  if(!pode(PERM_ORDEM[tabela]||'catalogo'))return toast('⚠️ Seu perfil não pode reordenar esta lista.');
  const lista=ordenarPorOrdem([...arr]),i=lista.findIndex(x=>x[chave]===id),j=i+dir;
  if(i<0||j<0||j>=lista.length)return;
  // garante ordens únicas e sequenciais antes de trocar (registros sem ordem ou repetidos)
  if(lista.some((x,k)=>x.ordem!==k+1)){
    const res=await Promise.all(lista.map((x,k)=>x.ordem===k+1?null:sb.from(tabela).update({ordem:k+1}).eq(chave,x[chave])).filter(Boolean));
    if(res.some(r=>r.error))return toast('⚠️ Erro ao reordenar.');
    lista.forEach((x,k)=>x.ordem=k+1);
  }
  const x=lista[i],y=lista[j],ox=x.ordem,oy=y.ordem;
  const[r1,r2]=await Promise.all([sb.from(tabela).update({ordem:oy}).eq(chave,x[chave]),sb.from(tabela).update({ordem:ox}).eq(chave,y[chave])]);
  if(r1.error||r2.error)return toast('⚠️ Erro ao reordenar.');
  x.ordem=oy;y.ordem=ox;ordenarPorOrdem(arr);render();
}

/* Baú: movimentos da mesma operação (produção, produção em cascata, compra com vários insumos) viram um lançamento com sublinhas */
function agruparBau(todos,filtrados){
  const ok=new Set(filtrados.map(m=>m.id)),porOp={};
  todos.forEach(m=>{const k=m.operacao_id||('m:'+m.id);(porOp[k]=porOp[k]||[]).push(m)});
  return Object.entries(porOp).map(([chave,ms])=>{
    const passam=ms.filter(m=>ok.has(m.id));if(!passam.length)return null;
    // ordem lógica: etapas anteriores da cascata primeiro; dentro de cada etapa, saídas antes das entradas
    const pos=m=>(/\(para /.test(m.origem||'')?0:1)*10+(m.tipo_movimento.startsWith('entrada')||m.tipo_movimento==='ajuste_entrada'?1:0);
    ms.sort((a,b)=>(new Date(a.data)-new Date(b.data))||(pos(a)-pos(b)));
    const data=ms.reduce((d,m)=>m.data>d?m.data:d,ms[0].data);
    if(ms.length===1)return{grupo:false,chave,movs:ms,ids:[ms[0].id],data};
    const o=(ms[0].origem||'').toLowerCase(),cascata=o.startsWith('produção em cascata'),compra=ms.every(m=>m.tipo_movimento==='entrada_compra'),venda=ms.every(m=>m.tipo_movimento==='saida_venda'),producao=!compra&&ms.some(m=>/producao|deducao/.test(m.tipo_movimento));
    const rotulo=compra?'Compra':venda?'Venda':producao?'Produção':'Lançamento';
    const origem=cascata?(ms.find(m=>/\(para /.test(m.origem||''))?.origem.match(/\(para (.*)\)/)?.[1]||ms[0].origem):compra?[...new Set(ms.map(m=>(m.origem||'').replace(/^compra:\s*/,'')))].join(' + '):(ms[0].origem||'—');
    const nomes=[...new Set(ms.map(m=>m.item_nome))];
    return{grupo:true,chave,movs:ms,filhos:ms.filter(m=>ok.has(m.id)),ids:ms.map(m=>m.id),data,usuario:ms[0].usuario_nome||'—',rotulo,
      origem:(cascata?'para ':'')+origem,resumoItens:nomes.length<=2?nomes.join(', '):nomes.slice(0,2).join(', ')+' +'+(nomes.length-2)};
  }).filter(Boolean).sort((a,b)=>new Date(b.data)-new Date(a.data));
}

/* Baú: um lançamento (grupo ou movimento avulso) é revertido por inteiro — sai do saldo mas continua no livro. Só depois de revertido pode ser excluído. */
function movsDoLancamentoBau(chave){return db.estoque_bau.filter(m=>(m.operacao_id||('m:'+m.id))===chave)}
function acoesBauVis(){return pode('bau_gerir')||pode('excluir_lancamentos')}
function acoesBau(chave,revertido){
  // saída de venda: volta ao Baú quando a venda é revertida no Histórico Financeiro (não se reverte por aqui)
  if(!revertido&&movsDoLancamentoBau(chave).some(m=>m.tipo_movimento==='saida_venda'&&m.status!=='revertida'))
    return '<span class="muted" style="font-size:11px" title="Volta ao Baú quando a venda é revertida no Histórico Financeiro">pela venda</span>';
  if(!revertido)return pode('bau_gerir')?`<button class="iconbtn" title="Reverter lançamento" onclick="reverterLancamentoBau('${chave}')">↩️</button>`:'';
  return pode('excluir_lancamentos')?`<button class="iconbtn" title="Excluir lançamento" onclick="excluirGrupoBau('${chave}')">🗑️</button>`:'';
}
/* Itens que ficariam com saldo negativo se estes movimentos fossem revertidos (ex.: compra já consumida em produção) */
function saldoNegativoAoReverter(ms){
  const delta={};
  ms.forEach(m=>{const ent=m.tipo_movimento.startsWith('entrada')||m.tipo_movimento==='ajuste_entrada';delta[m.item_id]=(delta[m.item_id]||0)+(ent?-m.quantidade:m.quantidade)});
  return Object.entries(delta).filter(([id,d])=>saldoItem(id)+d<0).map(([id,d])=>{const it=db.itens.find(i=>i.id===id);return (it?it.nome:'?')+' (ficaria '+(saldoItem(id)+d)+')'});
}
async function reverterMovsBau(ms){
  const ids=ms.map(m=>m.id),itens=[...new Set(ms.map(m=>m.item_id))];
  const{error}=await sb.from('estoque_bau').update({status:'revertida'}).in('id',ids);
  if(error){toast('⚠️ Erro ao reverter: '+error.message);return false}
  ms.forEach(m=>{m.status='revertida'});
  for(const it of itens)await recalcularSaldosItem(it);
  return true;
}
function reverterLancamentoBau(chave){
  if(!pode('bau_gerir'))return toast('⚠️ Seu perfil não pode reverter lançamentos.');
  const ms=movsDoLancamentoBau(chave).filter(m=>m.status!=='revertida');if(!ms.length)return;
  if(ms.some(m=>m.tipo_movimento==='saida_venda'))return toast('⚠️ Saída de venda: reverta a venda no Histórico Financeiro e o produto volta ao Baú.');
  const neg=saldoNegativoAoReverter(ms);
  if(neg.length)return toast('⚠️ Não é possível reverter: o saldo ficaria negativo em '+neg.join(', ')+'. Reverta antes as produções/saídas que usaram esse estoque.');
  confirmar('Reverter lançamento do Baú',(ms.length>1?'As '+ms.length+' movimentações deste lançamento deixarão de contar no saldo (continuam no livro como revertidas).':'A movimentação deixará de contar no saldo (continua no livro como revertida).')+' Confirmar?',async()=>{
    if(!await reverterMovsBau(ms))return;
    reg('Lançamento do Baú revertido',chave+' — '+ms.length+' movimentação(ões)');render();toast('✅ Lançamento revertido.');
  });
}
async function reverterSelecionadasBau(){
  if(!pode('bau_gerir'))return toast('⚠️ Seu perfil não pode reverter lançamentos.');
  const ids=[...selExclusao.bau];
  const ms=db.estoque_bau.filter(m=>ids.includes(m.id)&&m.status!=='revertida');
  if(!ms.length)return toast('ℹ️ Nada selecionado precisa ser revertido — já pode excluir.');
  if(ms.some(m=>m.tipo_movimento==='saida_venda'))return toast('⚠️ A seleção tem saída de venda: reverta a venda no Histórico Financeiro e o produto volta ao Baú.');
  const neg=saldoNegativoAoReverter(ms);
  if(neg.length)return toast('⚠️ Não é possível reverter: o saldo ficaria negativo em '+neg.join(', ')+'.');
  confirmar('Reverter selecionadas',ms.length+' movimentação(ões) deixarão de contar no saldo. Confirmar?',async()=>{
    if(!await reverterMovsBau(ms))return;
    reg('Reversão em lote (Baú)',ms.length+' movimentação(ões)');render();toast('✅ Revertido(s). A seleção continua marcada — pode excluir agora.');
  });
}
function excluirGrupoBau(chave){
  if(!pode('excluir_lancamentos'))return toast('⚠️ Seu perfil não pode excluir lançamentos.');
  const ms=movsDoLancamentoBau(chave);if(!ms.length)return;
  if(ms.some(m=>m.status!=='revertida'))return toast('⚠️ Reverta o lançamento (↩️) antes de excluir.');
  confirmar('Excluir lançamento do Baú',(ms.length>1?`As ${ms.length} movimentações deste lançamento serão removidas`:'A movimentação será removida')+' definitivamente do livro. Confirmar?',async()=>{
    const ids=ms.map(m=>m.id),itens=[...new Set(ms.map(m=>m.item_id))];
    const{error}=await sb.from('estoque_bau').delete().in('id',ids);
    if(error)return toast('⚠️ Erro ao excluir: '+error.message);
    db.estoque_bau=db.estoque_bau.filter(m=>!ids.includes(m.id));
    for(const it of itens)await recalcularSaldosItem(it);
    ids.forEach(id=>selExclusao.bau.delete(id));
    reg('Lançamento do Baú excluído',chave+' — '+ids.length+' movimentação(ões)');render();toast('✅ Lançamento excluído.');
  });
}
