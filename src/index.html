function usuariosOrdenados(){return [...db.usuarios].sort((a,b)=>ordemPerfil(a)-ordemPerfil(b)||String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR',{sensitivity:'base'}))}
function cfgUsuarios(b){
  if(!pode('usuarios'))return cfgMeuPerfil(b);
  const T='cfg_usuarios',F=tabelaFiltravel(T,usuariosOrdenados,{nome:u=>u.nome,usuario:u=>u.usuario||'—',perfil:u=>nomePerfil(perfilIdDe(u)),status:u=>u.status,primeiro_acesso:u=>primeiroAcessoFeito(u)?'Feito':'Pendente',data:u=>u.criado_em});
  b.innerHTML=`${avisoPedidosSenha()}<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div class="section-title" style="margin:0">👥 Usuários${ajuda('Quem acessa o sistema e com qual perfil. O que cada perfil pode fazer fica em Usuários › Perfis (para quem gerencia perfis). Você gerencia quem tem um perfil com permissões iguais ou menores que as suas; só o Sócio gerencia Sócios. Ninguém altera o próprio perfil e sempre existe ao menos um Sócio ativo. Pedido de nova senha aparece destacado aqui.',['cfg_usuarios'])}</div>
    <button class="btn btn-purple btn-sm" onclick="modalUsuario()">+ Novo usuário</button></div>
  ${F.barra}<div class="table-wrap"><table>
  <tr>${thCol(T,'nome','Nome')}${thCol(T,'usuario','Usuário')}${thCol(T,'perfil','Perfil')}${thCol(T,'status','Status')}${thCol(T,'primeiro_acesso','Primeiro acesso')}${thCol(T,'data','Criado em')}<th>Ações</th></tr>
  ${F.rows.map(u=>{
    const ehUltimoSocio=ehSocio(u)&&u.status==='ativo'&&sociosAtivosAlem(u.id)<1;
    const ped=pedidoSenhaDe(u.id),podeU=podeGerenciarUsuario(u)&&u.id!==session.usuario_id;
    return`<tr class="${ped?'linha-pedido-senha':''}${u.status!=='ativo'?' linha-inativa':''}">
    <td><span class="u-nome-foto">${fotoUsuarioHTML(u,32)}<span><b>${esc(u.nome)}</b>${u.id===session.usuario_id?' <span class="tag">você</span>':''}</span></span>${ped?`<br><span class="tag y" title="Pedido feito na tela de login">🔑 pediu nova senha · ${dataHoraBR(ped.criado_em)}</span>`:''}</td>
    <td style="color:var(--muted)">${esc(u.usuario||'—')}</td>
    <td>${seloPerfil(u)}</td>
    <td><span class="badge ${u.status==='ativo'?'ativo':'inativo'}">${u.status}</span></td>
    <td>${primeiroAcessoFeito(u)?`<span class="tag g" title="${u.ultimo_login?'Último acesso: '+dataHoraBR(u.ultimo_login):'Já criou a própria senha'}">✅ Feito</span>`:`<span class="tag y" title="Ainda não entrou para criar a própria senha">⏳ Pendente</span>`}</td>
    <td style="color:var(--muted)">${dataHoraBR(u.criado_em)}</td>
    <td><button class="iconbtn" title="${ped&&podeU?'Editar e definir a senha nova':'Editar'}" onclick="modalUsuario('${u.id}')">✏️</button>${ped&&podeU?`<button class="iconbtn" title="Dispensar o pedido (a senha continua a mesma)" onclick="dispensarPedidoSenha('${ped.id}')">✕</button>`:''}
      ${u.id!==session.usuario_id&&podeGerenciarUsuario(u)?`<button class="iconbtn" title="${u.status==='ativo'?'Inativar':'Ativar'}" onclick="toggleStatusUsuario('${u.id}')">${u.status==='ativo'?'⏸️':'▶️'}</button>`:''}
      ${u.id!==session.usuario_id&&podeGerenciarUsuario(u)&&pode('usuarios_excluir')&&u.status!=='ativo'?`<button class="iconbtn" title="Excluir linha" onclick="excluirUsuario('${u.id}')">🗑️</button>`:''}
      ${ehUltimoSocio?'<span class="tag y" title="Deve existir ao menos um sócio ativo">🔒 último sócio</span>':''}</td>
  </tr>`}).join('')||linhaSemResultado(7,T)}</table></div>`;
}
/* ---- Pedidos de nova senha (feitos na tela de login) ----
   Não existe senha padrão: quem esqueceu pede na tela de login, o pedido destaca a linha da pessoa em Usuários
   e alguém com permissão edita o usuário (✏️) e define uma senha nova. A pessoa troca no primeiro acesso. */
/* Primeiro acesso feito = a pessoa já entrou e criou a própria senha (sem troca obrigatória pendente).
   Depois que alguém define uma senha nova para ela, volta a ficar pendente até ela entrar e trocar. */
function primeiroAcessoFeito(u){return !u.troca_senha_obrigatoria}
function pedidoSenhaDe(uid){return (db.pedidos_senha||[]).find(p=>p.usuario_id===uid)}
function avisoPedidosSenha(){
  const n=(db.pedidos_senha||[]).length;if(!n)return '';
  return `<div class="alert-banner aviso-pedido-senha" style="margin-bottom:14px">🔑 <b>${n} pedido(s) de nova senha.</b> A linha da pessoa está destacada abaixo: toque em ✏️, digite uma senha nova, salve e passe a senha para ela. No primeiro acesso ela cria a própria senha.</div>`;
}
function dispensarPedidoSenha(pid){
  const x=(db.pedidos_senha||[]).find(p=>p.id===pid);if(!x)return;
  confirmar('Dispensar pedido','O pedido de "'+x.usuario+'" sai da lista e a senha continua a mesma. Confirmar?',async()=>{
    await resolverPedidoSenha(x,'recusada');reg('Pedido de nova senha dispensado',x.usuario);
  });
}
async function resolverPedidoSenha(x,status){
  const{error}=await sb.from('solicitacoes_senha').update({status,resolvido_em:nowISO(),resolvido_por:session.usuario_id,resolvido_por_nome:sessionUser().nome}).eq('id',x.id);
  if(error)toast('⚠️ Erro ao atualizar o pedido: '+error.message);
  db.pedidos_senha=db.pedidos_senha.filter(p=>p.id!==x.id);render();
}
/* v4.39: gerencia quem tem perfil com permissões iguais ou menores (podeGerirPerfil); Sócio só outro Sócio.
   Mesma regra do banco (pode_gerir_perfil) e da função admin-users. */
function podeGerenciarUsuario(alvo){return !!alvo&&podeGerirPerfil(perfilIdDe(alvo))}
function modalUsuario(id){
  const u=id?db.usuarios.find(x=>x.id===id):null;
  if(u&&u.id===session.usuario_id&&!podeGerenciarUsuario(u))return modalMeuPerfil();
  if(u&&!podeGerenciarUsuario(u))return toast('⚠️ Você não tem permissão para editar '+nomePerfil(perfilIdDe(u))+'.');
  const ehUltimoSocio=u&&ehSocio(u)&&u.status==='ativo'&&sociosAtivosAlem(u.id)<1;
  // ninguém altera o próprio perfil; só aparecem os perfis que a pessoa pode dar (permissões iguais ou menores)
  const atual=u?perfilIdDe(u):null;
  const opcoes=perfisOrdenados().filter(p=>p.id===atual||podeGerirPerfil(p.id));
  const podePerfil=(!u||(u.id!==session.usuario_id&&!ehUltimoSocio))&&opcoes.length>0;
  const padrao=u?atual:(opcoes.find(p=>p.id==='vendedor')||opcoes[opcoes.length-1]||{}).id;
  const ped=u?pedidoSenhaDe(u.id):null;
  _fotoU={file:null,tirar:false};
  openModal(`<h3>${u?'Editar usuário':'Novo usuário'}</h3>
  ${ped?`<div class="alert-banner aviso-pedido-senha" style="margin-bottom:14px">🔑 <b>${esc(u.nome)}</b> pediu nova senha em ${dataHoraBR(ped.criado_em)}. Digite uma senha nova abaixo, salve e passe para a pessoa. No primeiro acesso ela cria a própria senha.</div>`:''}
  <div class="field"><label>Nome</label><input id="u-nome" value="${u?esc(u.nome):''}"></div>
  ${pode('usuarios')?`<div class="field"><label>Foto do personagem <small style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted)">(aparece no vendedor ouro; sem foto, vão as iniciais)</small></label>
    <div class="u-foto-campo"><span id="u-foto-prev">${fotoUsuarioHTML(u||{nome:''},88)}</span>
      <div class="u-foto-bts"><label class="btn btn-ghost btn-sm aviso-img-btn">🖼️ Escolher foto<input type="file" id="u-foto" accept="image/png,image/jpeg,image/webp" hidden onchange="escolherFotoUsuario(this)"></label>
      <button type="button" class="btn btn-ghost btn-sm" id="u-foto-tirar" onclick="tirarFotoUsuario()" style="${u&&u.foto_url?'':'display:none'}">Tirar foto</button>
      <small style="color:var(--muted);font-size:11px">PNG, JPG ou WebP. O centro da imagem vira um quadrado.</small></div></div></div>`:''}
  <div class="row2">
    <div class="field"><label>Nome de usuário (login)</label><input id="u-usuario" value="${u?esc(u.usuario||''):''}" placeholder="ex.: joao.silva"></div>
    <div class="field"><label>Perfil</label><select id="u-perfil" ${podePerfil?'':'disabled'}>
      ${opcoes.map(p=>`<option value="${esc(p.id)}" ${p.id===padrao?'selected':''} ${p.id!==atual&&!podeGerirPerfil(p.id)?'disabled':''}>${esc(p.nome)}</option>`).join('')}</select>
      ${podePerfil?`<small style="color:var(--muted);font-size:11px">Só aparecem os perfis com permissões iguais ou menores que as suas.</small>`:`<small style="color:var(--muted);font-size:11px">${ehUltimoSocio?'Último sócio ativo — perfil travado':u&&u.id===session.usuario_id?'Você não pode alterar o próprio perfil':'Você não pode mudar este perfil'}</small>`}</div>
  </div>
  <div class="field"><label>${ped?'Senha nova (mín. 6 caracteres)':u?'Senha (deixe vazio p/ manter)':'Senha inicial (mín. 6 caracteres)'}</label><input id="u-senha" type="text" autocomplete="off" autocapitalize="none" spellcheck="false"><small style="color:var(--muted);font-size:11px">Passe esta senha só para a própria pessoa. No primeiro acesso ela é obrigada a criar outra.</small></div>
  <p id="u-err" style="color:var(--danger);font-size:13px;display:none"></p>
  <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
  <button class="btn btn-purple" onclick="salvarUsuario('${id||''}')">Salvar</button></div>`);
}
/* ---- Meu perfil (pedido do dono, v4.38): cada pessoa muda o próprio nome e a foto do personagem ----
   O vendedor vê em Configurações só a aba Usuários, com a própria linha (não vê o login dos outros).
   O banco garante: na própria linha, quem não é Gerente ou acima não muda login, perfil nem status;
   a foto só pode ser arquivo dela (midia/perfis/<id>-*), migração 20261011000000. */
function cfgMeuPerfil(b){
  const u=sessionUser();if(!u){b.innerHTML='';return}
  b.innerHTML=`<div class="section-title" style="margin:0 0 6px">👤 Meu perfil</div>
  <p class="muted" style="font-size:13px;margin:0 0 12px">Toque em ✏️ para trocar o seu nome e a foto do seu personagem (ela aparece no vendedor ouro).</p>
  <div class="table-wrap"><table><tr><th>Nome</th><th>Usuário</th><th>Perfil</th><th>Ações</th></tr>
  <tr><td><span class="u-nome-foto">${fotoUsuarioHTML(u,32)}<span><b>${esc(u.nome)}</b> <span class="tag">você</span></span></span></td>
    <td style="color:var(--muted)">${esc(u.usuario||'—')}</td><td>${seloPerfil(u)}</td>
    <td><button class="iconbtn" title="Editar meu nome e foto" onclick="modalMeuPerfil()">✏️</button></td></tr></table></div>`;
}
function modalMeuPerfil(){
  const u=sessionUser();if(!u)return;
  _fotoU={file:null,tirar:false};
  openModal(`<h3>Meu perfil</h3>
  <div class="field"><label>Nome</label><input id="u-nome" maxlength="60" value="${esc(u.nome||'')}"></div>
  <div class="field"><label>Foto do personagem <small style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted)">(aparece no vendedor ouro; sem foto, vão as iniciais)</small></label>
    <div class="u-foto-campo"><span id="u-foto-prev">${fotoUsuarioHTML(u,88)}</span>
      <div class="u-foto-bts"><label class="btn btn-ghost btn-sm aviso-img-btn">🖼️ Escolher foto<input type="file" id="u-foto" accept="image/png,image/jpeg,image/webp" hidden onchange="escolherFotoUsuario(this)"></label>
      <button type="button" class="btn btn-ghost btn-sm" id="u-foto-tirar" onclick="tirarFotoUsuario()" style="${u.foto_url?'':'display:none'}">Tirar foto</button>
      <small style="color:var(--muted);font-size:11px">PNG, JPG ou WebP. O centro da imagem vira um quadrado.</small></div></div></div>
  <p class="muted" style="font-size:12px;margin:0">Login, perfil e senha só quem gerencia usuários muda.</p>
  <p id="u-err" style="color:var(--danger);font-size:13px;display:none"></p>
  <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
  <button class="btn btn-purple" id="btn-meu-perfil" onclick="salvarMeuPerfil()">Salvar</button></div>`);
}
async function salvarMeuPerfil(){
  const u=sessionUser();if(!u)return;
  const nome=document.getElementById('u-nome').value.trim(),e=document.getElementById('u-err');
  const fail=m=>{e.textContent=m;e.style.display='block'};
  if(!nome||nome.length>60)return fail('O nome precisa ter de 1 a 60 letras.');
  const bt=document.getElementById('btn-meu-perfil');if(bt)bt.disabled=true;
  if(nome!==u.nome){
    const{error}=await sb.from('profiles').update({nome}).eq('id',u.id);
    if(error){if(bt)bt.disabled=false;return fail('Erro ao salvar: '+error.message)}
    reg('Perfil editado','nome: '+u.nome+' → '+nome);u.nome=nome;
  }
  await salvarFotoUsuario(u);
  closeModal();buildNav();render();toast('✅ Perfil salvo.');
}
let _fotoU={file:null,tirar:false};
function escolherFotoUsuario(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  if(!['image/png','image/jpeg','image/webp'].includes(f.type))return toast('⚠️ Formato inválido. Use PNG, JPG ou WebP.');
  _fotoU={file:f,tirar:false};
  document.getElementById('u-foto-prev').innerHTML=`<img class="foto-u" src="${URL.createObjectURL(f)}" alt="Prévia da foto" style="width:88px;height:88px">`;
  document.getElementById('u-foto-tirar').style.display=''}
function tirarFotoUsuario(){_fotoU={file:null,tirar:true};
  document.getElementById('u-foto-prev').innerHTML=fotoUsuarioHTML({nome:document.getElementById('u-nome').value},88);
  document.getElementById('u-foto-tirar').style.display='none'}
// grava a foto escolhida (ou tira) depois que o usuário foi salvo; o arquivo antigo sai do Storage
async function salvarFotoUsuario(u){
  if(!_fotoU.file&&!_fotoU.tirar)return true;
  const velha=u.foto_url;let nova=null;
  try{if(_fotoU.file)nova=await uploadImagem(await fotoQuadrada(_fotoU.file),'perfis',u.id)}catch(err){toast('⚠️ Usuário salvo, mas a foto não foi enviada: '+(err.message||err));return false}
  const{error}=await sb.from('profiles').update({foto_url:nova}).eq('id',u.id);
  if(error){if(nova)sb.storage.from('midia').remove(['perfis/'+nova.split('/').pop()]).then(()=>{});toast('⚠️ Usuário salvo, mas a foto não: '+error.message);return false}
  if(velha)sb.storage.from('midia').remove(['perfis/'+velha.split('/').pop()]).then(()=>{});
  u.foto_url=nova;reg(nova?'Foto do usuário trocada':'Foto do usuário tirada',u.nome);return true;
}
const ADMIN_USERS_URL=SUPABASE_URL+'/functions/v1/admin-users';
async function chamarAdminUsers(payload){
  const{data:{session:sessAuth}}=await sb.auth.getSession();
  const r=await fetch(ADMIN_USERS_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json',...(sessAuth?.access_token?{'Authorization':'Bearer '+sessAuth.access_token}:{})},
    body:JSON.stringify(payload)
  });
  const j=await r.json().catch(()=>({error:'Resposta inválida do servidor.'}));
  if(!r.ok)throw new Error(j.error||'Erro desconhecido.');
  return j;
}
async function salvarUsuario(id){
  const nome=document.getElementById('u-nome').value.trim();
  const usuario=document.getElementById('u-usuario').value.trim().toLowerCase().replace(/\s+/g,'.');
  const senha=document.getElementById('u-senha').value;
  const selPerfil=document.getElementById('u-perfil');
  const perfil=selPerfil.disabled?(id?perfilIdDe(db.usuarios.find(x=>x.id===id)):'vendedor'):selPerfil.value;
  const e=document.getElementById('u-err');
  const fail=m=>{e.textContent=m;e.style.display='block'};
  if(!nome||!usuario)return fail('Informe nome e nome de usuário.');
  if(db.usuarios.some(x=>(x.usuario||'').toLowerCase()===usuario&&x.id!==id))return fail('Nome de usuário já existe.');
  if(!id&&senha.length<6)return fail('Senha deve ter no mínimo 6 caracteres.');
  if(senha&&senha.length<6)return fail('Senha deve ter no mínimo 6 caracteres.');
  if(id){
    const u=db.usuarios.find(x=>x.id===id);
    if(!podeGerenciarUsuario(u))return fail('Você não tem permissão para editar este usuário.');
    const perfilAntes=perfilIdDe(u);
    if(perfil!==perfilAntes){
      if(u.id===session.usuario_id)return fail('Você não pode alterar o seu próprio perfil.');
      if(!podeGerirPerfil(perfil))return fail('Você não pode dar o perfil '+nomePerfil(perfil)+' (tem permissões que você não tem).');
      if(perfilAntes==='socio'&&u.status==='ativo'&&sociosAtivosAlem(u.id)<1)return fail('Deve existir ao menos um sócio ativo.');
    }
    const{error}=await sb.from('profiles').update({nome,usuario,perfil_acesso:perfil}).eq('id',id);
    if(error)return fail('Erro ao salvar: '+error.message);
    if(senha){
      try{await chamarAdminUsers({action:'reset_password',targetUserId:id,senha})}catch(err){return fail('Usuário salvo, mas a senha não foi redefinida: '+err.message)}
      u.troca_senha_obrigatoria=true;
      // senha nova definida: o pedido pendente dessa pessoa está atendido
      for(const x of (db.pedidos_senha||[]).filter(p=>p.usuario_id===id))await resolverPedidoSenha(x,'aprovada');
      reg('Senha redefinida',nome);
    }
    u.nome=nome;u.usuario=usuario;u.perfil_acesso=perfil;
    reg('Usuário editado',nome+' ('+nomePerfil(perfil)+')');
    await salvarFotoUsuario(u);
  }else{
    if(!podeGerirPerfil(perfil))return fail('Você não pode criar usuário com o perfil '+nomePerfil(perfil)+'.');
    let resp;
    try{resp=await chamarAdminUsers({action:'create',nome,usuario,perfil,senha})}catch(err){return fail(err.message)}
    const novo={id:resp.id,nome,usuario,perfil:['socio','diretor','gerente'].includes(perfil)?perfil:'vendedor',perfil_acesso:perfil,status:'ativo',troca_senha_obrigatoria:true,criado_em:nowISO(),ultimo_login:null,foto_url:null};
    db.usuarios.push(novo);
    reg('Usuário criado',`${nome} (${nomePerfil(perfil)})`);
    await salvarFotoUsuario(novo);
  }
  closeModal();render();
}
async function toggleStatusUsuario(id){
  const u=db.usuarios.find(x=>x.id===id);if(!u)return;
  if(u.id===session.usuario_id)return toast('⚠️ Você não pode inativar a sua própria conta.');
  if(!podeGerenciarUsuario(u))return toast('⚠️ Você não tem permissão para alterar '+nomePerfil(perfilIdDe(u))+'.');
  if(ehSocio(u)&&u.status==='ativo'&&sociosAtivosAlem(u.id)<1)return toast('⚠️ Deve existir ao menos um sócio ativo.');
  const novo=u.status==='ativo'?'inativo':'ativo';
  const{error}=await sb.from('profiles').update({status:novo}).eq('id',id);
  if(error)return toast('⚠️ Erro ao alterar status: '+error.message);
  u.status=novo;
  reg('Usuário '+(u.status==='ativo'?'ativado':'inativado'),u.nome);
  render();
}
function excluirUsuario(id){
  if(!pode('usuarios_excluir'))return toast('⚠️ Seu perfil não exclui usuários.');
  const u=db.usuarios.find(x=>x.id===id);if(!u)return;
  if(!podeGerenciarUsuario(u))return toast('⚠️ Você não pode excluir quem tem o perfil '+nomePerfil(perfilIdDe(u))+'.');
  if(u.status==='ativo')return toast('⚠️ Para excluir, o usuário deve estar inativo primeiro.');
  confirmar('Excluir linha de usuário',`"${u.nome}" será removido definitivamente. O histórico comercial será preservado. Confirmar?`,async()=>{
    try{await chamarAdminUsers({action:'delete_auth_user',targetUserId:id})}catch(err){return toast('⚠️ Erro ao excluir: '+err.message)}
    db.usuarios=db.usuarios.filter(x=>x.id!==id);
    reg('Usuário excluído',u.nome);
    render();
  });
}
/* ---- Catálogo PDV (com alíquota global, imagem e exclusão) ---- */
function cfgProdutos(b){

function pImgTmp(input){
  const f=input.files[0];if(!f)return;
  if(!['image/png','image/jpeg','image/webp'].includes(f.type))return toast('⚠️ Formato inválido. Use PNG, JPG ou WebP.');
  window._pImgFile=f;
  const r=new FileReader();
  r.onload=()=>{document.getElementById('p-img-prev').innerHTML=`<img src="${r.result}" style="width:100%;height:100%;object-fit:cover">`};
  r.readAsDataURL(f);
}
async function salvarProduto(id){
  const nome=document.getElementById('p-nome').value.trim();
  const preco=parseFloat(document.getElementById('p-preco').value);
  const rateio=document.getElementById('p-rateio').value;
  const custoTxt=document.getElementById('p-custo').value.trim(),custo=custoTxt===''?0:parseFloat(custoTxt);
  const e=document.getElementById('p-err');
  if(!nome||!(preco>=0)){e.textContent='Informe nome e preço válido.';e.style.display='block';return}
  if(!(custo>=0)){e.textContent='Informe um custo válido (0 ou mais).';e.style.display='block';return}
  if(custo>preco){e.textContent='O custo não pode ser maior que o preço.';e.style.display='block';return}
  let imagemUrl=id?(db.produtos.find(x=>x.id===id)||{}).imagem||null:null;
  if(window._pImgFile){
    try{imagemUrl=await uploadImagem(window._pImgFile,'produtos')}catch(err){e.textContent='Erro ao enviar imagem: '+err.message;e.style.display='block';return}
  }
  const campos={nome,preco,custo,rateio,imagem_url:imagemUrl};
  if(id){
    const{error}=await sb.from('produtos').update(campos).eq('id',id);
    if(error){e.textContent='Erro ao salvar: '+error.message;e.style.display='block';return}
    const precoAntes=Number((db.produtos.find(x=>x.id===id)||{}).preco);
    Object.assign(db.produtos.find(x=>x.id===id),{nome,preco,custo,rateio,imagem:imagemUrl});
    reg('Produto editado',nome+(precoAntes!==preco?' (preço '+precoCurto(precoAntes)+' → '+precoCurto(preco)+')':''));
  }else{
    const{data,error}=await sb.from('produtos').insert({...campos,ordem:proximaOrdem(db.produtos),criado_por:sessionUser().id}).select().single();
    if(error){e.textContent='Erro ao salvar: '+error.message;e.style.display='block';return}
    db.produtos.push({...data,preco:Number(data.preco),custo:Number(data.custo||0),imagem:data.imagem_url});
    reg('Produto criado',nome);
  }
  window._pImgFile=null;closeModal();render();agendarSincronizacao(); // o item "Produto Final" do produto é criado/atualizado pelo banco
}
async function toggleProduto(id){
  const p=db.produtos.find(x=>x.id===id);
  const novo=p.status==='ativo'?'inativo':'ativo';
  const{error}=await sb.from('produtos').update({status:novo}).eq('id',id);
  if(error)return toast('⚠️ Erro: '+error.message);
  p.status=novo;reg('Produto '+(novo==='ativo'?'ativado':'inativado'),p.nome);render();agendarSincronizacao();
}
function excluirProduto(id){
  if(!pode('excluir_cadastros'))return toast('⚠️ Seu perfil não pode excluir cadastros.');
  const p=db.produtos.find(x=>x.id===id);if(!p)return;
  if(p.status==='ativo')return toast('⚠️ Inative o cadastro (⏸️) antes de excluir.');
  confirmar('Excluir produto',`"${p.nome}" será removido do catálogo. Vendas antigas permanecem no histórico. Confirmar?`,async()=>{
    const{error}=await sb.from('produtos').delete().eq('id',id);
    if(error)return toast('⚠️ Erro ao excluir: '+error.message);
    db.produtos=db.produtos.filter(x=>x.id!==id);

  });

async function salvarCategoria(codigo){
  if(!pode('itens'))return toast('⚠️ Seu perfil não cadastra categorias de itens.');
  const c=codigo?db.categorias.find(x=>x.codigo===codigo):null;
  const nome=document.getElementById('cat-nome').value.trim();
  const estoque=document.getElementById('cat-estoque').checked;
  const campos={compravel:document.getElementById('cat-compravel').checked,aparece_receitas:document.getElementById('cat-receitas').checked};
  if(!nome)return toast('⚠️ Informe o nome da categoria.');
  if(db.categorias.some(x=>x.nome.toLowerCase()===nome.toLowerCase()&&x.codigo!==codigo))return toast('⚠️ Já existe uma categoria com esse nome.');
  Object.assign(campos,{nome,controla_estoque:estoque});
  if(c&&c.controla_estoque&&!estoque){
    const ids=db.itens.filter(i=>i.categoria===c.codigo).map(i=>i.id);
    if(db.estoque_bau.some(m=>ids.includes(m.item_id)))return toast('⚠️ Não é possível desligar o controle de estoque: há itens desta categoria com movimentações no Baú.');
  }
  if(c){
    const{error}=await sb.from('categorias_itens').update(campos).eq('codigo',c.codigo);
    if(error)return toast('⚠️ Erro ao salvar: '+error.message);
    Object.assign(c,campos);reg('Categoria editada',c.nome);
  }else{
    let cod=slugCategoria(nome),n=2;while(db.categorias.some(x=>x.codigo===cod))cod=slugCategoria(nome)+'_'+(n++);
    const ordem=Math.max(0,...db.categorias.map(x=>x.ordem||0))+1;
    const{data,error}=await sb.from('categorias_itens').insert({codigo:cod,ordem,...campos}).select().single();
    if(error)return toast('⚠️ Erro ao salvar: '+error.message);
    db.categorias.push(data);reg('Categoria criada',nome);
  }
  closeModal();render();
}
function excluirCategoria(codigo){
  if(!pode('excluir_cadastros'))return toast('⚠️ Seu perfil não pode excluir cadastros.');
  const c=db.categorias.find(x=>x.codigo===codigo);if(!c)return;
  const n=db.itens.filter(i=>i.categoria===codigo).length;
  if(n)return toast('⚠️ Não é possível excluir "'+c.nome+'": há '+n+' item(ns) nesta categoria. Mude a categoria deles antes.');
  confirmar('Excluir categoria','A categoria "'+c.nome+'" será removida. Confirmar?',async()=>{
    const{error}=await sb.from('categorias_itens').delete().eq('codigo',codigo);
    if(error)return toast('⚠️ Erro ao excluir: '+error.message);
    db.categorias=db.categorias.filter(x=>x.codigo!==codigo);reg('Categoria excluída',c.nome);render();
  });
}

async function salvarItem(id){
  if(!pode('itens'))return toast('⚠️ Seu perfil não cadastra itens.');
  const nome=document.getElementById('i-nome').value.trim();
  const cat=document.getElementById('i-cat').value;
  const un=document.getElementById('i-un').value.trim()||'un';
  const min=parseFloat(document.getElementById('i-min').value)||0;
  if(!nome)return toast('⚠️ Informe o nome do item.');
  if(!cat)return toast('⚠️ Selecione a categoria do item.');
  if(db.itens.some(x=>x.id!==id&&sselNorm(x.nome)===sselNorm(nome)))return toast('⚠️ Já existe um item com esse nome no cadastro.');
  const campos={nome,categoria:cat,unidade_medida:un,qtd_minima:min};
  if(id&&(db.itens.find(x=>x.id===id)||{}).produto_id){delete campos.nome;delete campos.categoria} // vêm do Catálogo
  if(id){
    const{error}=await sb.from('itens').update(campos).eq('id',id);
    if(error)return toast('⚠️ Erro ao salvar: '+error.message);
    Object.assign(db.itens.find(x=>x.id===id),campos);reg('Item editado',nome);
  }else{
    campos.ordem=Math.max(0,...db.itens.map(x=>x.ordem||0))+1;
    const{data,error}=await sb.from('itens').insert(campos).select().single();
    if(error)return toast('⚠️ Erro ao salvar: '+error.message);
    db.itens.push({...data,qtd_minima:Number(data.qtd_minima)});reg('Item criado',nome);id=data.id;
  }

  closeModal();render();
}
async function toggleItem(id){
  const it=db.itens.find(x=>x.id===id);
  if(it&&it.produto_id)return toast('⚠️ Item do Catálogo: ative ou inative o produto em Configurações › Catálogo de Produtos.');
  const novo=it.status==='ativo'?'inativo':'ativo';

/* Consulta no banco (não no cache local) tudo que ainda referencia o item e impede a exclusão */
async function vinculosDoItem(id){
  const[ri,ci,mb]=await Promise.all([
    sb.from('receita_insumos').select('receita_id, receitas(nome)').eq('item_id',id),
    sb.from('compra_itens').select('id',{count:'exact',head:true}).eq('item_id',id),
    sb.from('estoque_bau').select('id',{count:'exact',head:true}).eq('item_id',id)
  ]);
  const err=ri.error||ci.error||mb.error;if(err)throw err;
  const receitas=[...new Set((ri.data||[]).map(x=>x.receitas?.nome||'?'))];
  const motivos=[];
  if(receitas.length)motivos.push('usado na(s) receita(s): '+receitas.join(', ')+' — remova-o dessas receitas antes');
  if(ci.count)motivos.push('presente em '+ci.count+' linha(s) de compra do Histórico Financeiro');
  if(mb.count)motivos.push('possui '+mb.count+' movimentação(ões) no Baú');
  return motivos;
}
function excluirItem(id){
  if(!pode('excluir_cadastros'))return toast('⚠️ Seu perfil não pode excluir cadastros.');
  const it=db.itens.find(x=>x.id===id);if(!it)return;
  if(it.produto_id)return toast('⚠️ Item do Catálogo: ele sai junto quando o produto é excluído do Catálogo de Produtos.');
  if(it.status==='ativo')return toast('⚠️ Inative o cadastro (⏸️) antes de excluir.');
  confirmar('Excluir item',`"${it.nome}" será removido do cadastro. Só é possível excluir se o item não estiver em receitas, compras ou movimentações do Baú. Confirmar?`,async()=>{
    let motivos;
    try{motivos=await vinculosDoItem(id)}catch(e){return toast('⚠️ Erro ao verificar vínculos: '+(e.message||e))}
    if(motivos.length)return toast('⚠️ Não é possível excluir "'+it.nome+'": '+motivos.join('; ')+'.');
    const{data,error}=await sb.from('itens').delete().eq('id',id).select('id');
    if(error)return toast('⚠️ Erro ao excluir: '+error.message);
    if(!data||!data.length)return toast('⚠️ O item não foi excluído (sem permissão ou já removido). Recarregue a página.');
    db.itens=db.itens.filter(x=>x.id!==id);
    db.fornecedor_itens=db.fornecedor_itens.filter(x=>x.item_id!==id);
    reg('Item excluído',it.nome);
    render();
  });
}

let _fornRoot=null;

async function salvarFornecedor(id){

  if(db.fornecedores.some(x=>x.nome.toLowerCase()===nome.toLowerCase()&&x.id!==id))return toast('⚠️ Já existe um fornecedor com esse nome.');
  const marcados=fqa('#f-itens input:checked').map(c=>c.value);
  const precos={};
  for(const iid of marcados){
    const v=parseFloat(_fornPrecos[iid]);
    if(!(v>0)){const it=db.itens.find(i=>i.id===iid);const inp=fq(`.fvinc-row[data-item="${iid}"] .fvinc-preco`);if(inp){inp.classList.add('campo-erro');inp.focus()}return toast('⚠️ Informe o valor de "'+(it?it.nome:'item')+'" neste fornecedor.')}

    const{error}=await sb.from('fornecedores').update(campos).eq('id',id);
    if(error)return toast('⚠️ Erro: '+error.message);

  }
  // sincroniza vínculos com Matérias-Primas
  const atuais=db.fornecedor_itens.filter(x=>x.fornecedor_id===fid);
  const remover=atuais.filter(x=>!marcados.includes(x.item_id)).map(x=>x.id);
  // novos vínculos e vínculos com valor alterado vão numa chamada só (upsert pelo par fornecedor+item)
  const gravar=marcados.filter(itemId=>{const a=atuais.find(x=>x.item_id===itemId);return !a||Number(a.preco_unitario)!==precos[itemId]}).map(item_id=>({fornecedor_id:fid,item_id,preco_unitario:precos[item_id]}));

  if(gravar.length){
    const{data,error}=await sb.from('fornecedor_itens').upsert(gravar,{onConflict:'fornecedor_id,item_id'}).select();
    if(error)return toast('⚠️ Fornecedor salvo, mas houve erro ao gravar itens e valores: '+error.message);

    reg('Valores do fornecedor atualizados',nome+' — '+gravar.length+' item(ns)');
  }

    if(error)return toast('⚠️ Fornecedor salvo, mas houve erro ao remover vínculos: '+error.message);

  }

  closeModal();render();
}

async function imgComprimir(c){
  const blobDe=(cv,q)=>new Promise(r=>{try{cv.toBlob(b=>r(b),'image/jpeg',q)}catch(e){r(null)}});
  for(const escala of [1,.85,.7,.55]){
    let cv=c;if(escala<1){cv=document.createElement('canvas');cv.width=Math.round(c.width*escala);cv.height=Math.round(c.height*escala);cv.getContext('2d').drawImage(c,0,0,cv.width,cv.height)}
    for(const q of [.92,.88,.84,.8,.75,.7,.62]){const b=await blobDe(cv,q);if(!b)return null;if(b.size<=IMG_LIMITE_BYTES)return{blob:b,w:cv.width,h:cv.height,q}}
  }
  return null;
}
const blobParaDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>r(null);f.readAsDataURL(b)});
async function imgGerar(){
  const m=_imgM;if(!m)return;const c=await m.desenhar(m.v);if(_imgM!==m)return;
  const r=await imgComprimir(c),url=r&&await blobParaDataURL(r.blob);if(_imgM!==m)return;
  const prev=document.getElementById('img-desc-prev');if(!prev)return;
  if(!url){prev.textContent='Não foi possível gerar a imagem.';return}
  _imgDesconto={canvas:c,url,blob:r.blob,bytes:r.blob.size,arquivo:m.arquivo(m.v)};

    <div class="muted" id="img-tam" style="font-size:12px;margin-top:6px">JPG · ${r.w}×${r.h} · ${Math.round(r.blob.size/1024)} KB (máx. 512 KB)</div>`;prev.style.padding='0';

}
/* 🔗 Copiar link (pedido do dono, v4.41): a imagem (o mesmo JPG do Baixar) sobe para o Storage em midia/links/ e o
   link público abre SÓ a imagem (endereço do Supabase, não o site). O nome do arquivo é o resumo (SHA-256) do conteúdo:
   a mesma imagem gera sempre o mesmo link e não duplica arquivo. Imagem mudou (texto, produto), link novo.
   Os links não vencem: nada apaga a pasta links/ (as limpezas do site só mexem em avisos/). */
function imgLinkPronto(){const b=document.getElementById('btn-link-img');if(b)b.disabled=false;const l=document.getElementById('img-link');if(l){l.style.display='none';l.innerHTML=''}}
async function imgResumo(blob){
  try{const h=await crypto.subtle.digest('SHA-256',await blob.arrayBuffer());return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,32)}
  catch(e){return [...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join('')}   // sem SHA-256 (http): nome aleatório no mesmo formato
}
async function copiarLinkImagem(){
  const im=_imgDesconto;if(!im||!im.blob)return;
  const bt=document.getElementById('btn-link-img');if(bt){bt.disabled=true;bt.textContent='Gerando link…'}
  try{
    const caminho='links/'+(await imgResumo(im.blob))+'.jpg';
    const{error}=await sb.storage.from('midia').upload(caminho,im.blob,{contentType:'image/jpeg',cacheControl:'31536000',upsert:false});
    // já existe = a mesma imagem já tem link: usa o mesmo
    if(error&&!/exist|duplicate|409/i.test(String(error.message||error.statusCode||error)))throw error;
    const link=sb.storage.from('midia').getPublicUrl(caminho).data.publicUrl;
    const caixa=document.getElementById('img-link');
    if(caixa){caixa.style.display='';caixa.innerHTML=`<label>🔗 Link da imagem <span class="muted" style="font-weight:500">(abre só a imagem)</span></label>
      <div style="display:flex;gap:8px"><input id="img-link-url" readonly value="${esc(link)}" onfocus="this.select()">
      <button class="btn btn-ghost btn-sm" onclick="copiarTextoLink()">Copiar</button><a class="btn btn-ghost btn-sm" href="${esc(link)}" target="_blank" rel="noopener">Abrir</a></div>`}
    let copiou=false;try{await navigator.clipboard.writeText(link);copiou=true}catch(e){}
    toast(copiou?'✅ Link copiado. É só colar onde quiser.':'🔗 Link pronto: toque em Copiar ao lado do link.');
    if(!im.linkRegistrado){im.linkRegistrado=true;reg('Link de imagem criado',im.arquivo)}
  }catch(e){toast('⚠️ Não foi possível criar o link: '+(e.message||e))}
  finally{if(bt){bt.disabled=false;bt.textContent='🔗 Copiar link'}}
}
function copiarTextoLink(){const i=document.getElementById('img-link-url');if(!i)return;i.select();
  (navigator.clipboard?navigator.clipboard.writeText(i.value):Promise.reject()).then(()=>toast('✅ Link copiado.'),()=>{try{document.execCommand('copy');toast('✅ Link copiado.')}catch(e){toast('Selecione o link e copie.')}})}
function baixarImagemDesconto(){if(!_imgDesconto)return;const a=document.createElement('a');a.href=_imgDesconto.url;a.download=_imgDesconto.arquivo;document.body.appendChild(a);a.click();a.remove()}
/* Copiar (pedido do dono, v4.30.3): a área de transferência só aceita PNG. Para respeitar os 512 KB, copia em tamanho
   cheio se couber; senão reduz a imagem aos poucos até o PNG caber. */
async function imgPngAteLimite(c){
  const png=cv=>new Promise(r=>{try{cv.toBlob(b=>r(b),'image/png')}catch(e){r(null)}});
  // o tamanho do PNG cai com a área: a próxima escala sai do tamanho que deu (com folga de 5%)
  let escala=1;
  for(let i=0;i<8&&escala>=.1;i++){
    let cv=c;if(escala<1){cv=document.createElement('canvas');cv.width=Math.round(c.width*escala);cv.height=Math.round(c.height*escala);cv.getContext('2d').drawImage(c,0,0,cv.width,cv.height)}
    const b=await png(cv);if(!b)return null;if(b.size<=IMG_LIMITE_BYTES)return{blob:b,w:cv.width,h:cv.height};
    escala*=Math.min(.92,Math.sqrt(IMG_LIMITE_BYTES/b.size)*.95);
  }
  return null;
}
async function copiarImagemDesconto(){
  if(!_imgDesconto)return;const c=_imgDesconto.canvas;let info=null;
  // a promessa vai direto para o ClipboardItem: o Safari exige que a cópia comece no próprio toque
  const prom=imgPngAteLimite(c).then(r=>{if(!r)throw new Error('sem png');info=r;return r.blob});
  try{await navigator.clipboard.write([new ClipboardItem({'image/png':prom})]);
    toast('✅ Imagem copiada ('+info.w+'×'+info.h+' · '+Math.round(info.blob.size/1024)+' KB). É só colar (Ctrl+V).')}
  catch(e){toast('⚠️ Não deu para copiar neste navegador. Use ⬇ Baixar imagem.')}
}

// preço anterior: 1º o histórico de preços do banco (produtos_precos); 2º o último preço vendido diferente do atual
async function precoAnteriorProduto(p){
  try{
    const{data,error}=await sb.from('produtos_precos').select('preco,preco_anterior,alterado_em').eq('produto_id',p.id).order('alterado_em',{ascending:false}).limit(20);

      if(r)return{valor:Number(r.preco_anterior),fonte:'historico',em:r.alterado_em}}
  }catch(e){}
  let ult=null;
  db.vendas.forEach(v=>{if(v.status==='excluida')return;(v.itens||[]).forEach(i=>{if(i.produto_id===p.id&&Number(i.preco_unit)!==Number(p.preco)&&(!ult||String(v.data)>String(ult.em)))ult={valor:Number(i.preco_unit),fonte:'vendas',em:v.data}})});
  return ult;
}

async function salvarDescontos(id){
  const nome=document.getElementById('pc-nome').value.trim();
  const tipo=document.getElementById('pc-tipo').value;
  const fixo=parseFloat(document.getElementById('pc-fixo').value)||0;
  const e=document.getElementById('pc-err');
  const fail=m=>{e.textContent=m;e.style.display='block'};
  if(!nome)return fail('Informe o nome.');
  let faixasForm=[];
  if(tipo==='escalonada'){
    faixasForm=[...document.querySelectorAll('#pc-faixas [data-fx]')].map(d=>({
      quantidade_min:parseInt(d.querySelector('.fx-min').value),
      quantidade_max:d.querySelector('.fx-max').value?parseInt(d.querySelector('.fx-max').value):null,
      percentual_desconto:parseFloat(d.querySelector('.fx-pct').value)||0
    })).filter(fx=>fx.quantidade_min>=1);
    if(!faixasForm.length)return fail('Adicione ao menos uma faixa válida.');
  }
  const campos={nome,tipo,desconto_fixo:fixo};
  let parceriaId=id,novaOrdem=null;
  if(id){
    const{error}=await sb.from('parcerias').update(campos).eq('id',id);
    if(error)return fail('Erro ao salvar: '+error.message);
    await sb.from('parceria_faixas').delete().eq('parceria_id',id);
  }else{
    const{data,error}=await sb.from('parcerias').insert({...campos,ordem:proximaOrdem(db.parcerias)}).select().single();
    if(error)return fail('Erro ao salvar: '+error.message);
    parceriaId=data.id;novaOrdem=data.ordem;
  }
  let faixas=[];
  if(faixasForm.length){
    const{data:fd,error:e2}=await sb.from('parceria_faixas').insert(faixasForm.map(f=>({...f,parceria_id:parceriaId}))).select();
    if(e2)return fail('Erro ao salvar faixas: '+e2.message);
    faixas=fd.map(f=>({id:f.id,quantidade_min:Number(f.quantidade_min),quantidade_max:f.quantidade_max==null?null:Number(f.quantidade_max),percentual_desconto:Number(f.percentual_desconto)}));
  }
  if(id){Object.assign(db.parcerias.find(x=>x.id===id),{nome,tipo,desconto_fixo:fixo,faixas})}
  else db.parcerias.push({id:parceriaId,nome,tipo,desconto_fixo:fixo,faixas,ordem:novaOrdem,status:'ativo'});
  reg('Desconto salvo',nome);
  closeModal();render();
}
async function toggleDescontos(id){
  const p=db.parcerias.find(x=>x.id===id);
  const novo=p.status==='ativo'?'inativo':'ativo';
  const{error}=await sb.from('parcerias').update({status:novo}).eq('id',id);
  if(error)return toast('⚠️ Erro: '+error.message);
  p.status=novo;render();
}

function moverPerfil(id,dir){
  const lista=perfisOrdenados().filter(p=>p.id!=='socio'),i=lista.findIndex(p=>p.id===id),j=i+dir;
  if(i<0||j<0||j>=lista.length)return;
  const x=lista[i],y=lista[j];
  if(!podeEditarPerfil(x)||!podeEditarPerfil(y))return toast('⚠️ Um dos perfis tem permissões que você não tem; peça a quem tem.');
  // ordens sequenciais a partir de 2 (o Sócio fica sempre em 1)
  lista.forEach((p,k)=>p._nova=k+2);x._nova=j+2;y._nova=i+2;
  const muda=lista.filter(p=>p._nova!==p.ordem);
  if(muda.some(p=>!podeEditarPerfil(p)))return toast('⚠️ Um dos perfis tem permissões que você não tem; peça a quem tem.');
  Promise.all(muda.map(p=>sb.from('perfis_acesso').update({ordem:p._nova}).eq('id',p.id))).then(rs=>{
    const e=rs.find(r=>r.error);if(e)return toast('⚠️ Erro ao reordenar: '+e.error.message);
    muda.forEach(p=>p.ordem=p._nova);buildNav();render();
  });
}

async function salvarPerfil(id){
  const e=document.getElementById('pf-err'),fail=m=>{e.textContent=m;e.style.display='block'};
  if(!pode('perfis'))return fail('Seu perfil não gerencia perfis.');
  const nome=document.getElementById('pf-nome').value.trim(),cor=document.getElementById('pf-cor').value;
  const perms=[...document.querySelectorAll('#modal-box [data-perm]')].filter(x=>x.checked).map(x=>x.dataset.perm);
  if(!nome||nome.length>30)return fail('O nome precisa ter de 1 a 30 letras.');
  if((db.perfis||[]).some(p=>p.id!==id&&p.nome.trim().toLowerCase()===nome.toLowerCase()))return fail('Já existe um perfil com esse nome.');
  const minhas=permissoesDoPerfil(perfilIdDe(sessionUser()));
  const fora=perms.filter(c=>!minhas.includes(c));
  if(fora.length)return fail('Você não tem: '+fora.map(permNome).join(', ')+'.');
  if(perms.includes('usuarios_excluir')&&!perms.includes('usuarios'))return fail('"Excluir usuários" precisa também de "Gerenciar usuários".');
  // tirar permissões do próprio perfil trancaria a pessoa para fora (só quem tem a permissão desfaz)
  if(id&&id===perfilIdDe(sessionUser())&&(perfilPorId(id).permissoes||[]).some(c=>!perms.includes(c)))return fail('Você não pode tirar permissões do seu próprio perfil. Peça a outra pessoa com "Gerenciar perfis" ou ao Sócio.');
  const bt=document.getElementById('btn-salvar-perfil');if(bt)bt.disabled=true;
  const p=id?perfilPorId(id):null;
  if(p){
    const{error}=await sb.from('perfis_acesso').update({nome,cor,permissoes:perms}).eq('id',id);
    if(error){if(bt)bt.disabled=false;return fail('Erro ao salvar: '+error.message)}
    const antes=p.permissoes||[];
    const mais=perms.filter(c=>!antes.includes(c)),menos=antes.filter(c=>!perms.includes(c));
    Object.assign(p,{nome,cor,permissoes:perms});
    reg('Perfil editado',nome+(mais.length?' · + '+mais.map(permNome).join(', '):'')+(menos.length?' · − '+menos.map(permNome).join(', '):''));
  }else{
    const novo={id:slugPerfil(nome),nome,cor,permissoes:perms,ordem:Math.max(1,...(db.perfis||[]).map(x=>x.ordem||0))+1};
    const{error}=await sb.from('perfis_acesso').insert(novo);
    if(error){if(bt)bt.disabled=false;return fail('Erro ao salvar: '+error.message)}
    db.perfis.push(novo);
    reg('Perfil criado',nome+' ('+(perms.length?perms.map(permNome).join(', '):'só o básico')+')');
  }
  closeModal();buildNav();render();toast('✅ Perfil salvo.');
}
function excluirPerfil(id){
  const p=perfilPorId(id);if(!p)return;
  if(!podeEditarPerfil(p)||id==='vendedor')return toast('⚠️ Este perfil não pode ser excluído por você.');
  if(usuariosDoPerfil(id).length)return toast('⚠️ Ainda há pessoas com este perfil. Mude o perfil delas antes.');
  confirmar('Excluir perfil','O perfil "'+p.nome+'" será excluído. Confirmar?',async()=>{
    const{error}=await sb.from('perfis_acesso').delete().eq('id',id);
    if(error)return toast('⚠️ Erro ao excluir: '+error.message);
    db.perfis=db.perfis.filter(x=>x.id!==id);reg('Perfil excluído',p.nome);render();
  });
}

function hexParaRgb(hex){
  const m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec((hex||'').trim());
  if(!m)return '255,255,255';
  return parseInt(m[1],16)+','+parseInt(m[2],16)+','+parseInt(m[3],16);
}
function hexValido(hex){return /^#[0-9a-f]{6}$/i.test((hex||'').trim())}
function corAtual(key){
  const def=PALETA_DEFS.find(d=>d.key===key);
  const salvas=(db&&db.identidade_visual&&db.identidade_visual.cores)||{};
  return salvas[key]||(def?def.default:'#000000');
}
function aplicarCores(){
  const root=document.documentElement.style;
  PALETA_DEFS.forEach(def=>{
    const v=corAtual(def.key);
    root.setProperty('--'+def.key,v);
    if(def.rgb)root.setProperty('--'+def.key+'-rgb',hexParaRgb(v));
  });
}

async function mudarCor(key,hex,commit){
  if(!hexValido(hex))return;
  const root=document.documentElement.style;
  root.setProperty('--'+key,hex);
  const def=PALETA_DEFS.find(d=>d.key===key);
  if(def&&def.rgb)root.setProperty('--'+key+'-rgb',hexParaRgb(hex));
  const ci=document.getElementById('cor-'+key), ti=document.getElementById('cor-'+key+'-hex'), sw=document.getElementById('sw-'+key);
  if(ci&&ci.value.toLowerCase()!==hex.toLowerCase())ci.value=hex;
  if(ti&&ti.value.toLowerCase()!==hex.toLowerCase())ti.value=hex;
  if(sw)sw.style.background=hex;
  if(commit){
    db.identidade_visual.cores=db.identidade_visual.cores||{};
    db.identidade_visual.cores[key]=hex.toUpperCase();
    const{error}=await sb.from('configuracoes').update({cores:db.identidade_visual.cores,atualizado_em:nowISO()}).eq('id',1);
    if(error)return toast('⚠️ Erro ao salvar cor: '+error.message);
    reg('Cor da identidade visual alterada',(def?def.label:key)+' → '+hex.toUpperCase());
  }
}

/* Recalcula o saldo resultante de um item (ignorando revertidos). A tela recalcula na hora;
   o banco atualiza tudo numa única chamada (recalcular_saldos_bau), para não gastar uma requisição por linha
   (o limite de requisições barraria históricos grandes). Sem a função no banco, cai no modo antigo, linha a linha. */
async function recalcularSaldosItem(itemId){
  let saldo=0;
  const movs=db.estoque_bau.filter(m=>m.item_id===itemId&&m.status!=='revertida').sort((a,b)=>(new Date(a.data).getTime()-new Date(b.data).getTime())||String(a.id).localeCompare(String(b.id)));
  const atualizacoes=[];
  movs.forEach(m=>{
    saldo+=(m.tipo_movimento.startsWith('entrada')||m.tipo_movimento==='ajuste_entrada'?m.quantidade:-m.quantidade);
    if(m.saldo_resultante!==saldo){atualizacoes.push({id:m.id,saldo_resultante:saldo})}
    m.saldo_resultante=saldo;
  });
  if(!atualizacoes.length)return;
  const{error}=await sb.rpc('recalcular_saldos_bau',{p_item:itemId});
  if(!error)return;
  if(!/recalcular_saldos_bau|PGRST202|function/i.test((error.code||'')+' '+(error.message||''))){console.warn('[Best Buds] falha ao recalcular saldo',error);return}
  for(const a of atualizacoes){
    const{error:e2}=await sb.from('estoque_bau').update({saldo_resultante:a.saldo_resultante}).eq('id',a.id);
    if(e2)console.warn('[Best Buds] falha ao recalcular saldo',e2);
  }
}

/* Colunas numéricas: o filtro vira uma faixa (barra com dois marcadores + campos digitáveis), do menor ao maior valor.
   get devolve o número bruto (null = sem valor na linha); moeda formata como dinheiro. */
const NUMERICOS={
 bau:{quantidade:{get:r=>r.quantidade},saldo_resultante:{get:r=>r.saldo_resultante}},
 financeiro:{entrada:{get:r=>['venda','compra','ajuste'].includes(r.tipo)?r.entrada:null,moeda:1},repasse:{get:r=>r.tipo==='venda'||r.tipo==='auxiliar'?r.repasse:null,moeda:1},valor:{get:r=>r.valor,moeda:1}},
 cfg_produtos:{preco:{get:p=>p.preco,moeda:1},custo:{get:p=>p.custo||0,moeda:1}},
 cfg_itens:{qtd_minima:{get:i=>i.qtd_minima||0},saldo:{get:i=>controlaEstoque(i.categoria)?saldoItem(i.id):null}},
 cfg_categorias:{itens:{get:c=>db.itens.filter(i=>i.categoria===c.codigo).length}},
 cfg_deslocamento:{valor:{get:t=>t.valor,moeda:1}},
 pendentes:{total:{get:v=>v.total||0,moeda:1},repasse:{get:v=>v.cota_funcionario||0,moeda:1},caixa:{get:v=>v.receita_loja||0,moeda:1}}
};
function colunaNumerica(tipo,key){return NUMERICOS[tipo]&&NUMERICOS[tipo][key]}
function ehFaixa(v){return v&&!Array.isArray(v)&&typeof v==='object'&&('min' in v||'max' in v)}
/* Usuário: só o da linha principal. Sublinha (auxiliar da venda, item da compra com o fornecedor) não entra na lista
   do filtro e, ao filtrar, acompanha a linha principal dela. */
function valoresColuna(tipo,key){
 const a=linhasFonte(tipo).filter(r=>!(key==='usuario_nome'&&r.pai));
 const get=GETTERS[tipo][key];
 return [...new Set(a.map(r=>String(get?get(r):(r[key]??''))).filter(v=>v!==''))].sort((x,y)=>x.localeCompare(y,'pt-BR',{numeric:true}));
}
function valoresSelecionados(tipo,key){const v=regConsulta[tipo].filtros?.[key];return Array.isArray(v)?v:[]}
function colunaFiltrada(tipo,key){const v=regConsulta[tipo].filtros?.[key];return key==='data'?!!(regConsulta[tipo].filtros?.__de||regConsulta[tipo].filtros?.__ate):(ehFaixa(v)||(Array.isArray(v)&&v.length>0))}
function filtroAtivo(tipo){const f=regConsulta[tipo].filtros||{};return Object.keys(f).some(k=>k==='__de'||k==='__ate'||ehFaixa(f[k])||(Array.isArray(f[k])&&f[k].length))}
function aplicarFiltros(arr,tipo){
 const f=regConsulta[tipo].filtros||{};const g=GETTERS[tipo]||{};
 const pais=Array.isArray(f.usuario_nome)&&f.usuario_nome.length&&arr.some(r=>r.pai)?new Map(arr.filter(r=>!r.pai).map(r=>[r.id,r])):null;
 return arr.filter(r=>{const bruto=String(g.data?g.data(r):(r.data??''));const d=/^\d{4}-\d{2}-\d{2}T/.test(bruto)?diaBR(bruto):bruto.slice(0,10);   // instante → dia de Brasília
  if(f.__de&&d<f.__de)return false;if(f.__ate&&d>f.__ate)return false;
  return Object.keys(f).every(k=>{if(k==='__de'||k==='__ate')return true;
   if(ehFaixa(f[k])){const n=colunaNumerica(tipo,k);if(!n)return true;const v=n.get(r);if(v==null||isNaN(v))return false;return v>=f[k].min-1e-9&&v<=f[k].max+1e-9}
   const vals=Array.isArray(f[k])?f[k]:[];if(!vals.length)return true;
   const ref=k==='usuario_nome'&&r.pai&&pais?pais.get(r.pai)||r:r;   // sublinha: vale o usuário da linha principal
   const val=String(g[k]?g[k](ref):(ref[k]??''));return vals.includes(val)})});
}

/* ---- Filtro por faixa de valores ---- */
function fmtFaixa(n,moeda){return moeda?fmt(n):Number(n).toLocaleString('pt-BR',{maximumFractionDigits:2})}
function abrirFiltroFaixa(tipo,key,label,anchor){
 const q=regConsulta[tipo],num=colunaNumerica(tipo,key);
 const vals=linhasFonte(tipo).map(num.get).filter(v=>v!=null&&!isNaN(v)).map(Number);
 const lo=vals.length?Math.min(...vals):0,hi=vals.length?Math.max(...vals):0;
 const inteiros=vals.every(v=>Number.isInteger(v));
 const passo=inteiros&&!num.moeda?1:0.01;
 const atual=ehFaixa(q.filtros[key])?q.filtros[key]:{min:lo,max:hi};
 const a=Math.max(lo,Math.min(hi,atual.min)),b=Math.max(lo,Math.min(hi,atual.max));
 const marcas=hi>lo?[0,.25,.5,.75,1].map(t=>lo+(hi-lo)*t):[lo];
 const box=document.createElement('div');box.className='excel-filter-dropdown efd-faixa';
 box.dataset.lo=lo;box.dataset.hi=hi;box.dataset.moeda=num.moeda?1:'';
 box.innerHTML=`<div class="fx-topo"><div class="fx-titulo">${esc(label)}</div><button type="button" class="fx-limpar" onclick="limparFiltroColuna('${tipo}','${key}')">✕ Limpar</button></div>
  ${!vals.length?'<p class="muted" style="font-size:12px">Nenhum valor para filtrar.</p>':`
  <div class="fx-campos">
    <label class="fx-campo">${num.moeda?'<span>$</span>':''}<input type="number" id="fx-min" step="${passo}" min="${lo}" max="${hi}" value="${+a.toFixed(2)}" aria-label="Valor mínimo"></label>
    <span class="fx-sep">–</span>
    <label class="fx-campo">${num.moeda?'<span>$</span>':''}<input type="number" id="fx-max" step="${passo}" min="${lo}" max="${hi}" value="${+b.toFixed(2)}" aria-label="Valor máximo"></label>
  </div>
  <div class="fx-barra"><div class="fx-trilho"></div><div class="fx-preenchido" id="fx-fill"></div>
    <input type="range" id="fx-r1" min="${lo}" max="${hi}" step="${passo}" value="${a}" aria-label="Arrastar mínimo">
    <input type="range" id="fx-r2" min="${lo}" max="${hi}" step="${passo}" value="${b}" aria-label="Arrastar máximo"></div>
  <div class="fx-marcas">${marcas.map(m=>`<span>${esc(fmtFaixa(m,num.moeda))}</span>`).join('')}</div>`}
  <div class="efd-footer"><button class="btn btn-ghost btn-sm" onclick="fecharDropdownFiltro()">Cancelar</button><button class="btn btn-primary btn-sm" ${vals.length?'':'disabled'} onclick="aplicarFiltroFaixa('${tipo}','${key}')">Aplicar</button></div>`;
 document.body.appendChild(box);filtroAberto=box;
 const r=anchor.getBoundingClientRect(),largura=340;box.style.width=largura+'px';box.style.left=Math.max(8,Math.min(r.left-40,window.innerWidth-largura-8))+'px';box.style.top=Math.min(r.bottom+4,Math.max(8,window.innerHeight-300))+'px';
 if(vals.length){
  const r1=box.querySelector('#fx-r1'),r2=box.querySelector('#fx-r2'),i1=box.querySelector('#fx-min'),i2=box.querySelector('#fx-max');
  const pint=()=>{const x=+r1.value,y=+r2.value,t=hi-lo||1,f=box.querySelector('#fx-fill');f.style.left=((x-lo)/t*100)+'%';f.style.width=((y-x)/t*100)+'%';r1.style.zIndex=x>=hi-(hi-lo)*.02?5:3};
  r1.addEventListener('input',()=>{if(+r1.value>+r2.value)r1.value=r2.value;i1.value=+(+r1.value).toFixed(2);pint()});
  r2.addEventListener('input',()=>{if(+r2.value<+r1.value)r2.value=r1.value;i2.value=+(+r2.value).toFixed(2);pint()});
  const digitado=(inp,rg,outro,ehMin)=>{let v=parseFloat(String(inp.value).replace(',','.'));if(isNaN(v))return;v=Math.max(lo,Math.min(hi,v));if(ehMin&&v>+outro.value)v=+outro.value;if(!ehMin&&v<+outro.value)v=+outro.value;rg.value=v;pint()};
  i1.addEventListener('input',()=>digitado(i1,r1,r2,true));i2.addEventListener('input',()=>digitado(i2,r2,r1,false));
  const fixar=(inp,rg)=>{inp.value=+(+rg.value).toFixed(2)};
  i1.addEventListener('change',()=>fixar(i1,r1));i2.addEventListener('change',()=>fixar(i2,r2));
  box.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();aplicarFiltroFaixa(tipo,key)}});
  pint();
 }
 setTimeout(()=>document.addEventListener('click',fecharDropdownFora),0);
}
function aplicarFiltroFaixa(tipo,key){
 const box=filtroAberto;if(!box)return;const q=regConsulta[tipo];q.filtros=q.filtros||{};
 const lo=+box.dataset.lo,hi=+box.dataset.hi;
 let a=parseFloat(String(box.querySelector('#fx-min').value).replace(',','.')),b=parseFloat(String(box.querySelector('#fx-max').value).replace(',','.'));
 if(isNaN(a))a=lo;if(isNaN(b))b=hi;if(a>b)[a,b]=[b,a];
 a=Math.max(lo,a);b=Math.min(hi,b);
 if(a<=lo+1e-9&&b>=hi-1e-9)delete q.filtros[key];else q.filtros[key]={min:a,max:b};

/* Status de uma linha selecionada do Financeiro ('venda:<id>' | 'compra:<id>' | 'ajuste:<id>') */
function statusSelFin(selId){
  if(selId.startsWith('venda:')){const v=db.vendas.find(x=>x.id===selId.slice(6));return v?v.status:null}
  if(selId.startsWith('compra:')){const k=db.compras.find(x=>x.id===selId.slice(7));return k?k.status:null}
  if(selId.startsWith('ajuste:')){const a=db.ajustes_caixa.find(x=>x.id===selId.slice(7));return a?(a.status||'ativa'):null}
  return null;
}
/* Excluir: só quando TODAS as selecionadas estão revertidas. Reverter: só quando TODAS estão ativas (e são vendas/compras). */
function estadoSelecao(tipo){
  const ids=[...selExclusao[tipo]],n=ids.length;
  if(tipo==='bau'){const st=id=>{const m=db.estoque_bau.find(x=>x.id===id);return m?(m.status||'ativa'):null};
    return{n,excluir:n>0&&ids.every(id=>st(id)==='revertida'),reverter:n>0&&ids.every(id=>st(id)==='ativa')}}
  if(tipo!=='financeiro')return{n,excluir:n>0,reverter:false};
  return{n,
    excluir:n>0&&ids.every(id=>statusSelFin(id)==='revertida'),
    reverter:n>0&&ids.every(id=>['ativa','pendente'].includes(statusSelFin(id)))};
}

}

/* Reverte de uma vez todas as vendas/compras selecionadas que ainda estejam ativas — a seleção continua marcada depois, pronta pra excluir em seguida */
async function reverterSelecionadas(){
  if(!Object.values(FIN_PERM).some(pode))return toast('⚠️ Seu perfil não pode reverter lançamentos.');
  // cada tipo só entra se o perfil pode reverter esse tipo (FIN_PERM)
  const ids=[...selExclusao.financeiro].filter(x=>pode(FIN_PERM[x.slice(0,x.indexOf(':'))]));
  const vendaIds=ids.filter(x=>x.startsWith('venda:')).map(x=>x.replace('venda:','')).filter(id=>{const v=db.vendas.find(x=>x.id===id);return v&&(v.status==='ativa'||v.status==='pendente')});
  const compraIds=ids.filter(x=>x.startsWith('compra:')).map(x=>x.replace('compra:','')).filter(id=>{const k=db.compras.find(x=>x.id===id);return k&&k.status==='ativa'});
  const ajusteIds=ids.filter(x=>x.startsWith('ajuste:')).map(x=>x.replace('ajuste:','')).filter(id=>{const a=db.ajustes_caixa.find(x=>x.id===id);return a&&(a.status||'ativa')==='ativa'});
  if(!vendaIds.length&&!compraIds.length&&!ajusteIds.length)return toast('ℹ️ Nada selecionado precisa ser revertido — já pode excluir.');
  confirmar('Reverter selecionadas',(vendaIds.length+compraIds.length+ajusteIds.length)+' lançamento(s) serão marcados como revertidos e sairão dos totais. Confirmar?',async()=>{
    if(vendaIds.length){const{error}=await sb.from('vendas').update({status:'revertida'}).in('id',vendaIds);if(error)return toast('⚠️ Erro ao reverter vendas: '+error.message)}
    if(compraIds.length){const{error}=await sb.from('compras').update({status:'revertida'}).in('id',compraIds);if(error)return toast('⚠️ Erro ao reverter compras: '+error.message)}
    if(ajusteIds.length){const{error}=await sb.from('ajustes_caixa').update({status:'revertida'}).in('id',ajusteIds);if(error)return toast('⚠️ Erro ao reverter ajustes: '+error.message)}
    ajusteIds.forEach(id=>{const a=db.ajustes_caixa.find(x=>x.id===id);if(a)a.status='revertida'});
    vendaIds.forEach(id=>{const v=db.vendas.find(x=>x.id===id);if(v)v.status='revertida'});
    compraIds.forEach(id=>{const k=db.compras.find(x=>x.id===id);if(k)k.status='revertida'});
    reg('Reversão em lote',(vendaIds.length+compraIds.length+ajusteIds.length)+' lançamento(s)');
    render();if(vendaIds.length)agendarSincronizacao();toast('✅ Revertido(s). A seleção continua marcada — pode excluir agora.');
  });
}
function thSelTodos(tipo,visiveis){if(!podeExcluirLinhas())return '';return `<th style="width:34px"><input type="checkbox" id="sel-todos-${tipo}" style="width:auto" title="Selecionar todas" onchange="toggleSelTodos('${tipo}',this.checked)" ${visiveis.length&&visiveis.every(r=>selExclusao[tipo].has(r.id))?'checked':''}></th>`}

function excluirSelecionadas(tipo){
 if(!podeExcluirLinhas())return toast('⚠️ Seu perfil não pode excluir lançamentos.');
 const ids=[...(selExclusao[tipo]||[])];if(!ids.length)return;
 const nomes={vendas:'venda(s)',compras:'compra(s)',bau:'movimentação(ões)',financeiro:'lançamento(s)'};
 let idsParaExcluir=ids, bloqueadas=0;
 if(tipo==='financeiro'){
   // vendas/compras só podem ser apagadas depois de revertidas (regra do banco) — ajustes de caixa não têm essa trava
   idsParaExcluir=ids.filter(x=>{
     if(x.startsWith('venda:')){const v=db.vendas.find(v=>v.id===x.replace('venda:',''));return v&&v.status==='revertida'}
     if(x.startsWith('compra:')){const k=db.compras.find(k=>k.id===x.replace('compra:',''));return k&&k.status==='revertida'}
     if(x.startsWith('ajuste:')){const a=db.ajustes_caixa.find(a=>a.id===x.replace('ajuste:',''));return a&&a.status==='revertida'}
     return false;
   });
   bloqueadas=ids.length-idsParaExcluir.length;
   if(bloqueadas>0&&idsParaExcluir.length===0)return toast('⚠️ '+bloqueadas+' venda(s)/compra(s) selecionada(s) ainda estão ativas — reverta antes de excluir (botão "↩️ Reverter selecionadas").');
 }else if(tipo==='bau'){
   idsParaExcluir=ids.filter(id=>{const m=db.estoque_bau.find(x=>x.id===id);return m&&m.status==='revertida'});
   bloqueadas=ids.length-idsParaExcluir.length;
   if(bloqueadas>0&&idsParaExcluir.length===0)return toast('⚠️ As movimentações selecionadas ainda estão ativas — reverta antes de excluir (botão "↩️ Reverter selecionadas").');
 }
 if(!idsParaExcluir.length)return;
 confirmar('Excluir selecionadas',idsParaExcluir.length+' '+nomes[tipo]+' serão removidas definitivamente.'+(bloqueadas?' ('+bloqueadas+' ficarão de fora por ainda estarem ativas — reverta-as primeiro.)':'')+' Confirmar?',async()=>{
  const ids=idsParaExcluir;
  if(tipo==='bau'){
   const itensAfetados=[...new Set(db.estoque_bau.filter(m=>ids.includes(m.id)).map(m=>m.item_id))];
   const{error}=await sb.from('estoque_bau').delete().in('id',ids);
   if(error)return toast('⚠️ Erro ao excluir: '+error.message);
   db.estoque_bau=db.estoque_bau.filter(x=>!ids.includes(x.id));
   for(const itemId of itensAfetados)await recalcularSaldosItem(itemId);
  }else if(tipo==='financeiro'){
   const vendaIds=ids.filter(x=>x.startsWith('venda:')).map(x=>x.replace('venda:',''));
   const compraIds=ids.filter(x=>x.startsWith('compra:')).map(x=>x.replace('compra:',''));
   const ajusteIds=ids.filter(x=>x.startsWith('ajuste:')).map(x=>x.replace('ajuste:',''));
   if(vendaIds.length){const{error}=await sb.from('vendas').delete().in('id',vendaIds);if(error)return toast('⚠️ Erro ao excluir vendas: '+error.message)}
   if(compraIds.length){const{error}=await sb.from('compras').delete().in('id',compraIds);if(error)return toast('⚠️ Erro ao excluir compras: '+error.message)}
   if(ajusteIds.length){const{error}=await sb.from('ajustes_caixa').delete().in('id',ajusteIds);if(error)return toast('⚠️ Erro ao excluir ajustes: '+error.message)}
   db.vendas=db.vendas.filter(x=>!vendaIds.includes(x.id));
   db.compras=db.compras.filter(x=>!compraIds.includes(x.id));
   db.ajustes_caixa=db.ajustes_caixa.filter(x=>!ajusteIds.includes(x.id));
  }
  reg('Exclusão em lote',tipo+' — '+ids.length+' linha(s)');
  ids.forEach(id=>selExclusao[tipo].delete(id));
  render();toast('✅ '+ids.length+' linha(s) excluída(s).'+(bloqueadas?' '+bloqueadas+' continuam selecionadas, ainda ativas.':''));
 });
}

/* ================= ATUALIZAÇÃO AUTOMÁTICA (Supabase Realtime) =================
   Qualquer inserção/alteração/exclusão feita por outro usuário recarrega os dados em ~1 s.
   A tela só é redesenhada quando é seguro (sem modal aberto, sem formulário de compra/produção
   aberto e sem campo em edição); caso contrário a atualização espera e é aplicada logo depois. */
const TABELAS_TEMPO_REAL=['vendas','venda_itens','compras','compra_itens','estoque_bau','ajustes_caixa','itens','produtos','receitas','receita_insumos',
  'fornecedores','fornecedor_itens','parcerias','parceria_faixas','taxas_deslocamento','categorias_itens','profiles','configuracoes','solicitacoes_senha','avisos','depositos_caixa','categorias_receitas','perfis_acesso'];
let _rtCanal=null,_rtTimer=null,_rtPendente=false,_rtCarregando=false;
function iniciarTempoReal(){
  if(_rtCanal||!sb.channel)return;
  _rtCanal=sb.channel('bestbuds-sync');
  TABELAS_TEMPO_REAL.forEach(t=>_rtCanal.on('postgres_changes',{event:'*',schema:'public',table:t},agendarSincronizacao));
  _rtCanal.subscribe();
  setInterval(()=>{if(_rtPendente&&podeRedesenhar()){_rtPendente=false;render()}},1500);
}
function agendarSincronizacao(){clearTimeout(_rtTimer);_rtTimer=setTimeout(sincronizarAgora,700)}
async function sincronizarAgora(){
  if(_rtCarregando){agendarSincronizacao();return}
  _rtCarregando=true;
  try{await carregarTudo();aplicarIdentidadeVisual()}catch(e){console.warn('[Best Buds] falha ao sincronizar',e);_rtCarregando=false;return}
  _rtCarregando=false;
  atualizarSeloAvisos();mostrarAvisosPendentes();
  if(podeRedesenhar())render();else _rtPendente=true;
}
function podeRedesenhar(){
  if(document.querySelector('.modal-bg.open'))return false;
  if(typeof bauTela!=='undefined'&&bauTela)return false;
  if(filtroAberto||_sselAberto)return false;
  const a=document.activeElement,mc=document.getElementById('main-content');
  if(a&&mc&&mc.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return false;
  return true;
}

/* ================= LISTA SUSPENSA PESQUISÁVEL (todos os <select>) =================
   Cada <select> ganha um botão com lista + busca. O <select> original continua no DOM (oculto) e segue
   sendo a fonte do valor, então todo onchange/value existente funciona igual.
   Toda lista tem o campo de pesquisa; optgroup vira título de grupo;
   opção vazia "hidden" vira placeholder; data-ssel-extra="fn" acrescenta um rodapé (ex.: cadastrar fornecedor);
   data-nosearch desliga o recurso num select específico. */
let _sselAberto=null,_sselPop=null;
function sselNorm(t){return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
(function(){const P=HTMLSelectElement.prototype;['value','selectedIndex'].forEach(k=>{const d=Object.getOwnPropertyDescriptor(P,k);Object.defineProperty(P,k,{configurable:true,enumerable:d.enumerable,get(){return d.get.call(this)},set(v){d.set.call(this,v);if(this._ssel)this._ssel.sync()}})})})();
function sselAplicar(sel){
  if(sel._ssel||sel.multiple||sel.hasAttribute('data-nosearch'))return;
  const btn=document.createElement('button');btn.type='button';btn.className='ssel-btn';
  btn.style.cssText=sel.style.cssText;btn.style.display='';
  sel.style.display='none';sel.after(btn);
  const sync=()=>{
    const o=sel.options[sel.selectedIndex];const vazio=!o||(o.value===''&&(o.hidden||o.disabled));
    btn.innerHTML=`<span class="ssel-lbl ${vazio?'ph':''}">${esc(o?o.text:'Selecione...')}</span><span class="ssel-car">▼</span>`;
    btn.disabled=sel.disabled;btn.title=o&&!vazio?o.text:'';
  };
  sel._ssel={btn,sync};
  btn.addEventListener('click',()=>{_sselAberto===sel?sselFechar():sselAbrir(sel)});
  btn.addEventListener('keydown',e=>{if(['ArrowDown','Enter',' '].includes(e.key)){e.preventDefault();sselAbrir(sel)}});
  sel.addEventListener('change',sync);
  new MutationObserver(sync).observe(sel,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled','selected']});
  sync();
}
/* Posição das listas suspensas. No celular o teclado, ao abrir, dispara "resize" e "scroll":
   a lista não fecha por isso, só se reposiciona. No celular (tela estreita) a lista com busca vira um painel
   no alto da área visível, acima do teclado. */
function popCelular(){return window.matchMedia('(max-width:700px) and (pointer:coarse)').matches}
function popPosicionar(pop,anc,minW,folha){
  if(!pop||!anc||!anc.isConnected)return;
  const vv=window.visualViewport,vt=vv?vv.offsetTop:0,vl=vv?vv.offsetLeft:0,vh=vv?vv.height:innerHeight,vw=vv?vv.width:innerWidth;
  const ops=pop.querySelector('.ssel-ops');
  pop.style.top='';pop.style.bottom='';pop.style.maxHeight='';
  if(folha){
    pop.style.left=(vl+8)+'px';pop.style.width=(vw-16)+'px';pop.style.top=(vt+8)+'px';pop.style.maxHeight=(vh-16)+'px';
    if(ops)ops.style.maxHeight='none';
    return;
  }
  const r=anc.getBoundingClientRect(),w=Math.min(Math.max(r.width,minW),vw-16);
  pop.style.width=w+'px';pop.style.left=Math.max(vl+8,Math.min(r.left,vl+vw-w-8))+'px';
  const abaixo=vt+vh-r.bottom-12,acima=r.top-vt-12;
  if(abaixo<220&&acima>abaixo){pop.style.bottom=(innerHeight-r.top+4)+'px';pop.style.maxHeight=Math.max(120,acima)+'px'}
  else{pop.style.top=(r.bottom+4)+'px';pop.style.maxHeight=Math.max(120,abaixo)+'px'}
  if(ops)ops.style.maxHeight='';
}
function popReposicionar(){
  if(_sselPop&&_sselAberto)popPosicionar(_sselPop,_sselAberto._ssel.btn,240,_sselPop.classList.contains('ssel-folha'));
  if(_comboPop&&_comboInp)popPosicionar(_comboPop,_comboInp,260,false);
}
function sselAbrir(sel){
  sselFechar();if(sel.disabled)return;
  _sselAberto=sel;sel._ssel.btn.classList.add('aberto');
  const pop=document.createElement('div');pop.className='ssel-pop';_sselPop=pop;
  const itens=[];
  [...sel.children].forEach(ch=>{
    if(ch.tagName==='OPTGROUP'){itens.push({grp:ch.label});[...ch.children].forEach(o=>itens.push({o}))}
    else itens.push({o:ch});
  });
  const visiveis=itens.filter(x=>x.grp||!(x.o.hidden||(x.o.disabled&&x.o.value==='')));
  const nOps=visiveis.filter(x=>x.o).length;
  const extraFn=sel.dataset.sselExtra&&window[sel.dataset.sselExtra];
  const comBusca=true; // mesmo filtro em todas as listas suspensas
  pop.innerHTML=`${comBusca?'<input class="ssel-q" placeholder="🔍 Pesquisar..." autocomplete="off">':''}<div class="ssel-ops"></div><div class="ssel-extra"></div>`;
  const q=pop.querySelector('.ssel-q'),ops=pop.querySelector('.ssel-ops'),extra=pop.querySelector('.ssel-extra');
  let hl=-1,lista=[];
  const desenhar=()=>{
    const t=q?sselNorm(q.value.trim()):'';
    const res=[];let grp=null;
    visiveis.forEach(x=>{if(x.grp){grp=x.grp;return}if(!t||sselNorm(x.o.text).includes(t)){if(grp!==null&&!res.some(r=>r.grp===grp))res.push({grp});res.push(x)}});
    lista=res.filter(x=>x.o);hl=lista.findIndex(x=>x.o.selected&&x.o.value!=='');if(hl<0&&t&&lista.length)hl=0;
    ops.innerHTML=res.map(x=>x.grp!==undefined?`<div class="ssel-grp">${esc(x.grp)}</div>`:`<div class="ssel-op ${x.o.selected&&x.o.value!==''?'sel':''} ${lista[hl]===x?'hl':''}" data-i="${lista.indexOf(x)}">${esc(x.o.text)}</div>`).join('')||(extraFn?'':`<div class="ssel-vazio">Nenhum resultado${t?' para “'+esc(q.value.trim())+'”':''}.</div>`);   // com rodapé (ex.: vincular fornecedor), ele mesmo orienta
    extra.innerHTML=extraFn?extraFn(sel,q?q.value.trim():''):'';
  };
  const escolher=i=>{const x=lista[i];if(!x||x.o.disabled)return;sel.value=x.o.value;sel.dispatchEvent(new Event('change',{bubbles:true}));sselFechar();sel._ssel.btn.focus()};
  ops.addEventListener('mousedown',e=>{const d=e.target.closest('.ssel-op');if(d){e.preventDefault();escolher(+d.dataset.i)}});
  const mover=dlt=>{if(!lista.length)return;hl=(hl+dlt+lista.length)%lista.length;ops.querySelectorAll('.ssel-op').forEach(d=>d.classList.toggle('hl',+d.dataset.i===hl));const d=ops.querySelector('.ssel-op.hl');if(d)d.scrollIntoView({block:'nearest'})};
  const teclas=e=>{if(e.key==='ArrowDown'){e.preventDefault();mover(1)}else if(e.key==='ArrowUp'){e.preventDefault();mover(-1)}else if(e.key==='Enter'){e.preventDefault();escolher(hl<0?0:hl)}else if(e.key==='Escape'){e.preventDefault();sselFechar();sel._ssel.btn.focus()}};
  if(q){q.addEventListener('input',desenhar);q.addEventListener('keydown',teclas)}else pop.addEventListener('keydown',teclas);
  pop.tabIndex=-1;
  document.body.appendChild(pop);desenhar();
  const folha=popCelular();if(folha)pop.classList.add('ssel-folha');
  popPosicionar(pop,sel._ssel.btn,240,folha);
  (q||pop).focus({preventScroll:true});
  const d=ops.querySelector('.ssel-op.sel');if(d)d.scrollIntoView({block:'nearest'});
}
function sselFechar(){if(_sselPop){_sselPop.remove();_sselPop=null}if(_sselAberto){_sselAberto._ssel.btn.classList.remove('aberto');_sselAberto=null}}

/* ================= CAMPO COM LISTA SUSPENSA QUE ACEITA TEXTO LIVRE =================
   <input data-combo="itens|fornecedores">: digitar filtra a lista (mesmo visual e filtro das listas suspensas),
   mas o valor digitado é aceito mesmo fora da lista (ex.: item não cadastrado na compra). */
const COMBO_FONTES={
  // itens agrupados por categoria (na ordem das categorias), com divisória entre os grupos
  itens:()=>{const cats=ordenarPorOrdem([...db.categorias]).map(c=>c.codigo),pos=c=>{const k=cats.indexOf(c);return k<0?1e9:k};
    return itensCompraveis().sort((a,b)=>pos(a.categoria)-pos(b.categoria)||a.nome.localeCompare(b.nome,'pt-BR')).map(i=>({v:i.nome,grp:catNome(i.categoria)}))},
  fornecedores:()=>db.fornecedores.filter(f=>f.status==='ativo').sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).map(f=>({v:f.nome}))
};
const COMBO_FORA={itens:'não está no cadastro — a linha fica como item Manual (não entra no Baú).',fornecedores:'não está cadastrado — será registrado como fornecedor avulso.'};
/* Rodapé da lista de itens da compra: atalho para cadastrar o item que está sendo comprado (Gerente para cima) */
const COMBO_EXTRA={
  itens:(inp,q,exato)=>{
    if(exato||!pode('itens')||!inp.closest('.cmp-row'))return '';
    const ja=q&&db.itens.find(i=>sselNorm(i.nome)===sselNorm(q));
    if(ja&&ja.status!=='ativo')return`<div class="ssel-vazio">“${esc(ja.nome)}” está inativo no cadastro. Reative em Configurações › Cadastro Central de Itens.</div>`;
    if(ja)return`<button type="button" class="ssel-add" onclick="cadastrarItemAtalho()">✏️ “${esc(ja.nome)}” é de categoria que não pode ser comprada — trocar a categoria</button>`;
    return`<button type="button" class="ssel-add" onclick="cadastrarItemAtalho()">+ Cadastrar ${q?'item “'+esc(q)+'”':'novo item'}</button>`;
  }
};
function cadastrarItemAtalho(){
  const inp=_comboInp;comboFechar();if(!inp)return;
  const linha=inp.closest('.cmp-row'),p=linha.parentElement.id.replace(/-linhas$/,''),q=inp.value.trim();
  const ja=q&&db.itens.find(i=>sselNorm(i.nome)===sselNorm(q));
  modalItem(ja?ja.id:null,{nome:q,onSaved:it=>{
    if(!it)return;
    if(!catCompravel(it.categoria)){toast('⚠️ "'+it.nome+'" foi salvo, mas a categoria não pode ser comprada.');return}
    inp.value=it.nome;aoDigitarItemCompra(inp,p);linha.classList.remove('linha-erro');
    toast('✅ Item "'+it.nome+'" cadastrado e escolhido.'+(fornecedoresDoItem(it.id).length?'':' Agora vincule o fornecedor e o valor na lista de Fornecedor.'));
  }});
}
let _comboInp=null,_comboPop=null,_comboHl=-1,_comboLista=[];
function comboFechar(){if(_comboPop){_comboPop.remove();_comboPop=null}_comboInp=null}
function comboDesenhar(){
  const inp=_comboInp;if(!inp||!_comboPop)return;
  const fonte=COMBO_FONTES[inp.dataset.combo];const t=sselNorm(inp.value.trim());
  _comboLista=(fonte?fonte():[]).filter(o=>!t||sselNorm(o.v).includes(t));
  const exato=_comboLista.some(o=>sselNorm(o.v)===t);
  if(_comboHl>=_comboLista.length)_comboHl=_comboLista.length-1;
  let grp;
  _comboPop.querySelector('.ssel-ops').innerHTML=_comboLista.map((o,i)=>{
    const cab=o.grp!==undefined&&o.grp!==grp?`<div class="ssel-grp">${esc(o.grp)}</div>`:'';grp=o.grp;
    return cab+`<div class="ssel-op ${sselNorm(o.v)===t?'sel':''} ${i===_comboHl?'hl':''}" data-i="${i}">${esc(o.v)}${o.sub?` <span class="ssel-sub">${esc(o.sub)}</span>`:''}</div>`;
  }).join('')||(t?'':`<div class="ssel-vazio">Nenhuma opção cadastrada.</div>`);
  const extraFn=COMBO_EXTRA[inp.dataset.combo];
  _comboPop.querySelector('.ssel-extra').innerHTML=(t&&!exato?`<div class="ssel-vazio">“${esc(inp.value.trim())}” ${COMBO_FORA[inp.dataset.combo]||''}</div>`:'')+(extraFn?extraFn(inp,inp.value.trim(),exato):'');
  const hl=_comboPop.querySelector('.ssel-op.hl');if(hl)hl.scrollIntoView({block:'nearest'});
}
function comboAbrir(inp){
  sselFechar();if(_comboInp!==inp)comboFechar();
  if(!_comboPop){
    _comboInp=inp;_comboHl=-1;
    const pop=document.createElement('div');pop.className='ssel-pop combo-pop';pop.innerHTML='<div class="ssel-ops"></div><div class="ssel-extra"></div>';_comboPop=pop;
    pop.addEventListener('mousedown',e=>{e.preventDefault();const d=e.target.closest('.ssel-op');if(d)comboEscolher(+d.dataset.i)});
    document.body.appendChild(pop);
  }
  popPosicionar(_comboPop,inp,260,false);
  comboDesenhar();
}
function comboEscolher(i){
  const inp=_comboInp,o=_comboLista[i];if(!inp||!o)return;
  inp.value=o.v;comboFechar();inp.dispatchEvent(new Event('input',{bubbles:true}));
}
document.addEventListener('focusin',e=>{const inp=e.target.closest&&e.target.closest('input[data-combo]');if(inp)comboAbrir(inp);else if(_comboPop&&!_comboPop.contains(e.target))comboFechar()});
document.addEventListener('input',e=>{if(e.target===_comboInp){_comboHl=e.target.value.trim()?0:-1;comboDesenhar()}},true);
document.addEventListener('keydown',e=>{
  if(!_comboInp||e.target!==_comboInp)return;
  const n=_comboLista.length;
  if(e.key==='ArrowDown'){e.preventDefault();if(n){_comboHl=(_comboHl+1)%n;comboDesenhar()}}
  else if(e.key==='ArrowUp'){e.preventDefault();if(n){_comboHl=(_comboHl-1+n)%n;comboDesenhar()}}
  else if(e.key==='Enter'){if(_comboHl>=0&&n){e.preventDefault();comboEscolher(_comboHl)}else comboFechar()}
  else if(e.key==='Escape'||e.key==='Tab')comboFechar();
});
document.addEventListener('mousedown',e=>{if(_comboPop&&!_comboPop.contains(e.target)&&e.target!==_comboInp)comboFechar()});



/* ================= EQUIPE: QUEM ESTÁ ON-LINE =================
   Presença pelo Supabase Realtime (canal "presenca"): cada aba aberta e logada anuncia o usuário;
   ao fechar a aba ou perder a conexão, a pessoa sai da lista On-line sozinha. Não grava nada no banco
   (não conta no limite de requisições). A lista começa recolhida: só "On-line" e "Off-line", que abrem ao clicar.
   Cada pessoa aparece com o nome e, abaixo, o perfil no mesmo selo da aba Usuários. */
let _presCanal=null,_online=new Set(),_eqAberto={on:false,off:false};
function iniciarPresenca(){
  if(_presCanal||!sb.channel||!session)return;
  const eu=session.usuario_id;
  _presCanal=sb.channel('presenca',{config:{presence:{key:eu}}});
  _presCanal.on('presence',{event:'sync'},()=>{
    const st=_presCanal.presenceState?_presCanal.presenceState():{};
    _online=new Set(Object.keys(st));renderEquipe();
  });
  _presCanal.subscribe(status=>{if(status==='SUBSCRIBED')_presCanal.track({usuario_id:eu,desde:new Date().toISOString()})});
}
function corPerfil(id){const p=perfilPorId(id);return p&&PERFIL_CORES.some(c=>c[0]===p.cor)?p.cor:'cinza'}
function seloPerfilId(id,mini){return `<span class="badge pc pc-${corPerfil(id)}${mini?' mini':''}">${esc(nomePerfil(id))}</span>`}
function seloPerfil(u,mini){return seloPerfilId(perfilIdDe(u),mini)}
function membrosEquipe(){return (db.usuarios||[]).filter(u=>u.status==='ativo').sort((a,b)=>ordemPerfil(a)-ordemPerfil(b)||String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR',{sensitivity:'base'}))}
function alternarEquipe(k){_eqAberto[k]=!_eqAberto[k];renderEquipe()}
const EQ_PERFIL_PLURAL={socio:'Sócios',diretor:'Diretores',gerente:'Gerentes',vendedor:'Vendedores'};
function renderEquipe(){
  const el=document.getElementById('eq-sec');if(!el||!db||!session)return;
  const eu=session.usuario_id,todos=membrosEquipe();
  const estaOn=u=>u.id===eu||_online.has(u.id);   // quem está vendo a tela está on-line
  const on=todos.filter(estaOn),off=todos.filter(u=>!estaOn(u));
  // v4.38 (pedido do dono): foto do personagem (ou iniciais) na frente do nome e a lista dividida por perfil, sem o selo
  const item=(u,ok)=>`<div class="eq-item ${ok?'':'off'}">${fotoUsuarioHTML(u,26)}<span class="nm" title="${esc(u.nome)}">${esc(u.nome)}${u.id===eu?' <span class="muted" style="font-size:11px;font-weight:400">(você)</span>':''}</span></div>`;
  // v4.39: grupos na ordem dos perfis (Configurações › Usuários › Perfis), com o nome e a cor de cada um
  const porPerfil=(lista,ok)=>{const ordem=[...perfisOrdenados().map(p=>p.id)];lista.forEach(u=>{if(!ordem.includes(perfilIdDe(u)))ordem.push(perfilIdDe(u))});
    return ordem.map(pf=>{const l=lista.filter(u=>perfilIdDe(u)===pf);
    return l.length?`<div class="eq-sub pc pc-${corPerfil(pf)}">${esc(EQ_PERFIL_PLURAL[pf]||nomePerfil(pf))}<span>${l.length}</span></div>${l.map(u=>item(u,ok)).join('')}`:''}).join('')};
  const grupo=(k,tit,lista,ok,vazio)=>`<button class="eq-grp ${ok?'on':''} ${_eqAberto[k]?'aberto':''}" aria-expanded="${_eqAberto[k]}" onclick="alternarEquipe('${k}')"><span class="seta">▶</span><span class="dot"></span>${tit}<span class="n">${lista.length}</span></button>
    ${_eqAberto[k]?`<div class="eq-lista">${porPerfil(lista,ok)||`<div class="eq-vazio">${vazio}</div>`}</div>`:''}`;
  el.innerHTML=grupo('on','On-line',on,true,'Ninguém on-line.')+grupo('off','Off-line',off,false,'Todos on-line.');
}
function renderPerfilRodape(){
  const el=document.getElementById('eq-perfil'),u=db&&sessionUser();if(!el||!u)return;

  el.innerHTML=`<button type="button" class="eq-foto" title="Meu perfil: nome e foto" onclick="modalMeuPerfil()">${fotoUsuarioHTML(u,38)}</button><div class="info"><span class="nm" title="${esc(u.nome)}">${esc(u.nome)}</span>${seloPerfil(u)}</div>
