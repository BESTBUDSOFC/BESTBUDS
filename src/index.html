async function salvarAjusteBau(itemId,tipo){
  if(!pode('bau_gerir'))return toast('⚠️ Seu perfil não faz entradas e saídas avulsas.');
  const it=db.itens.find(i=>i.id===itemId);if(!it)return;
  const qtd=parseFloat(document.getElementById('aj-qtd').value);
  const motivo=document.getElementById('aj-motivo').value.trim();
  const e=document.getElementById('aj-err');
  if(!(qtd>0)){e.textContent='Informe uma quantidade maior que zero.';e.style.display='block';return}
  const saldoAnt=saldoItem(itemId);
  if(tipo==='saida'&&qtd>saldoAnt){e.textContent=`Saldo insuficiente (disponível: ${saldoAnt}).`;e.style.display='block';return}
  const operacaoId=await nextOpId();
  const mv={operacao_id:operacaoId,item_id:itemId,tipo_movimento:tipo==='entrada'?'ajuste_entrada':'ajuste_saida',quantidade:qtd,usuario_id:sessionUser().id,usuario_nome:sessionUser().nome,origem:(motivo||'ajuste manual')+' — por '+sessionUser().nome,saldo_resultante:tipo==='entrada'?saldoAnt+qtd:saldoAnt-qtd};
  const{data,error}=await sb.from('estoque_bau').insert(mv).select().single();
  if(error)return toast('⚠️ Erro ao registrar movimentação: '+error.message);
  db.estoque_bau.unshift({...data,quantidade:Number(data.quantidade),saldo_resultante:Number(data.saldo_resultante)});
  reg(tipo==='entrada'?'Ajuste de estoque (+)':'Ajuste de estoque (−)',`${it.nome}: ${tipo==='entrada'?'+':'−'}${qtd} ${it.unidade_medida}${motivo?' — '+motivo:''}`);
  closeModal();toast('✅ Movimentação registrada no Baú.');render();
}

/* Receita do produto final (🏁): é o último passo do processo produtivo. Ela produz exatamente um item da categoria
   Produto Final (o item de um produto do Catálogo). Receita sem o flag não produz produto final. */
function ehProdutoFinal(it){return !!it&&it.categoria==='produto_final'}
function itensReceita(usados){return db.itens.filter(i=>(i.status==='ativo'&&catReceitas(i.categoria))||(usados&&usados.has(i.id)))}
function itensProduzidos(final,usados){return itensReceita(usados).filter(i=>ehProdutoFinal(i)===!!final)}
function modalReceita(id){

  const r=id?db.receitas.find(x=>x.id===id):null;
  const ins=r?(r.insumos||[]):[];
  const usados=new Set(ins.map(x=>x.item_id));
  const final=!!(r&&r.produto_final);
  const cons=ins.filter(x=>x.papel==='consumo'),prod=ins.filter(x=>x.papel==='produzido');
  openModal(`<h3>${r?'Editar receita':'Nova receita'}</h3>
  <div class="row2"><div class="field"><label>Nome da receita</label><input id="r-nome" value="${r?esc(r.nome):''}"></div>
  <div class="field"><label>Categoria</label><select id="r-cat"><option value="">Sem categoria</option>${catsReceitaOrdenadas().map(c=>`<option value="${c.id}" ${r&&r.categoria_id===c.id?'selected':''}>${esc((c.icone?c.icone+' ':'')+c.nome)}</option>`).join('')}</select></div></div>
  <label class="r-final"><input type="checkbox" id="r-final" ${final?'checked':''} onchange="receitaFinalMudou()"> <span>🏁 Esta receita faz o <b>produto final</b> (último passo do processo)</span></label>
  <div class="section-title" style="margin-top:8px;color:var(--warning-light)">⬇️ Bloco 1 — Itens utilizados (insumos consumidos do Baú)</div>
  <div id="r-cons">${cons.map(ri=>linhaReceita(ri,itensReceita(usados),'cons')).join('')}</div>

  <div class="section-title" style="margin-top:16px;color:var(--green)" id="r-prod-tit"></div>
  <div id="r-prod">${prod.map(ri=>linhaReceita(ri,itensProduzidos(final,usados),'prod')).join('')}</div>
  <button class="btn btn-ghost btn-sm" id="r-prod-add" onclick="addLinhaReceita('prod')">+ Adicionar item produzido</button>
  <p class="muted" id="r-prod-dica" style="font-size:12px;margin-top:8px"></p>
  <p id="r-err" style="color:var(--danger);font-size:13px;display:none;margin-top:10px"></p>
  <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
  <button class="btn btn-purple" onclick="salvarReceita('${id||''}')">Salvar</button></div>`);
  receitaFinalMudou(true);
}
/* Liga/desliga o 🏁: troca as opções do bloco "produz" (só Produto Final, ou tudo menos Produto Final) */
function receitaFinalMudou(abrindo){
  const final=document.getElementById('r-final').checked;
  const box=document.getElementById('r-prod');
  const usados=new Set([...box.querySelectorAll('.ri-item')].map(s=>s.value));
  const opcoes=itensProduzidos(final,usados);
  [...box.querySelectorAll('[data-prod]')].forEach(d=>{
    const sel=d.querySelector('.ri-item');if(opcoes.some(i=>i.id===sel.value))return;
    if(abrindo)return; // receita antiga fora da regra: mostra como está; salvar avisa
    d.remove();
  });
  if(final&&!box.querySelector('[data-prod]'))addLinhaReceita('prod');
  if(final)[...box.querySelectorAll('[data-prod]')].slice(1).forEach(d=>d.remove());
  const pf=controlaEstoque('produto_final');
  document.getElementById('r-prod-tit').textContent=final?'🏁 Bloco 2 — Produto final (vendido no Caixa)':'⬆️ Bloco 2 — Itens produzidos (entram no Baú)';
  document.getElementById('r-prod-add').style.display=final?'none':'';
  document.getElementById('r-prod-dica').innerHTML=final
    ?`Escolha o produto do Catálogo que esta receita faz. A foto e o nome dele aparecem na tela Produzir. ${pf?'A categoria Produto Final tem controle de estoque: o produto entra no Baú ao produzir e sai na venda guardada no caixa.':'A categoria Produto Final está sem controle de estoque: o produto não entra no Baú.'}`
    :'Produto final só no último passo: marque 🏁 acima.';
}
function linhaReceita(ri,itensSel,tipo){
  const opts=(ri.item_id?'':'<option value="" disabled hidden selected>Selecione...</option>')+itensSel.map(i=>`<option value="${i.id}" ${ri.item_id===i.id?'selected':''}>${esc(i.nome)} (${catNome(i.categoria)})</option>`).join('');
  return`<div class="row2" style="margin-bottom:8px" data-${tipo}>
    <select class="ri-item">${opts}</select>
    <div style="display:flex;gap:6px">
      <input class="ri-qtd" type="number" min="0.01" step="0.01" placeholder="Qtd" value="${ri.quantidade||''}">
      <button class="iconbtn" title="Remover linha" onclick="this.closest('[data-${tipo}]').remove()">✕</button>
    </div></div>`;
}
function addLinhaReceita(tipo){
  const final=!!document.getElementById('r-final')?.checked;
  const itensSel=tipo==='prod'?itensProduzidos(final):itensReceita();
  const d=document.createElement('div');
  d.innerHTML=linhaReceita({item_id:'',quantidade:tipo==='prod'&&final?1:''},itensSel,tipo);
  document.getElementById(tipo==='cons'?'r-cons':'r-prod').appendChild(d.firstElementChild);
}
async function salvarReceita(id){
  if(!pode('receitas'))return toast('⚠️ Seu perfil não cria nem edita receitas.');
  const nome=document.getElementById('r-nome').value.trim();
  const categoria_id=document.getElementById('r-cat')?.value||null;
  const e=document.getElementById('r-err');
  const fail=m=>{e.textContent=m;e.style.display='block'};
  const cons=[...document.querySelectorAll('#r-cons [data-cons]')].map(d=>({
    item_id:d.querySelector('.ri-item').value,quantidade:parseFloat(d.querySelector('.ri-qtd').value),papel:'consumo'
  })).filter(x=>x.item_id&&x.quantidade>0);
  const prod=[...document.querySelectorAll('#r-prod [data-prod]')].map(d=>({
    item_id:d.querySelector('.ri-item').value,quantidade:parseFloat(d.querySelector('.ri-qtd').value),papel:'produzido'
  })).filter(x=>x.item_id&&x.quantidade>0);
  const produto_final=document.getElementById('r-final').checked;
  const itemDe=x=>db.itens.find(i=>i.id===x.item_id);
  if(!nome)return fail('Informe o nome da receita.');
  if(!cons.length)return fail('Adicione ao menos um insumo consumido no Bloco 1.');
  if(produto_final){
    if(prod.length!==1)return fail('Receita do produto final: escolha um produto final no Bloco 2, com a quantidade.');
    if(!ehProdutoFinal(itemDe(prod[0])))return fail('O Bloco 2 da receita do produto final só aceita item da categoria Produto Final.');
  }else{
    if(!prod.length)return fail('Adicione ao menos um item produzido no Bloco 2 (ou marque 🏁 se esta receita faz o produto final).');
    if(prod.some(x=>ehProdutoFinal(itemDe(x))))return fail('Produto final só no último passo: marque 🏁 "Esta receita faz o produto final".');
  }
  const todos=[...cons,...prod];
  let receitaId=id,novaOrdem=null;
  if(id){
    const{error}=await sb.from('receitas').update({nome,categoria_id,produto_final}).eq('id',id);
    if(error)return fail('Erro ao salvar: '+error.message);
    await sb.from('receita_insumos').delete().eq('receita_id',id);
  }else{
    const{data,error}=await sb.from('receitas').insert({nome,categoria_id,produto_final,ordem:proximaOrdem(db.receitas),criado_por:sessionUser().id}).select().single();
    if(error)return fail('Erro ao salvar: '+error.message);
    receitaId=data.id;novaOrdem=data.ordem;
  }
  const linhas=todos.map(x=>({receita_id:receitaId,item_id:x.item_id,quantidade:x.quantidade,tipo:x.papel==='produzido'?'producao':'consumo'}));
  const{data:insInseridos,error:e2}=await sb.from('receita_insumos').insert(linhas).select();
  if(e2)return fail('Erro ao salvar insumos: '+e2.message);
  const insumosLocal=insInseridos.map(ri=>({item_id:ri.item_id,quantidade:Number(ri.quantidade),papel:ri.tipo==='producao'?'produzido':'consumo',_id:ri.id}));
  if(id){const i=db.receitas.findIndex(x=>x.id===id);db.receitas[i]={...db.receitas[i],nome,categoria_id,produto_final,insumos:insumosLocal}}
  else db.receitas.push({id:receitaId,nome,categoria_id,produto_final,ordem:novaOrdem,status:'ativo',criado_em:nowISO(),criado_por:sessionUser().id,insumos:insumosLocal});
  reg(id?'Receita editada':'Receita criada',nome);
  closeModal();toast('✅ Receita salva.');render();
}
async function delReceita(id){
  const r=db.receitas.find(x=>x.id===id);if(!r)return;
  confirmar('Excluir receita',`A receita "${r.nome}" será removida. Confirmar?`,async()=>{
    const{error}=await sb.from('receitas').delete().eq('id',id);
    if(error)return toast('⚠️ Erro ao excluir: '+error.message);
    db.receitas=db.receitas.filter(x=>x.id!==id);
    reg('Receita excluída',r.nome);render();
  });
}
function excluirReceita(id){
  if(!pode('excluir_cadastros'))return toast('⚠️ Seu perfil não pode excluir cadastros.');
  if((db.receitas.find(x=>x.id===id)||{}).status==='ativo')return toast('⚠️ Inative o cadastro (⏸️) antes de excluir.');
  delReceita(id);
}
/* ================= PRODUÇÃO EM CASCATA =================
   Quando faltam insumos, procura receitas ativas que os produzam e monta um plano que começa pela
   primeira receita da cadeia (a mais "de baixo") até chegar à receita pedida. Tudo é simulado sobre
   o saldo atual do Baú; nada é gravado antes da confirmação. */
function receitaProdutora(itemId,pilha){
  return [...db.receitas].filter(r=>r.status==='ativo'&&!pilha.includes(r.id)&&(r.insumos||[]).some(x=>x.papel==='produzido'&&x.item_id===itemId&&x.quantidade>0))
    .sort((a,b)=>(a.ordem||99)-(b.ordem||99))[0]||null;
}
function saldosBau(){
  const s={};db.itens.forEach(i=>{s[i.id]=0});
  db.estoque_bau.forEach(m=>{if(m.status==='revertida')return;s[m.item_id]=(s[m.item_id]||0)+(m.tipo_movimento.startsWith('entrada')||m.tipo_movimento==='ajuste_entrada'?m.quantidade:-m.quantidade)});
  return s;
}
function planejarCascata(rid,q,base){
  const saldo={...(base||saldosBau())};
  const inicial={...saldo},passos=[];
  const produzir=(r,qtd,pilha)=>{
    const cons=(r.insumos||[]).filter(x=>x.papel==='consumo');
    for(let tentativa=0;tentativa<10;tentativa++){
      let produziuAlgo=false;
      for(const x of cons){
        const it=db.itens.find(i=>i.id===x.item_id);if(!it||!controlaEstoque(it.categoria))continue;
        const falta=x.quantidade*qtd-saldo[it.id];if(falta<=0)continue;
        const r2=receitaProdutora(it.id,[...pilha,r.id]);if(!r2)continue;
        const porLote=(r2.insumos||[]).find(y=>y.papel==='produzido'&&y.item_id===it.id).quantidade;
        produzir(r2,Math.ceil(falta/porLote),[...pilha,r.id]);produziuAlgo=true;
      }
      if(!produziuAlgo)break;
    }
    const mov=[];
    cons.forEach(x=>{const it=db.itens.find(i=>i.id===x.item_id);if(it&&controlaEstoque(it.categoria)){saldo[it.id]-=x.quantidade*qtd;mov.push({it,q:-x.quantidade*qtd})}});
    (r.insumos||[]).filter(x=>x.papel==='produzido').forEach(x=>{const it=db.itens.find(i=>i.id===x.item_id);if(it&&controlaEstoque(it.categoria)){saldo[it.id]+=x.quantidade*qtd;mov.push({it,q:x.quantidade*qtd})}});
    passos.push({r,qtd,mov});
  };
  produzir(db.receitas.find(x=>x.id===rid),q,[]);
  // falta = o que esta produção deixaria negativo. Saldo que já estava negativo (venda sem estoque, permitido) não trava
  // outras produções; só conta o que a produção tiraria a mais dele.
  const faltaDe=i=>Math.min(0,inicial[i.id])-saldo[i.id];
  const faltas=db.itens.filter(i=>faltaDe(i)>1e-9).map(i=>({it:i,falta:faltaDe(i)}));
  const efeito=db.itens.filter(i=>Math.abs(saldo[i.id]-inicial[i.id])>1e-9).map(i=>({it:i,antes:inicial[i.id],depois:saldo[i.id]}));
  return{passos,faltas,efeito,possivel:!faltas.length,temCascata:passos.length>1};
}
function fmtQtd(n){return Number(n.toFixed(4)).toLocaleString('pt-BR')}
async function confirmarCascata(rid,q){
  const pl=planejarCascata(rid,q);
  if(!pl.possivel)return toast('⚠️ O saldo mudou e a cascata não é mais possível. Revise a produção.');
  const btn=document.getElementById('btn-conf-cascata');if(btn){btn.disabled=true;btn.textContent='Produzindo…'}
  const solta=()=>{if(btn){btn.disabled=false;prodAtualizarJanela()}};
  let opId;try{opId=await nextOpId()}catch(e){solta();return toast('⚠️ Erro ao gerar ID: '+(e.message||e))}
  const alvo=pl.passos[pl.passos.length-1].r.nome,saldo={},movimentos=[];
  pl.passos.forEach(p=>p.mov.forEach(m=>{
    if(saldo[m.it.id]===undefined)saldo[m.it.id]=saldoItem(m.it.id);
    saldo[m.it.id]+=m.q;
    const tipo=m.q>0?'entrada_producao':(m.it.categoria==='produto_nao_acabado'?'saida_deducao':'saida_producao');
    movimentos.push({operacao_id:opId,item_id:m.it.id,tipo_movimento:tipo,quantidade:Math.abs(m.q),usuario_id:sessionUser().id,usuario_nome:sessionUser().nome,
      origem:'produção em cascata: '+p.r.nome+(p.r.nome!==alvo?' (para '+alvo+')':''),saldo_resultante:saldo[m.it.id]});
  }));
  // um único insert: ou grava a cascata inteira, ou nada
  const{data,error}=await sb.from('estoque_bau').insert(movimentos).select();
  if(error){solta();return toast('⚠️ Erro ao gravar a produção: '+error.message)}
  data.forEach(d=>db.estoque_bau.unshift({...d,quantidade:Number(d.quantidade),saldo_resultante:Number(d.saldo_resultante)}));
  reg('Produção em cascata',`${alvo} × ${q} — ID ${opId} — ${pl.passos.map(p=>p.r.nome+' ×'+p.qtd).join(' → ')}`);
  prodQtd=1;closeModal();toast('✅ Produção em cascata executada.');render();
}
/* Produção direta (sem cascata): um único insert com as saídas dos insumos e as entradas do que foi produzido. */
async function produzirDireto(rid,q,falha){
  const r=db.receitas.find(x=>x.id===rid);if(!r)return;
  falha=falha||(t=>toast('⚠️ '+t));
  const cons=(r.insumos||[]).filter(x=>x.papel==='consumo').map(x=>({ri:x,it:db.itens.find(i=>i.id===x.item_id)}));
  if(cons.some(x=>x.it&&controlaEstoque(x.it.categoria)&&saldoItem(x.it.id)<x.ri.quantidade*q))return falha('O saldo mudou e não há insumos suficientes. Revise a quantidade.');
  const btn=document.getElementById('btn-produzir');if(btn){btn.disabled=true;btn.textContent='Produzindo…'}
  const solta=()=>{if(btn){btn.disabled=false;prodAtualizarJanela()}};
  let producaoId;try{producaoId=await nextOpId()}catch(e){solta();return falha('Erro ao gerar ID: '+(e.message||e))}
  const prd=(r.insumos||[]).filter(x=>x.papel==='produzido').map(x=>({ri:x,it:db.itens.find(i=>i.id===x.item_id)}));
  const movimentos=[];
  cons.forEach(x=>{
    if(!x.it||!controlaEstoque(x.it.categoria))return;
    const tipo=x.it.categoria==='produto_nao_acabado'?'saida_deducao':'saida_producao';
    movimentos.push({operacao_id:producaoId,item_id:x.it.id,tipo_movimento:tipo,quantidade:x.ri.quantidade*q,usuario_id:sessionUser().id,usuario_nome:sessionUser().nome,origem:'produção: '+r.nome,saldo_resultante:saldoItem(x.it.id)-x.ri.quantidade*q});
  });
  prd.forEach(x=>{
    if(!x.it||!controlaEstoque(x.it.categoria))return;
    movimentos.push({operacao_id:producaoId,item_id:x.it.id,tipo_movimento:'entrada_producao',quantidade:x.ri.quantidade*q,usuario_id:sessionUser().id,usuario_nome:sessionUser().nome,origem:'produção: '+r.nome,saldo_resultante:saldoItem(x.it.id)+x.ri.quantidade*q});
  });
  if(movimentos.length){
    const{data,error}=await sb.from('estoque_bau').insert(movimentos).select();
    if(error){solta();return falha('Erro ao gravar produção: '+error.message)}
    data.forEach(d=>db.estoque_bau.unshift({...d,quantidade:Number(d.quantidade),saldo_resultante:Number(d.saldo_resultante)}));
  }
  reg('Produção executada',`${r.nome} — ID ${producaoId} — quantidade ${q}`);prodQtd=1;closeModal();toast('✅ Produção executada.');render();
}

/* ================= COMPRAS ================= */
/* Lista única de itens da compra. Cada linha vira, sozinha, um de dois tipos:
   • Automático — o item digitado/escolhido existe no cadastro (categoria comprável). O fornecedor é escolhido entre os
     vinculados ao item e o valor unitário vem desse vínculo (Configurações › Fornecedores), travado. Dá entrada no Baú
     só se a categoria do item tiver controle de estoque; sem controle, fica só no financeiro ("sem Baú").
   • Manual — item que não está no cadastro. Fornecedor e valor unitário são digitados. Só registro financeiro.
   O mesmo formulário serve a Nova compra (prefixo "c") e à edição no Histórico Financeiro (prefixo "ec"). */
function precoFornItem(fid,itemId){const v=db.fornecedor_itens.find(x=>x.fornecedor_id===fid&&x.item_id===itemId);return v&&v.preco_unitario!=null?Number(v.preco_unitario):null}
function itemCompravelPorNome(nome){const n=sselNorm(String(nome||'').trim());return n?itensCompraveis().find(i=>sselNorm(i.nome)===n)||null:null}
function fornOptionsHTML(itemId,selId){
  const lista=[...fornecedoresDoItem(itemId)];
  if(selId&&!lista.some(f=>f.id===selId)){const f=db.fornecedores.find(x=>x.id===selId);if(f)lista.push(f)}
  lista.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  return `<option value="" disabled hidden ${selId?'':'selected'}>${lista.length?'Selecione o fornecedor...':'Nenhum fornecedor vinculado'}</option>`+
    lista.map(f=>{const pr=precoFornItem(f.id,itemId);return`<option value="${f.id}" ${f.id===selId?'selected':''}>${esc(f.nome)}${pr!=null?' · '+fmt(pr):''}</option>`}).join('');
}
const TIPO_COMPRA={auto:['Automático','Item do cadastro: preço do fornecedor e entrada no Baú'],sembau:['Automático','Item do cadastro sem controle de estoque (pela categoria): preço do fornecedor, só registro financeiro — não entra no Baú'],manual:['Manual','Item não cadastrado: fornecedor e valor digitados, só registro financeiro']};
/* it = item do cadastro (Automático) ou null (Manual) */
function tagTipoCompra(it,vazio){
  if(vazio)return '';
  const k=!it?'manual':controlaEstoque(it.categoria)?'auto':'sembau',t=TIPO_COMPRA[k];
  return`<span class="cp-tipo-tag ${k==='manual'?'manual':'auto'}" title="${t[1]}">${t[0]}${k==='sembau'?'<small>sem Baú</small>':''}</span>`;
}
function celFornCompra(p,itemId,fornId,fornNome){
  return itemId?`<select class="cp-forn" data-ssel-extra="fornSselExtra" onchange="aoTrocarFornCompra(this,'${p}')">${fornOptionsHTML(itemId,fornId)}</select>`
    :`<input class="cp-forn-txt" data-combo="fornecedores" autocomplete="off" placeholder="Fornecedor" value="${esc(fornNome||'')}">`;
}
function celPrecoCompra(p,itemId,preco){
  return itemId?`<span class="cp-preco-fixo" title="Valor do fornecedor para este item (Configurações › Fornecedores)">🔒 <b>${preco!==''&&preco!=null?fmt(preco):'—'}</b></span>`
    :`<input class="cp-preco" type="number" min="0.01" step="0.01" placeholder="$ 0,00" value="${preco??''}" oninput="aoEditarValorCompra(this,'preco','${p}')">`;
}
/* Subtotal: Automático = travado (quantidade × valor do fornecedor); Manual = digitável.
   Manual: quantidade + valor unitário → calcula o subtotal; quantidade + subtotal → calcula o valor unitário. */
function celSubCompra(p,itemId,sub){
  return itemId?`<span class="cp-preco-fixo cp-sub-fixo" title="Quantidade × valor do fornecedor">🔒 <b>—</b></span>`
    :`<input class="cp-sub" type="number" min="0.01" step="0.01" placeholder="$ 0,00" value="${sub??''}" oninput="aoEditarValorCompra(this,'sub','${p}')">`;
}
const arred2=v=>Math.round(v*100)/100;
/* Atalhos +5 / +15 / +75: somam à quantidade da linha e recalculam como se tivesse digitado */
function somarQtdCompra(btn,n){
  const inp=btn.closest('.cp-qtd-cel').querySelector('.cp-qtd');
  inp.value=arred2((parseFloat(inp.value)||0)+n);inp.dispatchEvent(new Event('input',{bubbles:true}));
}
function aoEditarValorCompra(inp,campo,p){
  const r=inp.closest('.cmp-row');
  if(!r.dataset.item){
    const q=parseFloat(r.querySelector('.cp-qtd').value),pe=r.querySelector('.cp-preco'),se=r.querySelector('.cp-sub');
    if(campo==='preco'||campo==='sub')r.dataset.base=campo;           // o último campo de valor digitado manda
    const base=r.dataset.base||'preco';
    if(q>0){
      if(base==='sub'){const sv=parseFloat(se.value);if(sv>0)pe.value=arred2(sv/q)}
      else{const pv=parseFloat(pe.value);if(pv>0)se.value=arred2(pv*q)}
    }
  }
  recalcCompra(p);
}
function linhaCompra(p,ci){
  ci=ci||{};
  const it=ci.item_id?db.itens.find(i=>i.id===ci.item_id):null;
  let forn=ci.fornecedor_id||'',preco=ci.preco_unitario;
  if(it&&!forn){const v=fornecedoresDoItem(it.id);if(v.length===1)forn=v[0].id}
  if(it&&preco==null&&forn)preco=precoFornItem(forn,it.id);
  return`<div class="cmp-row" data-cmp data-item="${it?it.id:''}" data-preco="${it&&preco!=null?preco:''}" oninput="this.classList.remove('linha-erro')" onchange="this.classList.remove('linha-erro')">
    <input class="cp-item" data-combo="itens" autocomplete="off" placeholder="Item (digite ou escolha)" value="${esc(it?it.nome:(ci.nome||''))}" oninput="aoDigitarItemCompra(this,'${p}')" onblur="nomeCanonicoItem(this)">

    <div class="cp-qtd-cel"><input class="cp-qtd" type="number" min="0.01" step="0.01" placeholder="Qtd" value="${ci.quantidade??''}" oninput="aoEditarValorCompra(this,'qtd','${p}')">
      <div class="cp-atalhos">${[5,15,75].map(n=>`<button type="button" title="Somar ${n} à quantidade" onclick="somarQtdCompra(this,${n})">+${n}</button>`).join('')}</div></div>
    <div class="cp-preco-cel">${celPrecoCompra(p,it&&it.id,it?preco:ci.preco_unitario)}</div>
    <div class="cp-sub-cel">${celSubCompra(p,it&&it.id,!it&&ci.quantidade>0&&ci.preco_unitario>0?arred2(ci.quantidade*ci.preco_unitario):'')}</div>
    <span class="cp-tipo">${tagTipoCompra(it,!it&&!ci.nome)}</span>
    <button class="iconbtn btn-del-linha" title="Remover linha" onclick="this.closest('.cmp-row').remove();recalcCompra('${p}')">✕</button></div>`;
}
function formCompraHTML(p,k){

      <div class="cmp-row cmp-head"><span>Item</span><span>Fornecedor</span><span>Qtd</span><span>Valor unit.</span><span>Subtotal</span><span>Tipo</span><span></span></div>

function addLinhaCompra(p,ci){

/* Ao digitar/escolher o item: se bater com um item do cadastro, a linha vira Automático; senão, Manual. */
function aoDigitarItemCompra(inp,p){
  const r=inp.closest('.cmp-row'),it=itemCompravelPorNome(inp.value),novo=it?it.id:'';
  r.querySelector('.cp-tipo').innerHTML=tagTipoCompra(it,!inp.value.trim());
  if(r.dataset.item===novo)return recalcCompra(p);
  // guarda o que foi digitado na linha Manual, para voltar a mostrar se ela deixar de ser Automático
  const ft=r.querySelector('.cp-forn-txt'),pt=r.querySelector('.cp-preco'),st=r.querySelector('.cp-sub');
  if(ft)r.dataset.fornTxt=ft.value;if(pt)r.dataset.precoTxt=pt.value;if(st)r.dataset.subTxt=st.value;
  const fornTxt=r.dataset.fornTxt||'',precoTxt=r.dataset.precoTxt||'',subTxt=r.dataset.subTxt||'';
  r.dataset.item=novo;
  let forn='',preco='';
  if(it){const v=fornecedoresDoItem(it.id);if(v.length===1){forn=v[0].id;const pr=precoFornItem(forn,it.id);preco=pr!=null?pr:''}}
  r.dataset.preco=preco;
  r.querySelector('.cp-forn-cel').innerHTML=celFornCompra(p,novo,forn,fornTxt);
  r.querySelector('.cp-preco-cel').innerHTML=celPrecoCompra(p,novo,it?preco:precoTxt);
  r.querySelector('.cp-sub-cel').innerHTML=celSubCompra(p,novo,subTxt);
  recalcCompra(p);
}
/* Item do cadastro digitado com outra grafia ("pacote b") fica com o nome do cadastro ao sair do campo */
function nomeCanonicoItem(inp){const r=inp.closest('.cmp-row');const it=r&&r.dataset.item&&db.itens.find(i=>i.id===r.dataset.item);if(it&&inp.value!==it.nome)inp.value=it.nome}
/* Fornecedor escolhido → valor unitário do vínculo fornecedor ↔ item */
function aoTrocarFornCompra(sel,p){
  const r=sel.closest('.cmp-row'),pr=precoFornItem(sel.value,r.dataset.item);
  r.dataset.preco=pr!=null?pr:'';
  r.querySelector('.cp-preco-cel').innerHTML=celPrecoCompra(p,r.dataset.item,r.dataset.preco);
  recalcCompra(p);
}
/* Lê a lista e separa Automático (ins, entra no Baú) de Manual (nc). Linha incompleta é destacada e bloqueia o registro. */
function lerFormCompra(p){
  const erros=[],ins=[],nc=[];
  document.querySelectorAll(`#${p}-linhas [data-cmp]`).forEach((r,n)=>{
    const quantidade=parseFloat(r.querySelector('.cp-qtd').value);
    const nomeDig=r.querySelector('.cp-item').value.trim();
    let falta,linha;
    if(r.dataset.item){
      const it=db.itens.find(i=>i.id===r.dataset.item),f=db.fornecedores.find(x=>x.id===(r.querySelector('.cp-forn')||{}).value);
      const preco_unitario=parseFloat(r.dataset.preco);
      falta=[!f&&'fornecedor',!(quantidade>0)&&'quantidade',f&&!(preco_unitario>0)&&'valor do fornecedor para este item'].filter(Boolean);
      linha={item_id:it.id,nome:it.nome,quantidade,preco_unitario:preco_unitario||0,fornecedor_id:f?f.id:null,fornecedor_nome:f?f.nome:'',_it:it};
      ins.push(linha);
    }else{
      const fn=(r.querySelector('.cp-forn-txt')||{}).value.trim();
      let preco_unitario=parseFloat((r.querySelector('.cp-preco')||{}).value);
      const subDig=parseFloat((r.querySelector('.cp-sub')||{}).value);
      if(!(preco_unitario>0)&&subDig>0&&quantidade>0)preco_unitario=arred2(subDig/quantidade);
      falta=[!nomeDig&&'item',!fn&&'fornecedor',!(quantidade>0)&&'quantidade',!(preco_unitario>0)&&'valor unitário ou subtotal'].filter(Boolean);
      const f=db.fornecedores.find(x=>sselNorm(x.nome)===sselNorm(fn));
      linha={item_id:null,nome:nomeDig,quantidade,preco_unitario,fornecedor_id:f?f.id:null,fornecedor_nome:f?f.nome:fn};
      nc.push(linha);
    }
    r.classList.toggle('linha-erro',falta.length>0);
    if(falta.length)erros.push(`Linha ${n+1}${linha.nome?' ("'+linha.nome+'")':''}: falta ${falta.join(', ')}.`);
  });
  const sub=l=>(l.quantidade>0&&l.preco_unitario>0)?l.quantidade*l.preco_unitario:0;
  // totBau: itens que entram no Baú; totFin: só financeiro (Manual + itens do cadastro sem controle de estoque)
  const noBau=l=>l._it&&controlaEstoque(l._it.categoria);
  const totBau=ins.filter(noBau).reduce((s,l)=>s+sub(l),0),totFin=ins.filter(l=>!noBau(l)).reduce((s,l)=>s+sub(l),0)+nc.reduce((s,l)=>s+sub(l),0);
  return{ins,nc,erros,totBau,totFin,total:totBau+totFin};
}
function recalcCompra(p){
  const box=document.getElementById(p+'-total');if(!box)return;
  document.querySelectorAll(`#${p}-linhas .cmp-row`).forEach(r=>{
    if(!r.dataset.item)return; // Manual: subtotal é digitável (calculado em aoEditarValorCompra)
    const q=parseFloat(r.querySelector('.cp-qtd').value),pu=parseFloat(r.dataset.preco);
    const b=r.querySelector('.cp-sub-fixo b');if(b)b.textContent=(q>0&&pu>0)?fmt(q*pu):'—';
  });
  const f=lerFormCompraSilencioso(p);
  box.innerHTML=`<span title="Itens do cadastro com controle de estoque">Entra no Baú: <b>${fmt(f.totBau)}</b></span><span class="op">+</span><span title="Itens Manuais e itens do cadastro sem controle de estoque">Só financeiro: <b>${fmt(f.totFin)}</b></span><span class="op">=</span><span class="tot">Total: <b>${fmt(f.total)}</b></span>${p==='c'?'<button class="btn btn-primary" onclick="salvarCompra()">Registrar compra</button>':''}`;
}
/* Mesmo cálculo sem marcar erros (usado enquanto o usuário digita) */
function lerFormCompraSilencioso(p){
  const marcadas=[...document.querySelectorAll(`#${p}-linhas .cmp-row`)].map(r=>[r,r.classList.contains('linha-erro')]);
  const f=lerFormCompra(p);marcadas.forEach(([r,m])=>r.classList.toggle('linha-erro',m));return f;
}
/* Cabeçalho da compra: 1 fornecedor → ele; vários → nomes unidos por " + " */
function fornecedorCabecalho(linhas){
  const d=[...new Map(linhas.filter(l=>l.fornecedor_nome).map(l=>[l.fornecedor_nome.toLowerCase(),l])).values()];
  if(d.length===1)return{fornecedor_id:d[0].fornecedor_id,fornecedor_nome:d[0].fornecedor_nome};
  if(d.length>1)return{fornecedor_id:null,fornecedor_nome:d.map(l=>l.fornecedor_nome).join(' + ')};
  return{fornecedor_id:null,fornecedor_nome:'Fornecedor avulso'};
}
function validarFormCompra(p){
  const f=lerFormCompra(p),e=document.getElementById(p+'-err');
  e.style.display='none';
  if(!f.ins.length&&!f.nc.length){e.textContent='Adicione pelo menos um item na compra.';e.style.display='block';return null}
  if(f.erros.length){
    e.innerHTML=f.erros.map(esc).join('<br>')+(f.ins.some(l=>!l.fornecedor_id)?`<br><span style="color:var(--muted)">${pode('fornecedores')?'Item sem fornecedor vinculado? Abra a lista do fornecedor e use "+ Vincular fornecedor" (informe o valor do item nesse fornecedor).':'Itens do cadastro só aceitam fornecedores vinculados a eles — peça a um Gerente para vincular o fornecedor e o valor.'}</span>`:'');
    e.style.display='block';
    const r=document.querySelector(`#${p}-linhas .linha-erro`);if(r)r.scrollIntoView({block:'center',behavior:'smooth'});
    return null;
  }
  return f;
}
/* Atalho na lista do fornecedor: vincular um fornecedor existente ao item ou cadastrar um novo (com o valor do item) */
/* Rodapé da lista de fornecedores de um item da compra (Gerente+):
   • fornecedores já cadastrados e ainda não vinculados ao item → escolher um abre só o valor do item nesse fornecedor;
   • "+ Cadastrar novo fornecedor" → cadastro completo na 2ª camada. */
function fornSselExtra(sel,q){
  if(!pode('fornecedores'))return `<div class="ssel-vazio">${q?'Fornecedor não vinculado a este item. ':''}Peça a um Gerente para vincular fornecedores e valores a este item.</div>`;
  const itemId=sel.closest('.cmp-row').dataset.item,t=sselNorm(q||'');
  const vinc=new Set(db.fornecedor_itens.filter(x=>x.item_id===itemId).map(x=>x.fornecedor_id));
  const livres=db.fornecedores.filter(f=>f.status==='ativo'&&!vinc.has(f.id)&&(!t||sselNorm(f.nome).includes(t))).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  const existe=q&&db.fornecedores.find(f=>sselNorm(f.nome)===sselNorm(q));
  return (livres.length?`<div class="ssel-grp">Vincular fornecedor já cadastrado</div><div class="ssel-vinc">${livres.map(f=>`<button type="button" class="ssel-op ssel-vinc-op" onclick="vincularFornecedorExistente('${f.id}')">🔗 ${esc(f.nome)}</button>`).join('')}</div>`:'')
    +(existe?'':`<button type="button" class="ssel-add" onclick="cadastrarFornecedorAtalho(${esc(JSON.stringify(q))})">+ Cadastrar novo fornecedor${q?' “'+esc(q)+'”':''}</button>`);
}
/* Vincula um fornecedor existente ao item da linha: pede só o valor do item nesse fornecedor */
let _vincPend=null;
function vincularFornecedorExistente(fid){
  const sel=_sselAberto;sselFechar();if(!sel||!pode('fornecedores'))return;
  const linha=sel.closest('.cmp-row'),itemId=linha.dataset.item,f=db.fornecedores.find(x=>x.id===fid),it=db.itens.find(x=>x.id===itemId);
  if(!f||!it)return;
  _vincPend={linha,itemId,fid};
  openModal2(`<h3>Vincular fornecedor</h3>
    <p class="muted" style="font-size:13px;margin:-6px 0 14px">“${esc(f.nome)}” passa a fornecer “${esc(it.nome)}”. O valor fica gravado no cadastro do fornecedor (Configurações › Fornecedores).</p>
    <div class="field" style="max-width:220px"><label>Valor unitário de ${esc(it.nome)}</label><input id="vinc-preco" type="number" min="0.01" step="0.01" placeholder="$ 0,00" onkeydown="if(event.key==='Enter')salvarVinculoFornecedor()"></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="_vincPend=null;closeModal2()">Cancelar</button><button class="btn btn-primary" id="btn-vinc" onclick="salvarVinculoFornecedor()">Vincular e escolher</button></div>`);
  setTimeout(()=>{const i=document.getElementById('vinc-preco');if(i)i.focus()},50);
}
async function salvarVinculoFornecedor(){
  const v=_vincPend;if(!v)return;
  const preco=parseFloat(document.getElementById('vinc-preco').value);
  if(!(preco>0))return toast('⚠️ Informe o valor do item neste fornecedor.');
  const btn=document.getElementById('btn-vinc');btn.disabled=true;
  const{data,error}=await sb.from('fornecedor_itens').insert({fornecedor_id:v.fid,item_id:v.itemId,preco_unitario:preco}).select().single();
  btn.disabled=false;
  if(error)return toast('⚠️ Não foi possível vincular: '+error.message);
  db.fornecedor_itens.push({...(data||{fornecedor_id:v.fid,item_id:v.itemId}),preco_unitario:preco});
  _vincPend=null;closeModal2();
  const p=v.linha.parentElement.id.replace(/-linhas$/,''),f=db.fornecedores.find(x=>x.id===v.fid),it=db.itens.find(x=>x.id===v.itemId);
  document.querySelectorAll(`#${p}-linhas [data-cmp]`).forEach(r=>{     // atualiza todas as linhas do mesmo item
    if(r.dataset.item!==v.itemId)return;
    const fs=r.querySelector('.cp-forn'),val=r===v.linha?v.fid:fs.value;
    fs.innerHTML=fornOptionsHTML(v.itemId,val);fs.value=val;aoTrocarFornCompra(fs,p);
  });
  v.linha.classList.remove('linha-erro');recalcCompra(p);
  reg('Fornecedor vinculado a item',`${f?f.nome:''} — ${it?it.nome:''} — ${fmt(preco)}`);
  toast('✅ "'+(f?f.nome:'')+'" vinculado e escolhido.');
}
function cadastrarFornecedorAtalho(nome){
  const sel=_sselAberto;sselFechar();if(!sel)return;
  const linha=sel.closest('.cmp-row'),itemId=linha.dataset.item;
  const p=linha.parentElement.id.replace(/-linhas$/,'');
  const existe=nome&&db.fornecedores.find(f=>sselNorm(f.nome)===sselNorm(nome));
  modalFornecedor(existe?existe.id:null,{nome,itemId,onSaved:f=>{
    if(!f)return;
    document.querySelectorAll(`#${p}-linhas [data-cmp]`).forEach(r=>{
      if(r.dataset.item!==itemId)return;
      const fs=r.querySelector('.cp-forn'),v=r===linha?f.id:fs.value;
      fs.innerHTML=fornOptionsHTML(itemId,v);fs.value=v;aoTrocarFornCompra(fs,p);
    });
    linha.classList.remove('linha-erro');recalcCompra(p);toast('✅ Fornecedor "'+f.nome+'" vinculado e selecionado.');
  }});
}
/* Resumo minimalista antes de registrar */
function resumoCompraHTML(f,extra){
  const bau=f.ins.filter(x=>x._it&&controlaEstoque(x._it.categoria)),fin=[...f.ins.filter(x=>!bau.includes(x)),...f.nc];
  const l=x=>`<div class="rs-l"><span>${x.quantidade}× ${esc(x.nome)} <span class="muted">· ${esc(x.fornecedor_nome)}</span></span><b>${fmt(x.quantidade*x.preco_unitario)}</b></div>`;
  return`<div class="resumo">
    ${bau.length?`<div class="rs-sec">Entram no Baú</div>${bau.map(l).join('')}`:''}
    ${fin.length?`<div class="rs-sec">Só financeiro (não entram no Baú)</div>${fin.map(l).join('')}`:''}
    <div class="rs-tot"><span>Total</span><b>${fmt(f.total)}</b></div>
    ${extra||''}</div>`;
}
let _compraPendente=null;
function salvarCompra(){
  const data=document.getElementById('c-data').value;
  const e=document.getElementById('c-err');
  if(!data){e.textContent='Informe a data da compra.';e.style.display='block';return}
  const f=validarFormCompra('c');if(!f)return;
  const cab=fornecedorCabecalho([...f.ins,...f.nc]);
  if(db.compras.some(x=>x.status==='ativa'&&x.fornecedor_nome===cab.fornecedor_nome&&(x.data_local||diaBR(x.data))===data&&Math.abs(x.valor_total-f.total)<0.005)){
    e.textContent='Compra duplicada (mesmo fornecedor, data e valor) — verifique antes de registrar.';e.style.display='block';return;
  }
  const desc=document.getElementById('c-desc').value.trim();
  _compraPendente={f,cab,data,desc};
  openModal2(`<h3>Confirmar compra</h3>
    ${resumoCompraHTML(f,`<div class="rs-meta">${dataBR(data)}${desc?' · '+esc(desc):''}</div>`)}
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal2()">Voltar</button>
    <button class="btn btn-primary" id="btn-conf-compra" onclick="efetivarCompra()">Confirmar compra</button></div>`);
}
async function efetivarCompra(){
  const pend=_compraPendente;if(!pend)return;
  const btn=document.getElementById('btn-conf-compra');if(btn){btn.disabled=true;btn.textContent='Registrando…'}
  const{f,cab,data,desc}=pend;
  const fail=m=>{closeModal2();const e=document.getElementById('c-err');e.textContent=m;e.style.display='block'};
  let operacaoId;try{operacaoId=await nextOpId()}catch(err){return fail('Erro ao gerar ID da operação: '+(err.message||err))}
  const cabecalho={operacao_id:operacaoId,fornecedor_id:cab.fornecedor_id,fornecedor_nome:cab.fornecedor_nome,
    data:instanteBR(data,horaBR(new Date())).toISOString(),data_local:data,
    valor_total:f.total,descricao:desc,usuario_id:sessionUser().id,usuario_nome:sessionUser().nome,status:'ativa'};
  const{data:kRow,error:e1}=await sb.from('compras').insert(cabecalho).select().single();
  if(e1)return fail('Erro ao registrar compra: '+e1.message);
  const linhas=[...f.ins,...f.nc].map(({_it,...l})=>({...l,compra_id:kRow.id}));
  const{data:itd,error:e2}=await sb.from('compra_itens').insert(linhas).select();
  if(e2){await sb.from('compras').delete().eq('id',kRow.id);return fail('Erro ao registrar itens: '+e2.message)}
  const saldos={};
  const movimentos=f.ins.filter(l=>l._it&&controlaEstoque(l._it.categoria)).map(l=>{
    const ant=saldos[l.item_id]??saldoItem(l.item_id);saldos[l.item_id]=ant+l.quantidade;
    return{item_id:l.item_id,tipo_movimento:'entrada_compra',operacao_id:operacaoId,quantidade:l.quantidade,usuario_id:sessionUser().id,usuario_nome:sessionUser().nome,origem:'compra: '+l.fornecedor_nome,saldo_resultante:ant+l.quantidade};
  });
  if(movimentos.length){
    const{data:bd,error:e3}=await sb.from('estoque_bau').insert(movimentos).select();
    if(e3)toast('⚠️ Compra salva, mas houve erro ao lançar no Baú: '+e3.message);
    else bd.forEach(d=>db.estoque_bau.unshift({...d,quantidade:Number(d.quantidade),saldo_resultante:Number(d.saldo_resultante)}));
  }
  const k={...kRow,itens:(itd||[]).map(i=>({item_id:i.item_id,nome:i.nome,quantidade:Number(i.quantidade),preco_unitario:Number(i.preco_unitario),fornecedor_id:i.fornecedor_id,fornecedor_nome:i.fornecedor_nome})),valor_total:Number(kRow.valor_total)};
  db.compras.unshift(k);
  reg('Compra registrada',`${k.fornecedor_nome} — ${fmt(f.total)}${movimentos.length?` (${movimentos.length} insumo(s) entraram no Baú)`:''}`);
  _compraPendente=null;closeModal2();bauTela=null;
  toast('✅ Compra registrada!'+(movimentos.length?' Entrada de insumos no Baú.':''));
  if(_voltarProducao)voltarProducao();else render();
}

/* ---- Tela Produzir: uma linha de produção por variedade (opção B) ----
   Cada linha é montada a partir das receitas: a receita final é a que não alimenta nenhuma outra; a etapa anterior é
   a receita que produz o insumo dela (ex.: Pacote → 🌿 Dichavar → Dichavada → 🚬 Enrolar → vende no Caixa).
   O botão de cada etapa usa a categoria da receita (Configurações › Receitas) e abre a janela de quantidade. */
let prodSel=null,prodQtd=1;
const PROD_LIMITE=9999;
function prodConsumos(r){return (r.insumos||[]).filter(x=>x.papel==='consumo').map(ri=>({ri,it:db.itens.find(i=>i.id===ri.item_id)})).filter(x=>x.it&&controlaEstoque(x.it.categoria)&&x.ri.quantidade>0)}
function prodMaxDireto(r,saldo){
  const cons=prodConsumos(r);
  if(!cons.length)return {max:PROD_LIMITE,limite:null};
  let max=Infinity,limite=null;
  cons.forEach(x=>{const m=Math.floor((saldo[x.it.id]||0)/x.ri.quantidade+1e-9);if(m<max){max=m;limite=x.it}});
  return {max:Math.max(0,Math.min(max,PROD_LIMITE)),limite};
}
function prodMaxCascata(r,saldo,direto){
  // maior quantidade possível com cascata: dobra até falhar e depois busca binária
  const ok=q=>planejarCascata(r.id,q,saldo).possivel;
  if(direto>=PROD_LIMITE||!ok(direto+1))return direto;
  let lo=direto+1,hi=null;
  while(hi===null){const n=Math.min(lo*2,PROD_LIMITE);if(n===lo)return lo;if(ok(n))lo=n;else hi=n}
  while(hi-lo>1){const m=Math.floor((lo+hi)/2);if(ok(m))lo=m;else hi=m}
  return lo;
}
function prodInfo(r,saldo){const d=prodMaxDireto(r,saldo);return {...d,cascata:prodMaxCascata(r,saldo,d.max)}}
function prodSetQtd(v){const n=parseInt(v);prodQtd=Number.isInteger(n)&&n>=1?Math.min(n,PROD_LIMITE):1;prodAtualizarJanela()}
function prodAbrir(rid){
  prodSel=rid;prodQtd=1;
  openModal('<div class="prod-painel" id="prod-painel"></div>');
  document.getElementById('modal-box').classList.add('modal-prod');
  prodAtualizarJanela();
}
function prodAtualizarJanela(){
  const el=document.getElementById('prod-painel');if(!el)return;
  const r=db.receitas.find(x=>x.id===prodSel);if(!r)return closeModal();
  const saldo=saldosBau();
  el.innerHTML=prodPainelHTML(r,prodInfo(r,saldo),saldo);
}
function prodSaidasEstoque(r){return (r.insumos||[]).filter(x=>x.papel==='produzido'&&x.quantidade>0).map(x=>({ri:x,it:db.itens.find(i=>i.id===x.item_id)})).filter(x=>x.it&&controlaEstoque(x.it.categoria))}
/* Uma linha por receita 🏁 (produto final): volta pelas receitas que produzem cada insumo (receitaProdutora), sem
   limite de etapas. Foto e nome vêm do produto do Catálogo ligado ao item que a receita 🏁 produz.
   Receitas que não levam a nenhuma 🏁 aparecem sozinhas, como linhas de uma etapa. */
function prodCadeias(){
  const recs=[...db.receitas].filter(r=>r.status==='ativo').sort((a,b)=>(a.ordem||99)-(b.ordem||99));
  const cadeias=recs.filter(r=>r.produto_final).map(r=>{
    const passos=[r];
    for(let n=0;n<20;n++){
      let ant=null;
      for(const x of (passos[0].insumos||[]).filter(x=>x.papel==='consumo')){ant=receitaProdutora(x.item_id,passos.map(p=>p.id));if(ant)break}
      if(!ant)break;passos.unshift(ant);
    }
    return {passos};
  });
  const usadas=new Set(cadeias.flatMap(c=>c.passos.map(p=>p.id)));
  recs.filter(r=>!usadas.has(r.id)).forEach(r=>cadeias.push({passos:[r]}));
  cadeias.forEach(c=>{
    const ult=c.passos[c.passos.length-1];
    const pf=ult.produto_final?(ult.insumos||[]).map(x=>x.papel==='produzido'&&db.itens.find(i=>i.id===x.item_id)).find(ehProdutoFinal):null;
    c.itemFinal=pf||null;
    c.produto=pf&&pf.produto_id?db.produtos.find(p=>p.id===pf.produto_id)||null:null;
    c.titulo=c.produto?c.produto.nome:pf?pf.nome:ult.nome;
  });
  cadeias.sort((a,b)=>(a.produto?a.produto.ordem??999:1e4)-(b.produto?b.produto.ordem??999:1e4)||a.titulo.localeCompare(b.titulo,'pt-BR'));
  return {cadeias};
}

/* Compra sugerida para o que falta: para cada item, o fornecedor vinculado mais barato (fornecedor_itens.preco_unitario) */
function prodCompraSugerida(faltas){
  return faltas.map(f=>{
    const opc=fornecedoresDoItem(f.it.id).map(fo=>({fo,preco:precoFornItem(fo.id,f.it.id)})).filter(x=>x.preco>0).sort((a,b)=>a.preco-b.preco||a.fo.nome.localeCompare(b.fo.nome,'pt-BR'));
    return {it:f.it,qtd:Math.ceil(f.falta*100-1e-6)/100,melhor:opc[0]||null,opcoes:opc.length};
  });
}
/* "Comprar o que falta": abre a Nova compra já preenchida; depois de registrar, volta para a janela de produção */

/* ================= HISTÓRICO FINANCEIRO ================= */
const regConsulta={financeiro:{page:1,size:10,filtros:{}},bau:{page:1,size:10,filtros:{}}};
function ordenarLista(arr,key,dir){return arr.sort((a,b)=>{let x=a[key],y=b[key];if(x==null)x='';if(y==null)y='';if(key==='data')return (new Date(x).getTime()-new Date(y).getTime())*(dir==='asc'?1:-1);if(typeof x==='string'&&typeof y==='string')return (x.localeCompare(y,'pt-BR',{numeric:true})||0)*(dir==='asc'?1:-1);return ((Number(x)||0)-(Number(y)||0))*(dir==='asc'?1:-1)})}
function pagina(arr,tipo){const q=regConsulta[tipo];const total=arr.length;const ini=(q.page-1)*q.size;const fim=Math.min(total,ini+q.size);return {rows:arr.slice(ini,fim),total,ini,fim,pages:Math.max(1,Math.ceil(total/q.size))}}
function paginacao(tipo,p){const q=regConsulta[tipo];return `<div style="display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:10px;color:var(--muted);font-size:12px"><span>${p.total?`${p.ini+1}–${p.fim} de ${p.total}`:'0 registros'}</span><select style="width:auto;padding:5px" onchange="regConsulta.${tipo}.size=+this.value;regConsulta.${tipo}.page=1;render()"><option ${q.size===10?'selected':''}>10</option><option ${q.size===20?'selected':''}>20</option><option ${q.size===50?'selected':''}>50</option></select><button class="btn btn-ghost btn-sm" ${q.page<=1?'disabled':''} onclick="regConsulta.${tipo}.page--;render()">Anterior</button><span>p. ${q.page}/${p.pages}</span><button class="btn btn-ghost btn-sm" ${q.page>=p.pages?'disabled':''} onclick="regConsulta.${tipo}.page++;render()">Próxima</button></div>`}

/* ---- Lançamento com sublinhas (venda→auxiliares, compra→itens, produção/compra no Baú→movimentos) ---- */
const expandidos=new Set();
function alternarExpandir(ch){expandidos.has(ch)?expandidos.delete(ch):expandidos.add(ch);render()}
function tdExpandir(ch,n){return `<td class="td-exp">${n?`<button class="btn-exp ${expandidos.has(ch)?'aberto':''}" title="${expandidos.has(ch)?'Recolher':'Mostrar'} ${n} linha(s)" onclick="alternarExpandir('${esc(ch)}')">▸<small>${n}</small></button>`:''}</td>`}
/* Agrupa linhas filtradas: o pai aparece se ele ou algum filho passou no filtro; sem o pai no filtro, mostra só os filhos que passaram */
function agruparLinhas(todas,filtradas,chavePai){
  const ok=new Set(filtradas),filhosDe={};
  todas.filter(r=>chavePai(r)).forEach(r=>(filhosDe[chavePai(r)]=filhosDe[chavePai(r)]||[]).push(r));
  return todas.filter(r=>!chavePai(r)).map(p=>{const fs=filhosDe[p.id]||[];return{p,todos:fs,filhos:ok.has(p)?fs:fs.filter(f=>ok.has(f)),passa:ok.has(p)||fs.some(f=>ok.has(f))}}).filter(g=>g.passa);
}
/* Repasse da venda dividido: cada auxiliar recebe o valor gravado na venda (vendas antigas sem valor: % × repasse); o principal fica com o restante */
function repasseDaVenda(v){
  const cota=Number(v.cota_funcionario)||0;
  const aux=(v.auxiliares||[]).filter(a=>a&&(a.nome||a.usuario_id)).map(a=>({...a,valor:a.valor!=null&&a.valor!==''?Number(a.valor)||0:Math.round(cota*(parseFloat(a.pct)||0))/100}));
  return{aux,principal:Math.round((cota-aux.reduce((s,a)=>s+a.valor,0))*100)/100};
}
/* Venda no Histórico: a data é a do dinheiro guardado no caixa (vendas antigas, sem lote: a data da venda) */
function descricaoVendaFin(v){
  if(v.status==='pendente')return v.cancelamento_status==='pedido'?'Cancelamento pedido: '+(v.cancelamento_motivo||'—'):'Aguardando guardar no caixa';
  if(v.status==='revertida'&&v.cancelamento_status==='aprovado')return 'Cancelada a pedido de '+(v.cancelamento_pedido_por_nome||'—')+': '+(v.cancelamento_motivo||'—');
  if(v.guardada_em){const d=(db.depositos||[]).find(x=>x.id===v.deposito_id);return 'Venda de '+dataHoraBR(v.data)+' · guardada no caixa'+(d?' no lote '+(d.operacao_id||'—')+' por '+(d.usuario_nome||'—'):'')}
  return '—';
}
function linhasFinanceiro(){
 const rows=[];
 db.vendas.filter(v=>v.status!=='excluida').forEach(v=>{const rp=repasseDaVenda(v),dataCaixa=v.guardada_em||v.data;rows.push({id:'venda:'+v.id,tipo:'venda',operacao_id:v.operacao_id||'',data:dataCaixa,usuario_nome:v.usuario_nome||'',tipo_label:'Venda',itens:(v.itens||[]).map(i=>i.qtd+'× '+i.nome).join(', '),desconto:v.parceria_nome||'—',deslocamento:(v.taxa_nome&&v.taxa_valor>0)?v.taxa_nome+' ('+fmt(v.taxa_valor)+')':'—',descricao:descricaoVendaFin(v),entrada:v.receita_loja||0,repasse:rp.principal,valor:v.total||0,status:v.status,v});
  rp.aux.forEach((a,k)=>rows.push({id:'aux:'+v.id+':'+k,pai:'venda:'+v.id,tipo:'auxiliar',operacao_id:v.operacao_id||'',data:dataCaixa,usuario_nome:a.nome||'?',tipo_label:'Auxiliar',itens:'—',desconto:'—',deslocamento:'—',descricao:'Referente ao auxílio na venda de '+(v.usuario_nome||'—'),entrada:null,repasse:a.valor,valor:null,status:v.status,v}))});
 db.compras.filter(k=>k.status!=='excluida').forEach(k=>{rows.push({id:'compra:'+k.id,tipo:'compra',operacao_id:k.operacao_id||'',data:k.data,usuario_nome:k.usuario_nome||'',tipo_label:'Compra',itens:(k.itens||[]).map(i=>{const it=db.itens.find(x=>x.id===i.item_id);const nome=i.nome&&i.nome!=='?'?i.nome:(it?it.nome:'?');const q=i.qtd??i.quantidade;return (q??'?')+'× '+nome+(i.fornecedor_nome&&i.fornecedor_nome!==k.fornecedor_nome?' ('+i.fornecedor_nome+')':'')}).join(', ')||'—',desconto:'—',deslocamento:'—',descricao:k.descricao||'—',entrada:-(k.valor_total||0),repasse:0,valor:null,status:k.status,k});
  if((k.itens||[]).length>1)(k.itens||[]).forEach((i,n)=>{const it=db.itens.find(x=>x.id===i.item_id);const q=Number(i.qtd??i.quantidade)||0;rows.push({id:'citem:'+k.id+':'+n,pai:'compra:'+k.id,tipo:'compra_item',operacao_id:k.operacao_id||'',data:k.data,usuario_nome:i.fornecedor_nome||k.fornecedor_nome||'',tipo_label:i.item_id?'Insumo':'Não controlado',itens:q+'× '+(i.nome&&i.nome!=='?'?i.nome:(it?it.nome:'?')),desconto:'—',deslocamento:'—',descricao:(i.item_id?'Entrada no Baú':'Sem entrada no Baú')+' · '+fmt(Number(i.preco_unitario)||0)+'/un',entrada:-(q*(Number(i.preco_unitario)||0)),repasse:null,valor:null,status:k.status,k})})});
 (db.ajustes_caixa||[]).forEach(a=>rows.push({id:'ajuste:'+a.id,tipo:'ajuste',operacao_id:'',data:a.data,usuario_nome:a.usuario_nome||'',tipo_label:'Ajuste ('+(a.tipo==='entrada'?'+':'−')+')',itens:'—',desconto:'—',deslocamento:'—',descricao:a.motivo||'—',entrada:a.tipo==='entrada'?a.valor:-a.valor,repasse:0,valor:null,status:a.status||'ativa',a}));
 return rows;
}
function caixaAtualValor(){return db.vendas.filter(v=>v.status==='ativa').reduce((s,v)=>s+(v.receita_loja||0),0)-db.compras.filter(k=>k.status==='ativa').reduce((s,k)=>s+(k.valor_total||0),0)+(db.ajustes_caixa||[]).filter(a=>(a.status||'ativa')==='ativa').reduce((s,a)=>s+(a.tipo==='entrada'?a.valor:-a.valor),0)}
function acoesFin(r){
  const ajuste=r.tipo==='ajuste',id=ajuste?r.a.id:(r.tipo==='venda'?r.v.id:r.k.id);
  if(r.status==='ativa'||r.status==='pendente')return !pode(FIN_PERM[r.tipo])?'':`<button class="iconbtn" title="Editar" onclick="${ajuste?`modalAjusteCaixa('${r.a.tipo}','${id}')`:r.tipo==='venda'?`editVendaFin('${id}')`:`editCompraFin('${id}')`}">✏️</button><button class="iconbtn" title="Reverter" onclick="reverterFin('${r.tipo}','${r.id}')">↩️</button>`;
  return pode('excluir_lancamentos')?`<button class="iconbtn" title="Apagar linha" onclick="apagarFin('${r.tipo}','${r.id}')">🗑️</button>`:'';
}

 const saidas=ativas.filter(r=>r.tipo==='compra'||(r.tipo==='ajuste'&&r.a.tipo!=='entrada')).reduce((s,r)=>s+(-r.entrada),0);

/* Ajuste manual de caixa (Gerente+): entrada/saída direta, sem venda ou compra por trás */
function modalAjusteCaixa(tipo,id){
  if(!pode('caixa_ajustes'))return toast('⚠️ Seu perfil não ajusta o caixa.');
  const a=id?db.ajustes_caixa.find(x=>x.id===id):null;
  const caixaAtual=caixaAtualValor();
  openModal(`<h3>${a?'✏️ Editar ajuste de caixa':tipo==='entrada'?'➕ Entrada avulsa — Caixa':'➖ Saída avulsa — Caixa'}</h3>
  <p style="color:var(--muted);margin-bottom:14px">Saldo atual: <b style="color:var(--green)">${fmt(caixaAtual)}</b></p>
  ${a?`<div class="field"><label>Tipo</label><select id="ac-tipo"><option value="entrada" ${a.tipo==='entrada'?'selected':''}>Entrada (+)</option><option value="saida" ${a.tipo==='saida'?'selected':''}>Saída (−)</option></select></div>`:''}
  <div class="field"><label>Valor ($)</label><input id="ac-valor" type="number" min="0.01" step="0.01" value="${a?a.valor:''}"></div>
  <div class="field"><label>Motivo / observação (opcional)</label><input id="ac-motivo" placeholder="ex.: acerto de caixa, correção, retirada" value="${a?esc(a.motivo||''):''}"></div>
  <p id="ac-err" style="color:var(--danger);font-size:13px;display:none"></p>
  <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
  <button class="btn btn-primary" onclick="salvarAjusteCaixa('${tipo}','${id||''}')">${a?'Salvar':'Confirmar'}</button></div>`);
}
async function salvarAjusteCaixa(tipo,id){
  if(!pode('caixa_ajustes'))return toast('⚠️ Seu perfil não ajusta o caixa.');
  const valor=parseFloat(document.getElementById('ac-valor').value);
  const motivo=document.getElementById('ac-motivo').value.trim();
  const e=document.getElementById('ac-err');
  if(!(valor>0)){e.textContent='Informe um valor maior que zero.';e.style.display='block';return}
  if(id){
    const a=db.ajustes_caixa.find(x=>x.id===id);if(!a)return;
    const novoTipo=document.getElementById('ac-tipo').value;
    const{error}=await sb.from('ajustes_caixa').update({tipo:novoTipo,valor,motivo}).eq('id',id);
    if(error){e.textContent='Erro ao salvar: '+error.message;e.style.display='block';return}
    Object.assign(a,{tipo:novoTipo,valor,motivo});
    reg('Ajuste de caixa editado',(novoTipo==='entrada'?'+':'−')+fmt(valor)+(motivo?' — '+motivo:''));
    closeModal();toast('✅ Ajuste atualizado.');render();return;
  }
  const registro={tipo,valor,motivo,usuario_id:sessionUser().id,usuario_nome:sessionUser().nome};
  const{data,error}=await sb.from('ajustes_caixa').insert(registro).select().single();
  if(error){e.textContent='Erro ao salvar: '+error.message;e.style.display='block';return}
  db.ajustes_caixa.unshift({...data,valor:Number(data.valor)});
  reg(tipo==='entrada'?'Ajuste de caixa (+)':'Ajuste de caixa (−)',fmt(valor)+(motivo?' — '+motivo:''));
  closeModal();toast('✅ Caixa ajustado.');render();
}
function excluirAjusteCaixa(id){
  if(!pode('excluir_lancamentos'))return toast('⚠️ Seu perfil não pode excluir lançamentos.');
  const a=db.ajustes_caixa.find(x=>x.id===id);if(!a)return;
  if((a.status||'ativa')!=='revertida')return toast('⚠️ Reverta o ajuste antes de excluir.');
  confirmar('Excluir ajuste de caixa','O lançamento será removido definitivamente do caixa. Confirmar?',async()=>{
    const{error}=await sb.from('ajustes_caixa').delete().eq('id',id);
    if(error)return toast('⚠️ Erro ao excluir: '+error.message);
    db.ajustes_caixa=db.ajustes_caixa.filter(x=>x.id!==id);
    reg('Ajuste de caixa excluído',fmt(a.valor));
    render();toast('✅ Ajuste excluído.');
  });
}
/* Reverter: só muda o status. Vale para venda, compra e ajuste de caixa. Venda guardada que tirou produto final do Baú
   (categoria com controle de estoque) devolve o produto: quem faz isso é o banco (trigger trg_vendas_bau). */
/* permissão que edita e reverte cada tipo de lançamento */
const FIN_PERM={venda:'vendas_equipe',compra:'bau_gerir',ajuste:'caixa_ajustes'};
const FIN_TABELA={venda:'vendas',compra:'compras',ajuste:'ajustes_caixa'},FIN_LISTA={venda:'vendas',compra:'compras',ajuste:'ajustes_caixa'},FIN_NOME={venda:'Venda',compra:'Compra',ajuste:'Ajuste de caixa'};
function reverterFin(tipo,id){
 if(!pode(FIN_PERM[tipo]))return toast('⚠️ Seu perfil não pode reverter este lançamento.');
 const realId=id.slice(id.indexOf(':')+1);
 confirmar('Reverter lançamento','O registro será marcado como revertido e sairá dos totais'+(tipo==='ajuste'?' e do caixa':'')+'. Confirmar?',async()=>{
  const{error}=await sb.from(FIN_TABELA[tipo]).update({status:'revertida'}).eq('id',realId);
  if(error)return toast('⚠️ Erro ao reverter: '+error.message);
  const o=db[FIN_LISTA[tipo]].find(x=>x.id===realId);
  if(o){o.status='revertida';reg(FIN_NOME[tipo]+' revertida',fmt(o.total??o.valor_total??o.valor))}
  render();if(tipo==='venda')agendarSincronizacao();
 });
}
/* Apagar: exclui a linha por completo — só permitido se status = revertida */
function apagarFin(tipo,id){
 if(!pode('excluir_lancamentos'))return toast('⚠️ Seu perfil não pode excluir lançamentos.');
 const realId=id.slice(id.indexOf(':')+1);
 const obj=db[FIN_LISTA[tipo]].find(x=>x.id===realId);
 if(!obj)return;
 if((obj.status||'ativa')!=='revertida')return toast('⚠️ Só é possível apagar linhas com status "revertida".');
 confirmar('Apagar linha','A linha será excluída por completo do histórico. Confirmar?',async()=>{
  const{error}=await sb.from(FIN_TABELA[tipo]).delete().eq('id',realId);
  if(error)return toast('⚠️ Erro ao apagar: '+error.message);
  db[FIN_LISTA[tipo]]=db[FIN_LISTA[tipo]].filter(x=>x.id!==realId);
  selExclusao.financeiro.delete(id);
  reg('Lançamento apagado',tipo+' '+realId);
  render();toast('✅ Linha apagada.');
 });
}
/* Editar venda: itens/quantidades, parceria, deslocamento, entrada e repasse */

 const linhasItens=(v.itens||[]).map(i=>linhaItemVendaEdit(i,prods)).join('');
 openModal(`<h3>Editar venda</h3>
 <div class="section-title" style="color:var(--warning-light)">Itens vendidos</div>
 <div id="ev-itens">${linhasItens}</div>
 <button class="btn btn-ghost btn-sm" onclick="addItemVendaEdit()">+ Adicionar item</button>
 <div class="row2" style="margin-top:14px">
  <div class="field"><label>Parceria (desconto)</label><select id="ev-parceria"><option value="">Nenhuma</option>${db.parcerias.map(p=>`<option value="${p.id}" ${v.parceria_id===p.id?'selected':''}>${esc(p.nome)}</option>`).join('')}</select></div>
  <div class="field"><label>Deslocamento</label><select id="ev-taxa"><option value="">Nenhum</option>${db.taxas_deslocamento.map(t=>`<option value="${t.id}" ${v.taxa_id===t.id?'selected':''}>${esc(t.nome)} (${fmt(t.valor)})</option>`).join('')}</select></div>
 </div>
 <div class="row2">
  <div class="field"><label>Entrada (receita da loja) ($)</label><input id="ev-entrada" type="number" min="0" step="0.01" value="${v.receita_loja}"></div>
  <div class="field"><label>Repasse equipe ($)</label><input id="ev-repasse" type="number" min="0" step="0.01" value="${v.cota_funcionario}"></div>
 </div>
 <p id="ev-err" style="color:var(--danger);font-size:13px;display:none"></p>
 <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
 <button class="btn btn-purple" onclick="salvarEdicaoVendaFin('${id}')">Salvar</button></div>`);

function linhaItemVendaEdit(i,prods){
 const opts=prods.map(p=>`<option value="${p.id}" ${p.nome===i.nome?'selected':''}>${esc(p.nome)}</option>`).join('');
 return`<div class="row3" style="margin-bottom:8px;grid-template-columns:2fr 1fr auto" data-evitem>
  <select class="evi-prod">${opts}</select>
  <input class="evi-qtd" type="number" min="1" step="1" placeholder="Qtd" value="${i.qtd}">
  <button class="iconbtn" onclick="this.closest('[data-evitem]').remove()">✕</button></div>`;
}
function addItemVendaEdit(){
 const prods=db.produtos.filter(p=>p.status==='ativo');
 const d=document.createElement('div');
 d.innerHTML=linhaItemVendaEdit({nome:'',qtd:''},prods);
 document.getElementById('ev-itens').appendChild(d.firstElementChild);
}
async function salvarEdicaoVendaFin(id){
 const v=db.vendas.find(x=>x.id===id);if(!v)return;
 const e=document.getElementById('ev-err');
 const itens=[...document.querySelectorAll('#ev-itens [data-evitem]')].map(d=>{
  const sel=d.querySelector('.evi-prod');const p=db.produtos.find(x=>x.id===sel.value);
  return{produto_id:sel.value,nome:p?p.nome:'?',qtd:parseInt(d.querySelector('.evi-qtd').value)||0,preco_unit:p?p.preco:0,custo_unit:p?p.custo||0:0,rateio:p?p.rateio:'Padrão (Rateio Global)'};
 }).filter(x=>x.qtd>0);
 if(!itens.length){e.textContent='Adicione ao menos um item com quantidade.';e.style.display='block';return}
 const pid=document.getElementById('ev-parceria').value||null;
 const tid=document.getElementById('ev-taxa').value||null;
 const entrada=parseFloat(document.getElementById('ev-entrada').value)||0;
 const repasse=parseFloat(document.getElementById('ev-repasse').value)||0;
 if(entrada+repasse<0){e.textContent='Valores inválidos.';e.style.display='block';return}
 const parceria=db.parcerias.find(x=>x.id===pid)||null;
 const taxa=db.taxas_deslocamento.find(x=>x.id===tid)||null;
 const patch={parceria_id:pid,parceria_nome:parceria?parceria.nome:null,taxa_id:tid,taxa_nome:taxa?taxa.nome:null,taxa_valor:taxa?taxa.valor:0,receita_loja:entrada,cota_funcionario:repasse,custo_total:itens.reduce((t,i)=>t+i.qtd*i.custo_unit,0),
   total:entrada+repasse+itens.filter(i=>i.rateio==='100% Equipe').reduce((t,i)=>t+i.qtd*i.custo_unit,0)};   // custo 100% Equipe: fora do caixa e do repasse
 const{error:e1}=await sb.from('vendas').update(patch).eq('id',id);
 if(e1){e.textContent='Erro ao salvar: '+e1.message;e.style.display='block';return}
 await sb.from('venda_itens').delete().eq('venda_id',id);
 const{data:itd,error:e2}=await sb.from('venda_itens').insert(itens.map(i=>({...i,venda_id:id}))).select();
 if(e2){e.textContent='Erro ao salvar itens: '+e2.message;e.style.display='block';return}
 Object.assign(v,patch);
 v.itens=itd.map(i=>({produto_id:i.produto_id,nome:i.nome,qtd:Number(i.qtd),preco_unit:Number(i.preco_unit),custo_unit:Number(i.custo_unit||0),rateio:i.rateio}));
 reg('Venda editada',itens.length+' item(ns) — entrada '+fmt(entrada)+', repasse '+fmt(repasse));
 closeModal();render();agendarSincronizacao();toast('✅ Venda atualizada.');
}
/* Editar compra: mesmas duas seções da Nova compra. Não refaz as entradas no Baú. */
function editCompraFin(id){
 if(!pode('bau_gerir'))return;
 const k=db.compras.find(x=>x.id===id);if(!k)return;
 // linhas antigas sem fornecedor próprio herdam o do cabeçalho
 const cabF=db.fornecedores.find(f=>f.id===k.fornecedor_id)||db.fornecedores.find(f=>f.nome.toLowerCase()===(k.fornecedor_nome||'').toLowerCase());
 const itens=(k.itens||[]).map(i=>{
   const f=db.fornecedores.find(x=>x.id===i.fornecedor_id)||(i.fornecedor_nome?db.fornecedores.find(x=>x.nome.toLowerCase()===i.fornecedor_nome.toLowerCase()):null)||(i.fornecedor_nome?null:cabF);
   return{...i,fornecedor_id:f?f.id:null,fornecedor_nome:i.fornecedor_nome||(f?f.nome:(k.fornecedor_nome!=='Fornecedor avulso'?k.fornecedor_nome:''))};
 });
 openModal(`<h3>Editar compra</h3>
 ${formCompraHTML('ec',{...k,itens})}
 <div class="field" style="margin-top:14px"><label>Observação</label><input id="ec-desc" value="${esc(k.descricao||'')}"></div>
 <p class="muted" style="font-size:12px">A edição não refaz as entradas no Baú — ajuste o estoque pelo Baú (+ Entrada / − Saída) se mudar insumos ou quantidades.</p>
 <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
 <button class="btn btn-purple" onclick="salvarEdicaoCompraFin('${id}')">Salvar</button></div>`);
 document.getElementById('modal-box').classList.add('modal-larga');
 recalcCompra('ec');
}
async function salvarEdicaoCompraFin(id){
 const k=db.compras.find(x=>x.id===id);if(!k)return;
 const desc=document.getElementById('ec-desc').value.trim();
 const semLinhas=!document.querySelector('#ec-linhas .cmp-row');
 let patch,linhas=null;
 if(semLinhas&&!(k.itens||[]).length){patch={descricao:desc}} // compra antiga só com valor total
 else{
   const f=validarFormCompra('ec');if(!f)return;
   patch={...fornecedorCabecalho([...f.ins,...f.nc]),descricao:desc,valor_total:f.total};
   linhas=[...f.ins,...f.nc].map(({_it,...l})=>({...l,compra_id:id}));
 }
 const e=document.getElementById('ec-err');
 const{error:e1}=await sb.from('compras').update(patch).eq('id',id);
 if(e1){e.textContent='Erro ao salvar: '+e1.message;e.style.display='block';return}
 if(linhas){
  const{error:ed}=await sb.from('compra_itens').delete().eq('compra_id',id);
  if(ed){e.textContent='Erro ao salvar itens: '+ed.message;e.style.display='block';return}
  const{data,error:e2}=await sb.from('compra_itens').insert(linhas).select();
  if(e2){e.textContent='Erro ao salvar itens: '+e2.message;e.style.display='block';return}
  k.itens=data.map(i=>({item_id:i.item_id,nome:i.nome,quantidade:Number(i.quantidade),preco_unitario:Number(i.preco_unitario),fornecedor_id:i.fornecedor_id,fornecedor_nome:i.fornecedor_nome}));
 }
 Object.assign(k,patch);
 reg('Compra editada',k.fornecedor_nome+' — '+fmt(k.valor_total));
 closeModal();render();toast('✅ Compra atualizada.');
}

/* Configurações (v4.39.2, pedido do dono: menos abas): 6 abas; as que juntam telas têm uma chave no topo.
   cfgTabAtual guarda a TELA (sub-aba), então links antigos (cfgTabAtual='ranking';go('config')) continuam valendo.
   Cada tela tem a sua permissão; a aba aparece se alguma tela dela aparece; com uma tela só, não há chave. */
const CFG_GRUPOS=[
  {id:'usuarios',nome:'Usuários',telas:[['usuarios',()=>pode('usuarios')?'👥 Pessoas':'👤 Meu perfil',null,b=>cfgUsuarios(b)],['perfis','🛡️ Perfis','perfis',b=>cfgPerfis(b)]]},
  {id:'produtos',nome:'Catálogo PDV',telas:[['produtos','🏷️ Catálogo','catalogo',b=>cfgProdutos(b)]]},
  {id:'producao',nome:'Produção e compras',telas:[['itens','📋 Itens','itens',b=>cfgItens(b)],['receitas','🧪 Receitas','receitas',b=>cfgReceitas(b)],['fornecedores','🚚 Fornecedores','fornecedores',b=>cfgFornecedores(b)]]},
  {id:'descontos',nome:'Descontos e taxas',telas:[['descontos','🤝 Descontos','descontos',b=>cfgDescontos(b)],['deslocamento','🛵 Deslocamento','descontos',b=>cfgDeslocamento(b)]]},
  {id:'avisos',nome:'Avisos e ranking',telas:[['ranking','🏆 Ranking','ranking',b=>cfgRanking(b)],['discord','💬 Discord','discord',b=>cfgDiscord(b)]]},
  {id:'logo',nome:'Identidade Visual',telas:[['logo','🎨 Identidade','identidade',b=>cfgLogo(b)]]}
];
/* compatível com quem lê a lista de abas (tutorial): [tela, nome, permissão] */
const CFG_ABAS=CFG_GRUPOS.flatMap(g=>g.telas.map(t=>[t[0],g.nome,t[2]]));
function cfgTelasVisiveis(g){return g.telas.filter(t=>!t[2]||pode(t[2]))}
const _cfgUltimaTela={};
function renderConfig(c){
  const grupos=CFG_GRUPOS.map(g=>({...g,vis:cfgTelasVisiveis(g)})).filter(g=>g.vis.length);
  let g=grupos.find(x=>x.vis.some(t=>t[0]===cfgTabAtual));
  if(!g){g=grupos[0];cfgTabAtual=g.vis[0][0]}
  _cfgUltimaTela[g.id]=cfgTabAtual;
  const abrir=x=>_cfgUltimaTela[x.id]&&x.vis.some(t=>t[0]===_cfgUltimaTela[x.id])?_cfgUltimaTela[x.id]:x.vis[0][0];
  c.innerHTML=`<h2 class="page-title">Configurações</h2>
  <div class="cfg-tabs">${grupos.map(x=>`<button class="cfg-tab ${x.id===g.id?'active':''}" onclick="cfgTabAtual='${abrir(x)}';render()">${x.nome}</button>`).join('')}</div>
  ${g.vis.length>1?`<div class="cfg-sub" role="tablist">${g.vis.map(t=>`<button class="cfg-sub-bt ${t[0]===cfgTabAtual?'active':''}" role="tab" aria-selected="${t[0]===cfgTabAtual}" onclick="cfgTabAtual='${t[0]}';render()">${typeof t[1]==='function'?t[1]():t[1]}</button>`).join('')}</div>`:''}
  <div id="cfg-body"></div>`;
  g.vis.find(t=>t[0]===cfgTabAtual)[3](document.getElementById('cfg-body'));
}
/* ---- Ranking (pedido do dono, v4.32): regras do ranking de vendedores e do aviso automático do vendedor ouro ----
   Ficam em configuracoes.ranking. O Painel e a função do banco que publica o aviso leem daqui: mudou aqui, muda em tudo.
   O banco também confere as regras (ranking_regras_validas): soma dos pesos 100, faixas de cada campo. */
/* ---- Discord (pedido do dono, v4.33): avisos do site no Discord, marcando cargos ----
   Canal "avisos": todo aviso do site; some do Discord quando some do site (🗑️ ou vencido).
   Canal "ouro": o aviso automático do vendedor ouro; fica no Discord para sempre (histórico).
   Quem envia e apaga é o banco (função discord-avisos); o site só configura. O endereço do webhook é segredo:
   o site grava (discord_salvar_webhook) mas nunca lê de volta. Só Sócio ou Diretor veem a aba. */
const DISCORD_CANAIS=[
  ['avisos','📢 Canal de avisos','Todo aviso publicado no site vai para este canal. Quando o aviso some do site (apagado no 🗑️ ou vencido), a mensagem some daqui também.'],
  ['ouro','🏆 Canal do vendedor ouro','O aviso automático do vendedor ouro da semana vai para este canal e fica lá para sempre, como histórico dos melhores.']];
const DISCORD_ID_RE=/^[0-9]{15,22}$/,DISCORD_HOOK_RE=/^https:\/\/(ptb\.|canary\.)?(discord|discordapp)\.com\/api(\/v[0-9]+)?\/webhooks\/[0-9]+\/[A-Za-z0-9_-]+$/;
const DISCORD_URL=SUPABASE_URL+'/functions/v1/discord-avisos';
function discordDeLinhas(rows){const d={};DISCORD_CANAIS.forEach(([c])=>{const r=rows.find(x=>x.canal===c)||{};d[c]={canal:c,ativo:!!r.ativo,webhook_definido:!!r.webhook_definido,cargos:Array.isArray(r.cargos)?r.cargos:[],atualizado_em:r.atualizado_em||null,atualizado_por_nome:r.atualizado_por_nome||null}});return d}
const discordLigado=c=>{const d=db&&db.discord&&db.discord[c];return!!(d&&d.ativo&&d.webhook_definido)};
let _dcCargos={},_dcLog=null;
function cfgDiscord(b){
  if(!pode('discord')){b.innerHTML='<p class="muted">Seu perfil não configura o Discord.</p>';return}
  DISCORD_CANAIS.forEach(([c])=>{_dcCargos[c]=db.discord[c].cargos.map(x=>({...x}))});
  b.innerHTML=`<div class="section-title" style="margin:0 0 4px">💬 Avisos no Discord</div>
  <p class="muted" style="font-size:13px;margin:0 0 14px">O site manda os avisos para o Discord sozinho, marcando os cargos escolhidos. Não precisa de bot: cada canal usa um webhook.</p>
  <details class="card dc-ajuda"><summary>Como pegar o webhook e o ID dos cargos</summary><ol>
    <li><b>Webhook:</b> no Discord, ⚙️ do canal › <b>Integrações</b> › <b>Webhooks</b> › <b>Novo webhook</b>. Dê nome e foto (ex.: o logo da loja) e clique em <b>Copiar URL do webhook</b>. Cole aqui. O endereço é uma senha: não mande em conversa.</li>
    <li><b>ID do cargo:</b> ligue o <b>Modo desenvolvedor</b> (Configurações de usuário › Avançado). Depois, Configurações do servidor › <b>Cargos</b> › botão direito no cargo › <b>Copiar ID do cargo</b>.</li>
    <li><b>Marcar todo mundo (@everyone):</b> cadastre o cargo <b>@everyone</b>. O ID dele é o mesmo do servidor (botão direito no ícone do servidor › <b>Copiar ID do servidor</b>). O site manda "@everyone" de verdade, e todos são avisados.</li>
    <li>Se a marcação não fizer o celular tocar, ative no cargo <b>"Permitir que qualquer pessoa @mencione este cargo"</b>.</li></ol></details>
  <div class="rk-grade dc-grade">${DISCORD_CANAIS.map(([c,t,txt])=>{const d=db.discord[c];return`<div class="card rk-bloco dc-canal" id="dc-${c}">
    <h4>${t} ${!d.webhook_definido?`<span class="tag y">sem webhook</span>`:d.ativo?`<span class="tag g">🟢 ligado</span>`:`<span class="tag r">⚪ desligado</span>`}</h4>
    ${d.webhook_definido&&!d.ativo?`<div class="dc-desligado">⚠️ Desligado: nada vai para o Discord. Marque <b>Ligado</b> e clique em <b>Salvar</b>.</div>`:''}
    <p class="muted" style="font-size:12px;margin:0 0 10px">${txt}</p>
    <label class="img-chk dc-ligado"><input type="checkbox" id="dc-ativo-${c}" ${d.ativo||!d.webhook_definido?'checked':''}> <b>Ligado</b> <small class="muted">(desmarque só para pausar o envio)</small></label>
    <div class="field" style="margin:10px 0 6px"><label>Endereço do webhook</label>
      <input id="dc-hook-${c}" type="password" autocomplete="off" spellcheck="false" placeholder="${d.webhook_definido?'Salvo ✓ (cole outro só para trocar)':'https://discord.com/api/webhooks/…'}"></div>
    ${d.webhook_definido?`<button type="button" class="btn btn-ghost btn-sm" onclick="tirarWebhookDiscord('${c}')">Tirar webhook</button>`:''}
    <div class="dc-cargos-tit">${c==='avisos'?'Cargos que podem ser marcados <small>(✓ padrão = já vem marcado no 📢)</small>':'Cargos marcados no aviso do vendedor ouro'}</div>
    <div id="dc-cargos-${c}">${dcCargosHTML(c)}</div>
    <div class="modal-actions" style="justify-content:flex-start;margin-top:12px">
      <button class="btn btn-primary" id="dc-salvar-${c}" onclick="salvarDiscord('${c}')">Salvar</button>
      <button class="btn btn-ghost" id="dc-teste-${c}" onclick="testarDiscord('${c}')" ${d.webhook_definido?'':'disabled title="Salve o webhook antes"'}>Enviar teste</button>
    </div>
    ${d.atualizado_por_nome?`<p class="muted" style="font-size:11px;margin:8px 0 0">Alterado por ${esc(d.atualizado_por_nome)} · ${dataHoraBR(d.atualizado_em)}</p>`:''}
  </div>`}).join('')}</div>
  <div class="section-title" style="margin:18px 0 6px">Últimos envios <button class="btn btn-ghost btn-sm" onclick="carregarLogDiscord()">🔄 Atualizar</button></div>
  <div id="dc-log">${dcLogHTML()}</div>`;
  carregarLogDiscord();
}
function dcCargosHTML(c){
  const l=_dcCargos[c]||[];
  return `${l.length?`<div class="dc-cargos">${l.map((x,i)=>`<div class="dc-cargo">
      <input class="dc-nome" placeholder="Nome (ex.: Vendedores)" maxlength="60" value="${esc(x.nome||'')}" oninput="_dcCargos['${c}'][${i}].nome=this.value">
      <input class="dc-id" placeholder="ID do cargo" inputmode="numeric" maxlength="22" value="${esc(x.id||'')}" oninput="_dcCargos['${c}'][${i}].id=this.value.replace(/\\D/g,'');this.value=_dcCargos['${c}'][${i}].id">
      ${c==='avisos'?`<label class="img-chk" title="Já vem marcado ao publicar"><input type="checkbox" ${x.padrao?'checked':''} onchange="_dcCargos['${c}'][${i}].padrao=this.checked"> padrão</label>`:''}
      <button type="button" class="iconbtn" title="Tirar" onclick="_dcCargos['${c}'].splice(${i},1);document.getElementById('dc-cargos-${c}').innerHTML=dcCargosHTML('${c}')">✕</button></div>`).join('')}</div>`
    :`<p class="muted" style="font-size:12px;margin:4px 0">Nenhum cargo: a mensagem vai sem marcar ninguém.</p>`}
  ${l.length<25?`<button type="button" class="btn btn-ghost btn-sm" onclick="_dcCargos['${c}'].push({id:'',nome:'',padrao:true});document.getElementById('dc-cargos-${c}').innerHTML=dcCargosHTML('${c}')">+ Adicionar cargo</button>`:''}`;
}
function errosCargosDiscord(l){
  const e=[],vistos=new Set();
  l.forEach((x,i)=>{const n=i+1;
    if(!String(x.nome||'').trim())e.push(`Cargo ${n}: falta o nome.`);
    if(!DISCORD_ID_RE.test(String(x.id||'')))e.push(`Cargo ${n}${x.nome?' ('+x.nome+')':''}: o ID tem só números (de 15 a 22). Copie em Cargos › Copiar ID do cargo.`);
    else if(vistos.has(x.id))e.push(`Cargo ${n}: ID repetido.`);
    vistos.add(x.id)});
  return e;
}
async function salvarDiscord(c){
  if(!pode('discord'))return toast('⚠️ Seu perfil não configura o Discord.');
  const hook=(document.getElementById('dc-hook-'+c).value||'').trim(),ativo=document.getElementById('dc-ativo-'+c).checked;
  const cargos=(_dcCargos[c]||[]).map(x=>({id:String(x.id||''),nome:String(x.nome||'').trim().slice(0,60),padrao:c==='ouro'?true:!!x.padrao}));
  const erros=errosCargosDiscord(cargos);
  if(hook&&!DISCORD_HOOK_RE.test(hook))erros.unshift('Endereço do webhook inválido. No Discord: Integrações › Webhooks › Copiar URL do webhook.');
  if(ativo&&!hook&&!db.discord[c].webhook_definido)erros.unshift('Para ligar, cole o endereço do webhook.');
  if(erros.length)return toast('⚠️ '+erros[0]);
  const btn=document.getElementById('dc-salvar-'+c);btn.disabled=true;btn.textContent='Salvando…';
  try{
    if(hook){const{error}=await sb.rpc('discord_salvar_webhook',{p_canal:c,p_url:hook});if(error)throw error}
    const{data,error}=await sb.from('discord_canais').update({ativo,cargos}).eq('canal',c).select().single();
    if(error)throw error;
    db.discord[c]=discordDeLinhas([data])[c];

// as mesmas conferências do banco (ranking_regras_validas)
function errosRegrasRanking(r){
  const e=[],int=(x,a,b)=>Number.isInteger(x)&&x>=a&&x<=b;
  if(![r.peso_resultado,r.peso_volume,r.peso_constancia].every(x=>int(x,0,100)))e.push('Cada peso vai de 0 a 100.');
  else if(r.peso_resultado+r.peso_volume+r.peso_constancia!==100)e.push('Os três pesos precisam somar 100% (agora: '+(r.peso_resultado+r.peso_volume+r.peso_constancia)+'%).');
  if(!int(r.min_vendas,1,100))e.push('Mínimo de vendas: de 1 a 100.');
  if(!int(r.teto_percentil,50,100))e.push('Limite por venda inválido.');
  if(!int(r.virada_hora,0,23)||!int(r.semana_inicio,1,7))e.push('Dia ou semana de trabalho inválido.');
  if(!r.aviso_titulo||r.aviso_titulo.length>50)e.push('Título do aviso: de 1 a 50 letras.');
  return e;
}

/* Imagem do vendedor ouro sob demanda (pedido do dono, v4.37): o pódio é calculado aqui com as regras da tela e a função
   discord-avisos desenha com o MESMO código do aviso automático (podio.ts) e devolve o PNG. Nada é gravado nem enviado ao Discord. */
const UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
let _rkImg=null;   // {parcial,titulo,nome,semana,blob}
function rkPodioSemana(r,desloc){
  const antes=db.ranking;let rk;
  try{db.ranking=r;rk=pnRankingSemana(desloc)}finally{db.ranking=antes}
  // mesma ordem do banco: pontuação e, no empate, a receita da loja (guardada + pendente)
  const top=rk.lista.filter(p=>p.elegivel).sort((a,b)=>b.pont-a.pont||(b.loja+b.pendente)-(a.loja+a.pendente)).slice(0,r.aviso_podio?3:1);
  return{rk,podio:top.map(p=>({id:UUID_RE.test(p.k)?p.k:null,nome:p.nome,pont:p.pont,n:p.n,dias:p.dias,receita:Math.round(p.loja+p.pendente)}))};
}
