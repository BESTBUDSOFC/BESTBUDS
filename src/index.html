/* ================= AVISOS PARA TODOS =================
   Gerente, Diretor ou Sócio publica um aviso (título + mensagem). Ele aparece como pop-up na tela de
   todo mundo que está logado (tempo real) ou assim que a pessoa entrar. Cada pessoa vê o pop-up uma vez
   (fica registrado em avisos_vistos). Quem publica escolhe em quantas horas ele some (o banco apaga de vez depois)
   ou deixa permanente (expira_em = 'infinity'). Toda segunda às 06:00 o banco publica sozinho o "Vendedor ouro da
   semana" (tipo 'vendedor_semana'), que fica a semana inteira.
   O aviso pode levar uma imagem (Storage "midia/avisos/"); com imagem, a mensagem é opcional. */
const AVISO_TITULO_MAX=80,AVISO_MSG_MAX=1000,AVISO_IMG_LADO=1600,AVISO_HORAS_MAX=8760;
// vendedor ouro com a imagem do servidor (v4.36, pedido do dono): o aviso é só a imagem
const avisoSoImagem=a=>a.tipo==='vendedor_semana'&&!!a.imagem_url;
// vendedor ouro sem imagem (a imagem falhou ou aviso antigo): pódio com a foto (ou as iniciais) do 1º, 2º e 3º (v4.35)
function avisoPodioHTML(a){
  if(avisoSoImagem(a))return '';
  if(a.tipo!=='vendedor_semana'||!Array.isArray(a.podio)||!a.podio.length)return '';
  const pos=[[1,'🥈','prata'],[0,'🥇','ouro'],[2,'🥉','bronze']].filter(([i])=>a.podio[i]);
  return `<div class="aviso-podio">${pos.map(([i,m,c])=>{const p=a.podio[i],u=(db.usuarios||[]).find(x=>x.id===p.id)||{nome:p.nome};
    return `<div class="ap-lugar ap-${c}">${fotoUsuarioHTML({...u,nome:p.nome},i?60:92)}<div class="ap-nome">${m} ${esc(p.nome)}</div><div class="ap-pts">${String(p.pont).replace('.',',')} pts · ${p.n} vendas</div></div>`}).join('')}</div>`;
}
// mensagem na tela: com o pódio desenhado, as linhas 🥈/🥉 da mensagem repetiriam os nomes (o Discord continua com elas)
const avisoMsg=a=>avisoPodioHTML(a)?String(a.mensagem||'').split('\n').filter(l=>!/^(🥈|🥉)/.test(l.trim())).join('\n'):(a.mensagem||'');
// até 2 imagens (pedido do dono, v4.34): com duas, sempre lado a lado (também no celular), nunca uma embaixo da outra
const avisoImagens=a=>[a.imagem_url,a.imagem2_url].filter(Boolean);
function avisoImgHTML(a){const im=avisoImagens(a);if(!im.length)return '';
  const tag=(u,i)=>`<a class="aviso-img" href="${esc(u)}" target="_blank" rel="noopener" title="Abrir a imagem em tamanho real"><img src="${esc(u)}" alt="Imagem ${i+1} do aviso" loading="lazy"></a>`;
  return im.length>1?`<div class="aviso-imgs-dupla">${im.map(tag).join('')}</div>`:tag(im[0],0)}
/* Reduz a foto (celular costuma passar de 5 MB, o limite do Storage) para no máximo 1600 px no lado maior */
async function reduzirImagem(file,lado){
  try{
    const bmp=await createImageBitmap(file);
    const k=Math.min(1,lado/Math.max(bmp.width,bmp.height));
    if(k===1&&file.size<=1.5e6)return file;
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    let b=await new Promise(r=>c.toBlob(r,'image/webp',.85));
    if(!b||b.type!=='image/webp')b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
    if(!b||b.size>=file.size)return file;
    return new File([b],'aviso.'+(b.type==='image/webp'?'webp':'jpg'),{type:b.type});
  }catch(e){return file}
}
const AVISO_IMGS_MAX=2;
let _avisoImgs=[];
function escolherImagemAviso(inp){
  const fs=[...(inp.files||[])];inp.value='';
  if(!fs.length)return;
  if(fs.some(f=>!['image/png','image/jpeg','image/webp'].includes(f.type)))return toast('⚠️ Formato inválido. Use PNG, JPG ou WebP.');
  const cabe=AVISO_IMGS_MAX-_avisoImgs.length;
  if(fs.length>cabe)toast(`⚠️ Até ${AVISO_IMGS_MAX} imagens por aviso.${cabe>0?` Entrou${cabe>1?'ram':''} só ${cabe===1?'a primeira':'as primeiras '+cabe}.`:''}`);
  _avisoImgs.push(...fs.slice(0,Math.max(0,cabe)));
  desenharPreviaImagensAviso();
}
function tirarImagemAviso(i){_avisoImgs.splice(i,1);desenharPreviaImagensAviso()}
function desenharPreviaImagensAviso(){
  const pv=document.getElementById('av-img-prev'),bt=document.getElementById('av-img-btn');
  if(bt)bt.style.display=_avisoImgs.length>=AVISO_IMGS_MAX?'none':'';
  if(bt)bt.querySelector('.av-img-txt').textContent=_avisoImgs.length?'🖼️ Mais uma imagem':'🖼️ Escolher imagens (até 2)';
  if(!pv)return;
  pv.innerHTML=_avisoImgs.map((f,i)=>`<div class="aviso-img-prev"><img src="${URL.createObjectURL(f)}" alt="Prévia da imagem ${i+1}"><button type="button" class="iconbtn" title="Tirar esta imagem" onclick="tirarImagemAviso(${i})">✕</button></div>`).join('');
  pv.className='aviso-img-prevs'+(_avisoImgs.length>1?' dupla':'');pv.style.display=_avisoImgs.length?'':'none';
}
/* Apaga do Storage as imagens de avisos que não estão mais no ar (1 listagem + 1 remoção, sem laço por arquivo) */
async function limparImagensAvisos(){
  try{
    const{data,error}=await sb.storage.from('midia').list('avisos',{limit:1000});if(error||!data)return;
    const emUso=new Set(avisosAtivos().flatMap(a=>avisoImagens(a).map(u=>u.split('/').pop())));
    const velhos=data.filter(o=>o.name&&!emUso.has(o.name)&&o.created_at&&Date.now()-new Date(o.created_at).getTime()>24*3600e3).map(o=>'avisos/'+o.name);
    if(velhos.length)await sb.storage.from('midia').remove(velhos);
  }catch(e){console.warn('[Best Buds] limpeza de imagens de avisos',e)}
}
// permanente: o banco grava expira_em = 'infinity' (e devolve o texto "infinity")
const avisoPermanente=a=>!a.expira_em||/infinity/i.test(String(a.expira_em));
const avisoExpiraMs=a=>avisoPermanente(a)?Infinity:new Date(a.expira_em).getTime();
function avisosAtivos(){const agora=Date.now();return (db.avisos||[]).filter(a=>avisoExpiraMs(a)>agora)}
function avisosNaoVistos(){return avisosAtivos().filter(a=>!db.avisos_vistos.has(a.id)).sort((a,b)=>new Date(a.criado_em)-new Date(b.criado_em))}
function tempoRestante(a){if(avisoPermanente(a))return 'permanente';const ms=avisoExpiraMs(a)-Date.now();if(ms<=0)return 'expirado';const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000);
  return h>=48?`some em ${Math.floor(h/24)} dias (${dataHoraBR(a.expira_em)})`:h?`some em ${h}h${m?String(m).padStart(2,'0'):''}`:`some em ${m} min`}
function atualizarSeloAvisos(){
  const el=document.getElementById('avisos-selo');if(!el||!db)return;
  const n=avisosNaoVistos().length;el.textContent=n;el.style.display=n?'':'none';
  const b=document.getElementById('btn-avisos');if(b)b.title=n?n+' aviso(s) novo(s)':'Avisos';
}

  if(!sessionUser())return;
  tutFechar(false);closeModal();closeModal2();
  _tut={i:0,passos:tutPassos()};
  document.body.insertAdjacentHTML('beforeend','<div id="tut-bloq"></div><div id="tut-spot"></div><div id="tut-bal" role="dialog" aria-modal="true" aria-live="polite"></div>');
  window.addEventListener('resize',tutPosicionar);document.addEventListener('scroll',tutPosicionar,true);
  tutMostrar();
}
function tutFecharAjuda(){document.querySelectorAll('.ajuda.aberta').forEach(a=>a.classList.remove('aberta'));if(document.activeElement)document.activeElement.blur()}
function tutMostrar(){
  if(!_tut)return;
  const p=_tut.passos[_tut.i],n=_tut.passos.length;
  if(p.antes)p.antes();
  const bal=document.getElementById('tut-bal');
  bal.innerHTML=`<span class="tut-p">${_tut.i+1} de ${n}</span><h4>${p.titulo}</h4><p>${p.texto}</p>
    ${p.espera?'<div class="tut-espera" id="tut-espera">👆 Toque no ? para continuar.</div>':''}
    <div class="tut-acoes">${p.fim?'':'<button class="tut-pular" onclick="tutFechar(true)">Pular tutorial</button>'}
      ${_tut.i>0&&!p.fim?'<button class="btn btn-ghost btn-sm" onclick="tutIr(-1)">Voltar</button>':''}
      <button class="btn btn-primary btn-sm" id="tut-prox" onclick="${p.fim?'tutFechar(true)':'tutIr(1)'}" ${p.espera?'disabled':''} style="${p.fim?'margin-left:auto':''}">${p.fim?'Concluir':'Próximo'}</button></div>`;
  // no "?" e no vídeo a pessoa interage com a tela: sem bloqueio
  document.getElementById('tut-bloq').style.display=p.espera||p.livre?'none':'block';
  const alvo=p.alvo&&p.alvo();
  if(alvo&&!alvo.closest('#sidebar-nav,#bottom-nav,#app-header'))alvo.scrollIntoView({block:'center',behavior:'instant'});
  if(p.espera==='ajuda'&&alvo){
    const ok=()=>{if(!_tut||_tut.passos[_tut.i]!==p)return;alvo.classList.add('aberta');tutIr(1)};
    ['mouseenter','focusin','click','touchstart'].forEach(ev=>alvo.addEventListener(ev,ok,{once:true}));
  }
  tutPosicionar();
  setTimeout(()=>{const b=document.getElementById('tut-prox');if(b&&!b.disabled)b.focus({preventScroll:true})},50);
}
function tutPosicionar(){
  if(!_tut)return;
  const p=_tut.passos[_tut.i],spot=document.getElementById('tut-spot'),bal=document.getElementById('tut-bal');if(!spot||!bal)return;
  const alvo=p.alvo&&p.alvo(),vw=innerWidth,vh=innerHeight,bw=bal.offsetWidth,bh=bal.offsetHeight;
  if(!alvo){spot.classList.add('centro');bal.style.left=Math.max(16,(vw-bw)/2)+'px';bal.style.top=Math.max(16,(vh-bh)/2)+'px';return}
  spot.classList.remove('centro');
  const r=alvo.getBoundingClientRect(),pad=6;
  Object.assign(spot.style,{left:r.left-pad+'px',top:r.top-pad+'px',width:r.width+2*pad+'px',height:r.height+2*pad+'px'});
  let top=r.bottom+14;if(top+bh>vh-12)top=r.top-bh-14;
  if(top<12){top=Math.min(vh-bh-12,Math.max(12,r.top));}   // alvo alto (menu lateral): o balão fica ao lado
  let left=r.left+r.width/2-bw/2;
  if(r.height>vh*.6&&r.right+bw+24<vw)left=r.right+16;
  bal.style.left=Math.max(16,Math.min(left,vw-bw-16))+'px';bal.style.top=top+'px';
}
function tutIr(d){if(!_tut)return;const p=_tut.passos[_tut.i];if(d<0&&p.espera===undefined)tutFecharAjuda();_tut.i=Math.max(0,Math.min(_tut.passos.length-1,_tut.i+d));tutMostrar()}
/* vídeo aberto pelo tour: o tour some e volta quando o vídeo fecha */
function tutPausar(){['tut-bloq','tut-spot','tut-bal'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.visibility='hidden'})}
function tutRetomar(){if(!_tut)return;['tut-bloq','tut-spot','tut-bal'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.visibility=''});tutIr(1)}
async function tutFechar(concluido){
  const estava=!!_tut;_tut=null;
  ['tut-bloq','tut-spot','tut-bal'].forEach(id=>{const e=document.getElementById(id);if(e)e.remove()});
  window.removeEventListener('resize',tutPosicionar);document.removeEventListener('scroll',tutPosicionar,true);
  tutFecharAjuda();
  if(!estava||!concluido)return;
  go('pdv');
  const u=sessionUser(),agora=new Date().toISOString();
  try{localStorage.setItem(TUT_KEY(),agora)}catch(e){}
  if(u&&!u.tutorial_visto_em){
    u.tutorial_visto_em=agora;
    const{error}=await sb.from('profiles').update({tutorial_visto_em:agora}).eq('id',u.id);
    if(error)console.warn('[Best Buds] tutorial: não gravou no perfil',error);
  }
  mostrarAvisosPendentes();
}
function mostrarAvisosPendentes(){
  if(!db||!session||!document.body.classList.contains('logado'))return;
  const bg=document.getElementById('aviso-bg');if(!bg)return;
  if(bg.classList.contains('open'))return;
  const a=avisosNaoVistos()[0];if(!a)return;
  _avisoAtual=a.id;
  document.getElementById('aviso-box').classList.toggle('aviso-ouro',a.tipo==='vendedor_semana');
  document.getElementById('aviso-box').innerHTML=`<div class="aviso-topo">${a.tipo==='vendedor_semana'?'🏆 Vendedor da semana':'📢 Aviso'}</div>
    ${avisoSoImagem(a)?avisoImgHTML(a):`<h3 class="aviso-titulo">${esc(a.titulo)}</h3>
    ${avisoPodioHTML(a)}${avisoImgHTML(a)}
    ${avisoMsg(a)?`<div class="aviso-msg">${esc(avisoMsg(a))}</div>`:''}`}
    <div class="aviso-meta">${esc(a.criado_por_nome||'—')} · ${dataHoraBR(a.criado_em)} · ${tempoRestante(a)}</div>
    <div class="modal-actions"><button class="btn btn-primary" id="btn-aviso-ok" onclick="marcarAvisoVisto()">Entendi</button></div>`;
  bg.classList.add('open');
  setTimeout(()=>{const b=document.getElementById('btn-aviso-ok');if(b)b.focus()},50);
}
async function marcarAvisoVisto(){
  const id=_avisoAtual;document.getElementById('aviso-bg').classList.remove('open');_avisoAtual=null;
  if(!id)return;
  db.avisos_vistos.add(id);atualizarSeloAvisos();
  const{error}=await sb.from('avisos_vistos').insert({aviso_id:id,usuario_id:session.usuario_id});
  if(error&&!/duplicate|23505/i.test(error.message+' '+(error.code||'')))console.warn('[Best Buds] falha ao marcar aviso como visto',error);
  setTimeout(mostrarAvisosPendentes,250);
}
function modalAvisos(){
  const ger=pode('avisos'),lista=avisosAtivos();
  openModal(`<h3>📢 Avisos</h3>
  ${ger?`<div class="aviso-form">
    <div class="field"><label>Título</label><input id="av-titulo" maxlength="${AVISO_TITULO_MAX}" placeholder="Ex.: Reunião hoje às 20h"></div>
    <div class="field"><label>Mensagem</label><textarea id="av-msg" rows="4" maxlength="${AVISO_MSG_MAX}" placeholder="Escreva o aviso para toda a equipe"></textarea></div>
    <div class="field"><label>Imagem (opcional)</label>
      <label class="btn btn-ghost btn-sm aviso-img-btn" id="av-img-btn"><span class="av-img-txt">🖼️ Escolher imagens (até 2)</span><input type="file" id="av-img" accept="image/png,image/jpeg,image/webp" multiple hidden onchange="escolherImagemAviso(this)"></label>
      <div class="aviso-img-prevs" id="av-img-prev" style="display:none"></div></div>
    <div class="field"><label>Some depois de</label><div class="aviso-dur">
      <input id="av-horas" type="number" min="1" max="${AVISO_HORAS_MAX}" step="1" value="24" inputmode="numeric"><span>horas</span>
      ${[[24,'24 h'],[72,'3 dias'],[168,'1 semana']].map(([h,r])=>`<button type="button" class="btn btn-ghost btn-sm" onclick="avisoHoras(${h})">${r}</button>`).join('')}
      <label class="img-chk"><input type="checkbox" id="av-perm" onchange="avisoPermChk(this.checked)"> Permanente (não some)</label></div></div>
    ${avisoDiscordHTML()}
    <p class="muted" style="font-size:12px;margin:-4px 0 10px">Aparece como pop-up na tela de todos. Some sozinho depois das horas escolhidas; o permanente fica até alguém apagar (🗑️).</p>
    <button class="btn btn-primary" id="btn-publicar-aviso" onclick="publicarAviso()">Publicar para todos</button>
  </div>`:''}
  <div class="section-title" style="margin-top:${ger?'18px':'4px'}">Avisos no ar</div>
  <div class="aviso-lista">${lista.length?lista.map(a=>`<div class="aviso-item${a.tipo==='vendedor_semana'?' aviso-ouro':''}">
      <div class="aviso-item-top"><b>${avisoSoImagem(a)?'🏆 Vendedor da semana':esc(a.titulo)}</b>${ger?`<button class="iconbtn" title="Apagar agora" onclick="apagarAviso('${a.id}')">🗑️</button>`:''}</div>
      ${avisoPodioHTML(a)}${avisoImgHTML(a)}
      ${!avisoSoImagem(a)&&avisoMsg(a)?`<div class="aviso-msg">${esc(avisoMsg(a))}</div>`:''}
      <div class="aviso-meta">${esc(a.criado_por_nome||'—')} · ${dataHoraBR(a.criado_em)} · ${tempoRestante(a)}</div>
    </div>`).join(''):'<p class="muted" style="font-size:13px">Nenhum aviso no ar.</p>'}</div>
  <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Fechar</button></div>`);
  _avisoImgs=[];
  // quem abre a lista já viu todos os avisos ativos
  const novos=avisosNaoVistos();
  if(novos.length){novos.forEach(a=>db.avisos_vistos.add(a.id));atualizarSeloAvisos();
    sb.from('avisos_vistos').upsert(novos.map(a=>({aviso_id:a.id,usuario_id:session.usuario_id})),{onConflict:'aviso_id,usuario_id',ignoreDuplicates:true}).then(({error})=>{if(error)console.warn('[Best Buds] falha ao marcar avisos',error)})}
}
function avisoHoras(h){const i=document.getElementById('av-horas'),c=document.getElementById('av-perm');if(c){c.checked=false}if(i){i.disabled=false;i.value=h}}
function avisoPermChk(on){const i=document.getElementById('av-horas');if(i)i.disabled=on}
async function publicarAviso(){
  if(!pode('avisos'))return toast('⚠️ Seu perfil não publica avisos.');
  const titulo=document.getElementById('av-titulo').value.trim(),mensagem=document.getElementById('av-msg').value.trim();
  if(!titulo)return toast('⚠️ Informe o título do aviso.');
  if(!mensagem&&!_avisoImgs.length)return toast('⚠️ Escreva a mensagem ou coloque uma imagem no aviso.');
  const perm=!!(document.getElementById('av-perm')||{}).checked,horas=Math.round(Number((document.getElementById('av-horas')||{}).value));
  if(!perm&&!(horas>=1&&horas<=AVISO_HORAS_MAX))return toast('⚠️ Informe em quantas horas o aviso some (1 a '+AVISO_HORAS_MAX.toLocaleString('pt-BR')+') ou marque "Permanente".');
  const btn=document.getElementById('btn-publicar-aviso');btn.disabled=true;
  const urls=[],tirarEnviadas=()=>{if(urls.length)sb.storage.from('midia').remove(urls.map(u=>'avisos/'+u.split('/').pop())).then(()=>{})};
  for(const [i,f] of _avisoImgs.entries()){
    btn.textContent=_avisoImgs.length>1?`Enviando imagem ${i+1} de ${_avisoImgs.length}…`:'Enviando imagem…';
    try{urls.push(await uploadImagem(await reduzirImagem(f,AVISO_IMG_LADO),'avisos'))}
    catch(err){tirarEnviadas();btn.disabled=false;btn.textContent='Publicar para todos';return toast('⚠️ Erro ao enviar a imagem: '+(err.message||err))}
  }
  const[imagem_url,imagem2_url]=urls;
  // Discord: só manda a escolha quando o canal está ligado (sem escolha, o banco usa os cargos padrão)
  const dc=document.querySelector('.aviso-discord')?[...document.querySelectorAll('.av-dc:checked')].map(x=>x.value):null;
  const{data,error}=await sb.from('avisos').insert({titulo:titulo.slice(0,AVISO_TITULO_MAX),mensagem:mensagem.slice(0,AVISO_MSG_MAX),...(imagem_url?{imagem_url}:{}),...(imagem2_url?{imagem2_url}:{}),...(dc?{discord_cargos:dc}:{}),duracao_horas:perm?null:horas,criado_por:session.usuario_id,criado_por_nome:sessionUser().nome}).select().single();
  btn.disabled=false;btn.textContent='Publicar para todos';
  if(error){
    tirarEnviadas();
    return toast('⚠️ Não foi possível publicar: '+error.message);
  }
  _avisoImgs=[];limparImagensAvisos();
  db.avisos.unshift(data);db.avisos_vistos.add(data.id);
  sb.from('avisos_vistos').insert({aviso_id:data.id,usuario_id:session.usuario_id}).then(()=>{});
  reg('Aviso publicado',titulo+(perm?' (permanente)':' ('+horas+' h)')+(dc?' · Discord: '+(dc.length?dc.length+' cargo(s)':'sem cargos'):''));toast(dc?'✅ Aviso publicado para todos e enviado ao Discord.':'✅ Aviso publicado para todos.');modalAvisos();
}
function apagarAviso(id){
  if(!pode('avisos'))return;
  const a=(db.avisos||[]).find(x=>x.id===id);if(!a)return;
  confirmar('Apagar aviso','O aviso "'+a.titulo+'" sai da tela de todos agora. Confirmar?',async()=>{
    const{error}=await sb.from('avisos').delete().eq('id',id);
    if(error)return toast('⚠️ Erro ao apagar: '+error.message);
    const im=avisoImagens(a);if(im.length)sb.storage.from('midia').remove(im.map(u=>'avisos/'+u.split('/').pop())).then(()=>{});
    db.avisos=db.avisos.filter(x=>x.id!==id);reg('Aviso apagado',a.titulo);atualizarSeloAvisos();modalAvisos();
  });
}
// avisos vencidos somem da tela mesmo sem nenhuma alteração no banco
setInterval(()=>{if(!db||!db.avisos)return;const antes=db.avisos.length;db.avisos=avisosAtivos();if(db.avisos.length!==antes)atualizarSeloAvisos()},60000);

(async()=>{
  const{data:{session:sessAuth}}=await sb.auth.getSession();

      session={usuario_id:perfil.id};

      startApp();
      return;

  }
  // sem sessão válida: aplica identidade visual padrão na tela de login
  try{
    const{data:cfg}=await sb.from('configuracoes').select('*').eq('id',1).maybeSingle();
    db={identidade_visual:{logotipo:cfg?.logotipo_url||null,nome_loja:cfg?.nome_loja||'BEST BUDS',cores:cfg?.cores||{},...fundoLoginDeCfg(cfg||{})}};
    aplicarIdentidadeVisual();
  }catch(e){console.warn('[Best Buds] não foi possível carregar identidade visual antes do login',e)}
