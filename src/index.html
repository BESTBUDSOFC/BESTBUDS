<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEST BUDS — Sistema de Gestão</title>
<style>
:root{
  --bg:#0D0D11;
  --surface:#181820; --surface-rgb:24,24,32;
  --border:#282836;
  --input-bg:#0f0f16;
  --text:#F3F4F6; --muted:#9CA3AF;
  --green:#00FF66; --green-rgb:0,255,102; --green-hover:#33FF85; --green-text:#04120A;
  --purple:#8B5CF6; --purple-rgb:139,92,246; --purple-hover:#A78BFA; --purple-light:#C4B5FD;
  --danger:#EF4444; --danger-rgb:239,68,68; --danger-light:#FCA5A5; --danger-soft:#F87171; --danger-strong:#B91C1C; --danger-strong-hover:#DC2626;
  --warning:#FBBF24; --warning-rgb:245,158,11; --warning-border:#F59E0B; --warning-light:#FCD34D;
  --info:#3B82F6; --info-rgb:59,130,246;
  --offwhite:#F3F4E8;
  --white:#FFFFFF;
  --r:12px; --sp:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:14px;background:var(--input-bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--purple)}
input:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.money{font-variant-numeric:tabular-nums;font-weight:700;color:var(--green)}
.money-neg{font-variant-numeric:tabular-nums;font-weight:700;color:var(--danger)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge.gerente{background:rgba(var(--purple-rgb),.15);color:var(--purple);border:1px solid var(--purple)}
.badge.vendedor{background:rgba(var(--green-rgb),.12);color:var(--green);border:1px solid var(--green)}
.btn-export{background:rgba(var(--purple-rgb),.15);color:var(--purple-light);border:1px solid var(--purple)}
.btn-export:hover{background:rgba(var(--purple-rgb),.3);color:var(--white)}

.col-filter-head{position:relative;min-width:110px}.filter-funnel{background:transparent;color:var(--muted);font-size:11px;padding:1px 3px;border-radius:4px}.filter-funnel:hover,.filter-funnel.active{background:var(--purple);color:var(--white)}.excel-filter-dropdown{position:fixed;z-index:300;width:320px;max-height:380px;background:var(--surface);border:1px solid var(--purple);border-radius:10px;box-shadow:0 12px 35px rgba(0,0,0,.6);padding:12px}.efd-title{font-weight:800;margin-bottom:8px}.efd-search{height:34px;padding:7px 9px;margin-bottom:8px}.efd-actions{display:flex;gap:6px;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:8px}.efd-actions button{background:transparent;color:var(--purple);font-size:11px;font-weight:700;padding:0}.efd-options{max-height:190px;overflow:auto}.efd-option{display:flex;align-items:center;gap:8px;padding:6px 4px;margin:0;color:var(--text);font-size:12px;text-transform:none;letter-spacing:0;font-weight:400}.efd-option input{width:auto}.efd-datas{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}.efd-datas label{font-size:11px;margin-bottom:4px}.efd-datas input{padding:9px 10px;width:100%}
.efd-footer{display:flex;justify-content:flex-end;gap:6px;margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.record-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.record-tools .btn{white-space:nowrap}
.badge.ativo{background:rgba(var(--green-rgb),.1);color:var(--green)}
.badge.inativo{background:rgba(var(--danger-rgb),.12);color:var(--danger)}
.badge.socio{background:rgba(var(--warning-rgb),.15);color:var(--warning);border:1px solid var(--warning-border)}
.badge.diretor{background:rgba(var(--info-rgb),.15);color:var(--info);border:1px solid var(--info)}
.btn{padding:10px 18px;border-radius:10px;font-weight:700;font-size:14px;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--green);color:var(--green-text)}
.btn-primary:hover{background:var(--green-hover)}
.btn-purple{background:var(--purple);color:var(--white)}
.btn-purple:hover{background:var(--purple-hover)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--muted)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn-danger:hover{background:rgba(var(--danger-rgb),.12)}
.btn-clear{background:var(--danger-strong);color:var(--white)}
.btn-clear:hover{background:var(--danger-strong-hover)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:rgba(var(--purple-rgb),.04)}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
h2.page-title{font-size:22px;font-weight:800;margin-bottom:4px}
p.page-sub{color:var(--muted);margin-bottom:20px;font-size:13px}
.section-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.empty{padding:32px;text-align:center;color:var(--muted)}
.field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.muted{color:var(--muted)}
/* ===== LOGIN ===== */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% -20%,rgba(var(--purple-rgb),.18),transparent 55%),radial-gradient(ellipse at 50% 110%,rgba(var(--green-rgb),.08),transparent 55%),var(--bg)}
.login-box{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px 32px}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo .emb{font-size:44px}
.login-logo h1{font-size:20px;font-weight:800;letter-spacing:1px;margin-top:8px}
.login-logo h1 span{color:var(--green)}
.login-logo p{color:var(--muted);font-size:12px;margin-top:4px}
.login-err{background:rgba(var(--danger-rgb),.1);border:1px solid var(--danger);color:var(--danger-light);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
/* ===== APP LAYOUT ===== */
#app-header{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(var(--surface-rgb),.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:none;align-items:center;padding:0 16px;gap:12px;z-index:50}
#app-header .emb{font-size:26px}
#app-header .logo-img{height:34px;max-width:120px;object-fit:contain}
#app-header .who{line-height:1.2}
#app-header .who .nm{font-weight:700;font-size:13px}
#app-header .vselo{margin-left:auto;background:rgba(var(--green-rgb),.1);border:1px solid var(--green);color:var(--green);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap}
#btn-sair{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:8px;font-weight:600;font-size:13px}
#btn-sair:hover{color:var(--danger);border-color:var(--danger)}
#sidebar-nav{position:fixed;top:60px;left:0;bottom:0;width:240px;background:var(--surface);border-right:1px solid var(--border);display:none;flex-direction:column;padding:12px 10px;gap:4px;z-index:40}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px;background:transparent;width:100%;text-align:left}
.nav-item:hover{color:var(--text);background:rgba(var(--purple-rgb),.08)}
.nav-item.active{color:var(--green);background:rgba(var(--green-rgb),.08);border:1px solid rgba(var(--green-rgb),.25)}
.nav-item .ic{font-size:18px;width:22px;text-align:center}
#bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:60px;background:rgba(var(--surface-rgb),.97);border-top:1px solid var(--border);z-index:50}
#bottom-nav .bn-inner{display:flex;height:100%}
#bottom-nav .nav-item{flex-direction:column;gap:2px;justify-content:center;font-size:9px;padding:4px;border-radius:0;flex:1}
#bottom-nav .nav-item .ic{font-size:16px;width:auto}
#bottom-nav .nav-item.active{border:none;border-top:2px solid var(--green);background:rgba(var(--green-rgb),.06)}
#main-content{display:none;margin:60px 0 0 240px;padding:24px;min-height:calc(100vh - 60px)}
/* ===== PDV ===== */
.pdv-layout{display:grid;grid-template-columns:1fr 460px;gap:20px;align-items:start}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:14px}
.cat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;transition:.15s;width:100%;cursor:pointer}
.cat-card:hover{border-color:var(--green);transform:translateY(-2px)}
.cat-card .cn{font-weight:700;font-size:16px;color:var(--offwhite)}
.cat-card .cc{color:var(--muted);font-size:12px;margin:3px 0 8px}
.cat-img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;margin-bottom:12px;background:var(--input-bg);display:flex;align-items:center;justify-content:center;font-size:40px;border:1px solid var(--border)}
.quick-row{display:flex;gap:5px;margin-top:12px}
.qbtn{flex:1;padding:7px 0;border-radius:7px;background:rgba(var(--purple-rgb),.15);color:var(--purple-light);font-weight:800;font-size:12px;border:1px solid transparent}
.qbtn:hover{border-color:var(--purple);color:var(--white)}
.cart-line{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.cart-line .qi{width:28px;height:28px;border-radius:6px;background:var(--border);color:var(--text);font-weight:800;font-size:15px}
.cart-line .qi:hover{background:var(--purple)}
.cart-line .nm{flex:1;font-weight:600;font-size:14px}
.qtd-in{width:64px;text-align:center;background:var(--input-bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 4px;font-weight:700}
.tot-line{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;color:var(--muted)}
.tot-line b{color:var(--text)}
.tot-line.grande{font-size:17px;border-top:1px solid var(--border);margin-top:8px;padding-top:12px}
.tot-line.grande b{color:var(--green);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
/* ===== RESUMOS ===== */
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.sum-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.sum-card .sl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.sum-card .sv{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:6px}
.sum-card.limite{border-color:var(--danger)}
/* ===== MODAL ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:17px;margin-bottom:18px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
/* ===== CONFIG TABS ===== */
.cfg-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.cfg-tab{padding:8px 16px;border-radius:20px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-weight:600;font-size:13px}
.cfg-tab.active{background:rgba(var(--purple-rgb),.15);border-color:var(--purple);color:var(--purple)}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:rgba(var(--purple-rgb),.12);color:var(--purple-light)}
.tag.g{background:rgba(var(--green-rgb),.1);color:var(--green)}
.tag.r{background:rgba(var(--danger-rgb),.12);color:var(--danger-light)}
.tag.y{background:rgba(var(--warning-rgb),.12);color:var(--warning-light)}
.mov-in{color:var(--green);font-weight:700}
.mov-out{color:var(--danger);font-weight:700}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.iconbtn{background:transparent;border:none;font-size:16px;padding:4px 6px;border-radius:6px}
.btn-del-linha{color:var(--danger);border:1px solid var(--danger);background:rgba(var(--danger-rgb),.08);font-weight:800}
.btn-del-suave{color:var(--danger-soft);border:1px solid rgba(var(--danger-rgb),.4);background:rgba(var(--danger-rgb),.05)}
.btn-del-suave:hover{background:rgba(var(--danger-rgb),.15)}
.btn-del-linha:hover{background:rgba(var(--danger-rgb),.25)}
.cart-line .iconbtn{color:var(--danger);border:1px solid var(--danger);background:rgba(var(--danger-rgb),.08);font-weight:800}
.cart-line .iconbtn:hover{background:rgba(var(--danger-rgb),.25)}
.iconbtn:hover{background:var(--border)}
.drop-zone{border:2px dashed var(--border);border-radius:var(--r);padding:32px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}
.drop-zone:hover,.drop-zone.drag{border-color:var(--purple);color:var(--purple)}
.alert-banner{background:rgba(var(--danger-rgb),.08);border:1px solid var(--danger);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.thumb{height:30px;width:30px;object-fit:cover;border-radius:6px;vertical-align:middle}
/* ===== RESPONSIVO ===== */
@media (max-width:767px){
  #sidebar-nav{display:none!important}
  #main-content{margin-left:0;padding:16px 16px 80px 16px}
  #bottom-nav{display:block}
  .pdv-layout{grid-template-columns:1fr}
  .row2,.row3{grid-template-columns:1fr}
}
@media (min-width:768px){
  #sidebar-nav{display:flex}
  #bottom-nav{display:none!important}
}
/* Formulário de compra (duas seções) */
.cmp-row{display:grid;grid-template-columns:2fr 1.6fr .7fr .9fr .9fr 34px;gap:6px;align-items:center;margin-bottom:8px;padding:3px;border-radius:10px;border:1px solid transparent}
.cmp-head{margin-bottom:4px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.cmp-head span:nth-child(4),.cmp-head span:nth-child(5){text-align:right}
#cfg-body td:last-child{white-space:nowrap}
.cmp-val{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.cmp-sub{color:var(--text);font-weight:700}
.cmp-hint{font-size:11px;color:var(--muted);font-weight:400;margin-left:6px}
.cmp-row.linha-erro{border-color:var(--danger);background:rgba(var(--danger-rgb),.08)}
.cmp-total{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px 12px;margin-top:16px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--input-bg);font-size:13px;color:var(--muted)}
.cmp-total b{color:var(--text)}
.cmp-total .op{color:var(--muted);font-weight:700}
.cmp-total .tot b{color:var(--green);font-size:16px}
.modal.modal-larga{max-width:980px}
@media(max-width:700px){
  .cmp-row{grid-template-columns:1fr 1fr;padding:8px;border-color:var(--border)}
  .cmp-row>.nc-nome,.cmp-row>.nc-forn,.cmp-row>.ssel-btn{grid-column:span 2}
  .cmp-row>.btn-del-linha{justify-self:end}
  .cmp-head{display:none}
}
.resumo{border:1px solid var(--border);border-radius:10px;padding:6px 14px;margin-bottom:6px;font-size:13px}
.resumo .rs-sec{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.3px;margin:10px 0 4px}
.resumo .rs-l{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.resumo .rs-tot{display:flex;justify-content:space-between;border-top:1px solid var(--border);margin-top:8px;padding:10px 0 6px;font-size:15px}
.resumo .rs-tot b{color:var(--green)}
.resumo .rs-meta{color:var(--muted);font-size:12px;padding-bottom:6px}
/* Lista suspensa pesquisável (substitui visualmente todos os <select>) */
.ssel-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:var(--input-bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-size:14px;text-align:left;min-width:0}
.ssel-btn:focus,.ssel-btn.aberto{border-color:var(--purple);outline:none}
.ssel-btn:disabled{opacity:.5;cursor:not-allowed}
.ssel-btn .ssel-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ssel-btn .ssel-lbl.ph{color:var(--muted)}
.ssel-btn .ssel-car{color:var(--muted);font-size:10px;flex-shrink:0}
.ssel-pop{position:fixed;z-index:400;background:var(--surface);border:1px solid var(--purple);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden}
.ssel-pop .ssel-q{border:none;border-bottom:1px solid var(--border);border-radius:0;background:var(--input-bg)}
.ssel-ops{overflow:auto;max-height:260px}
.ssel-op{padding:9px 12px;cursor:pointer;font-size:13px}
.ssel-op.hl{background:rgba(var(--purple-rgb),.18)}
.ssel-op.sel{color:var(--green);font-weight:700}
.ssel-grp{padding:8px 12px 4px;font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:.4px}
.ssel-vazio{padding:10px 12px;color:var(--muted);font-size:12px}
.ssel-add{display:block;width:100%;text-align:left;padding:10px 12px;background:rgba(var(--green-rgb),.08);color:var(--green);font-weight:700;font-size:13px;border-top:1px solid var(--border)}
/* Lista suspensa pesquisável com múltipla escolha */
.msel{position:relative}
.msel-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.msel-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(var(--purple-rgb),.15);border:1px solid var(--purple);color:var(--purple-light);border-radius:14px;padding:3px 6px 3px 10px;font-size:12px}
.msel-chip button{background:none;color:inherit;font-size:13px;line-height:1;padding:0 2px}
.msel-list{margin-top:4px;max-height:220px;overflow:auto;background:var(--input-bg);border:1px solid var(--border);border-radius:8px}
.msel-opt{display:flex!important;align-items:center;gap:8px;padding:8px 10px;margin:0!important;font-size:13px!important;font-weight:400!important;color:var(--text)!important;text-transform:none!important;cursor:pointer}
.msel-opt:hover{background:rgba(var(--purple-rgb),.1)}
.msel-opt input{width:auto}
.msel-opt .tag{margin-left:auto}
.msel-vazio{padding:10px;color:var(--muted);font-size:12px}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo"><div class="emb" id="login-logo-emb">🌿</div><h1 id="login-nome-loja">BEST <span>BUDS</span></h1><p>Sistema de Gestão</p></div>
    <div id="login-err" class="login-err"></div>
    <div class="field"><label>Nome de usuário</label><input type="text" id="login-email" autocomplete="off" placeholder="seu.usuario"></div>
    <div class="field"><label>Senha</label><input type="password" id="login-senha" placeholder="••••••"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- ============ HEADER ============ -->
<header id="app-header">
  <span id="h-logo" class="emb">🌿</span>
  <span id="h-nome-loja" style="font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px" title="BEST BUDS">BEST BUDS</span>
  <div class="who"><div class="nm" id="h-user"></div><span class="badge" id="h-perfil"></span></div>
  <span class="vselo" id="h-versao">v4.4.0</span>
  <button id="btn-sair" onclick="logout()">Sair</button>
</header>

<!-- ============ NAV LATERAL (DESKTOP) ============ -->
<nav id="sidebar-nav"></nav>
<!-- ============ NAV INFERIOR (MOBILE) ============ -->

function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--green);color:var(--text);padding:12px 20px;border-radius:10px;font-weight:600;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.5);white-space:pre-line;text-align:center;max-width:90vw';document.body.appendChild(t)}

  clearTimeout(t._h);t._h=setTimeout(()=>{t.style.display='none'},Math.max(3500,String(msg).length*60));
}

function imgSrc(url){return url||null}
async function uploadImagem(file,pasta){
  if(!file)return null;
  if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw new Error('Formato inválido. Use PNG, JPG ou WebP.');
  const ext=(file.name.split('.').pop()||'png').toLowerCase();
  const caminho=pasta+'/'+uid()+'.'+ext;
  const{error}=await sb.storage.from('midia').upload(caminho,file,{cacheControl:'3600',upsert:false});
  if(error)throw error;
  const{data}=sb.storage.from('midia').getPublicUrl(caminho);
  return data.publicUrl;
}

/* Carrega tudo que o perfil logado enxerga (RLS decide o que volta) e monta o mesmo formato
   que as telas já esperam (db.produtos, db.itens, db.vendas com itens embutidos, etc.) */
async function carregarTudo(){
  const[perfis,produtos,itens,receitas,receitaInsumos,fornecedores,parcerias,parceriaFaixas,
    taxas,vendas,vendaItens,compras,compraItens,bau,config,ajustesCaixa,fornItens,categorias]=await Promise.all([
    sb.from('profiles').select('*').order('criado_em'),
    sb.from('produtos').select('*').order('ordem'),
    sb.from('itens').select('*').order('nome'),
    sb.from('receitas').select('*').order('ordem'),
    sb.from('receita_insumos').select('*'),
    sb.from('fornecedores').select('*').order('nome'),
    sb.from('parcerias').select('*').order('ordem'),
    sb.from('parceria_faixas').select('*'),
    sb.from('taxas_deslocamento').select('*').order('ordem'),
    sb.from('vendas').select('*').order('data',{ascending:false}),
    sb.from('venda_itens').select('*'),
    sb.from('compras').select('*').order('data',{ascending:false}),
    sb.from('compra_itens').select('*'),
    sb.from('estoque_bau').select('*').order('data',{ascending:false}),
    sb.from('configuracoes').select('*').eq('id',1).single(),
    sb.from('ajustes_caixa').select('*').order('data',{ascending:false}),
    sb.from('fornecedor_itens').select('*'),
    sb.from('categorias_itens').select('*').order('ordem').order('nome')
  ]);
  for(const r of[perfis,produtos,itens,receitas,receitaInsumos,fornecedores,parcerias,parceriaFaixas,taxas,vendas,vendaItens,compras,compraItens,bau,config,ajustesCaixa,fornItens,categorias])
    if(r.error)throw r.error;

  const porReceita={};
  (receitaInsumos.data||[]).forEach(ri=>{
    (porReceita[ri.receita_id]=porReceita[ri.receita_id]||[]).push({item_id:ri.item_id,quantidade:Number(ri.quantidade),papel:ri.tipo==='producao'?'produzido':'consumo',_id:ri.id});
  });
  const porParceria={};
  (parceriaFaixas.data||[]).forEach(f=>{
    (porParceria[f.parceria_id]=porParceria[f.parceria_id]||[]).push({id:f.id,quantidade_min:Number(f.quantidade_min),quantidade_max:f.quantidade_max==null?null:Number(f.quantidade_max),percentual_desconto:Number(f.percentual_desconto)});
  });
  const porVenda={};
  (vendaItens.data||[]).forEach(vi=>{
    (porVenda[vi.venda_id]=porVenda[vi.venda_id]||[]).push({produto_id:vi.produto_id,nome:vi.nome,qtd:Number(vi.qtd),preco_unit:Number(vi.preco_unit),rateio:vi.rateio,_id:vi.id});
  });
  const porCompra={};
  (compraItens.data||[]).forEach(ci=>{
    (porCompra[ci.compra_id]=porCompra[ci.compra_id]||[]).push({item_id:ci.item_id,nome:ci.nome,quantidade:Number(ci.quantidade),preco_unitario:Number(ci.preco_unitario),fornecedor_id:ci.fornecedor_id,fornecedor_nome:ci.fornecedor_nome,_id:ci.id});
  });

  const parceriasArr=(parcerias.data||[]).map(p=>({...p,faixas:porParceria[p.id]||[]}));
  const cfg=config.data||{};
  db={
    usuarios:(perfis.data||[]),
    produtos:(produtos.data||[]).map(p=>({...p,preco:Number(p.preco),imagem:p.imagem_url})),
    itens:(itens.data||[]).map(i=>({...i,preco_unitario:Number(i.preco_unitario),qtd_minima:Number(i.qtd_minima)})),
    receitas:(receitas.data||[]).map(r=>({...r,insumos:porReceita[r.id]||[]})),
    fornecedores:(fornecedores.data||[]),
    fornecedor_itens:(fornItens.data||[]),
    categorias:(categorias.data||[]),
    parcerias:parceriasArr,
    descontos:parceriasArr,
    taxas_deslocamento:(taxas.data||[]).map(t=>({...t,valor:Number(t.valor)})),
    vendas:(vendas.data||[]).map(v=>({...v,itens:porVenda[v.id]||[],total:Number(v.total),subtotal:Number(v.subtotal),desconto:Number(v.desconto),cota_funcionario:Number(v.cota_funcionario),receita_loja:Number(v.receita_loja),taxa_valor:Number(v.taxa_valor||0),auxiliares:v.auxiliares||[]})),
    compras:(compras.data||[]).map(k=>({...k,itens:porCompra[k.id]||[],valor_total:Number(k.valor_total)})),
    estoque_bau:(bau.data||[]).map(m=>({...m,quantidade:Number(m.quantidade),saldo_resultante:Number(m.saldo_resultante)})),
    ajustes_caixa:(ajustesCaixa.data||[]).map(a=>({...a,valor:Number(a.valor)})),
    aliquota_global:Number(cfg.aliquota_global||50),
    aliquota_taxa_deslocamento:Number(cfg.aliquota_taxa_deslocamento||100),
    identidade_visual:{logotipo:cfg.logotipo_url||null,nome_loja:cfg.nome_loja||'BEST BUDS',cores:cfg.cores||{}}
  };
}

/* ================= SESSÃO / AUTENTICAÇÃO (SUPABASE AUTH) ================= */
async function doLogin(){
  const usuario=(document.getElementById('login-email').value||'').trim().toLowerCase();
  const senha=document.getElementById('login-senha').value||'';
  const err=document.getElementById('login-err');
  err.style.display='none';
  if(!usuario||!senha){err.textContent='Informe usuário e senha.';err.style.display='block';return}
  const{data,error}=await sb.auth.signInWithPassword({email:usuario+'@'+EMAIL_DOMAIN,password:senha});
  if(error||!data.user){
    const credenciaisErradas=error&&/invalid.*credentials/i.test(error.message||'');
    err.textContent=credenciaisErradas?'Nome de usuário ou senha inválidos.':('Erro ao entrar: '+(error?error.message:'resposta inesperada do servidor.'));
    err.style.display='block';return
  }
  const{data:perfil,error:perr}=await sb.from('profiles').select('*').eq('id',data.user.id).single();
  if(perr||!perfil){err.textContent='Perfil não encontrado. Procure um gerente.';err.style.display='block';await sb.auth.signOut();return}
  if(perfil.status!=='ativo'){err.textContent='Usuário inativo. Procure um gerente.';err.style.display='block';await sb.auth.signOut();return}
  session={usuario_id:perfil.id};
  if(perfil.troca_senha_obrigatoria){openTrocaSenha(perfil);return}
  await finishLogin(perfil);
}
async function finishLogin(perfil){
  await sb.from('profiles').update({ultimo_login:nowISO()}).eq('id',perfil.id);
  await carregarTudo();
  startApp();
}
async function logout(){await sb.auth.signOut();location.reload()}

function openTrocaSenha(u){
  const bg=document.getElementById('modal-bg'),box=document.getElementById('modal-box');
  box.innerHTML=`<h3>Troca obrigatória de senha</h3>
  <p style="color:var(--muted);margin-bottom:16px">Olá, <b>${esc(u.nome)}</b>. Por segurança, defina uma nova senha (mínimo 6 caracteres) para continuar.</p>
  <div class="field"><label>Nova senha</label><input type="password" id="ts1"></div>
  <div class="field"><label>Confirmar nova senha</label><input type="password" id="ts2"></div>
  <p id="ts-err" style="color:var(--danger);font-size:13px;display:none"></p>
  <div class="modal-actions"><button class="btn btn-primary" id="ts-save">Salvar e entrar</button></div>`;
  bg.classList.add('open');
  document.getElementById('ts-save').onclick=async()=>{
    const a=document.getElementById('ts1').value,b=document.getElementById('ts2').value,e=document.getElementById('ts-err');
    if(a.length<6){e.textContent='A senha deve ter no mínimo 6 caracteres.';e.style.display='block';return}
    if(a!==b){e.textContent='As senhas não conferem.';e.style.display='block';return}
    const{error}=await sb.auth.updateUser({password:a});
    if(error){e.textContent='Erro ao salvar senha: '+error.message;e.style.display='block';return}
    await sb.from('profiles').update({troca_senha_obrigatoria:false}).eq('id',u.id);
    u.troca_senha_obrigatoria=false;
    bg.classList.remove('open');await finishLogin(u);
  };
}

function prodAtivos(){return db.produtos.filter(p=>p.status==='ativo').sort((a,b)=>a.ordem-b.ordem)}
function parceriasAtivas(){return db.parcerias.filter(p=>p.status==='ativo').sort((a,b)=>a.ordem-b.ordem)}
function taxasAtivas(){return db.taxas_deslocamento.filter(t=>t.status==='ativo').sort((a,b)=>a.ordem-b.ordem)}

function descontoFaixa(desconto,qtdItens){
  if(!desconto)return 0;
  if(desconto.tipo==='fixa')return desconto.desconto_fixo||0;
  const f=(desconto.faixas||[]).find(fx=>qtdItens>=fx.quantidade_min&&(fx.quantidade_max===null||qtdItens<=fx.quantidade_max));
  return f?f.percentual_desconto:0;
}
function fatorRateio(prod){
  if(prod.rateio==='100% Equipe')return 1;
  if(prod.rateio==='100% Loja')return 0;
  return (db.aliquota_global||0)/100;
}
function calcCupom(){
  const itens=pdvState.cupom.map(l=>({prod:db.produtos.find(p=>p.id===l.prodId),qtd:l.qtd})).filter(x=>x.prod&&x.qtd>0);
  const qtdItens=itens.reduce((s,x)=>s+x.qtd,0);
  const parceria=db.parcerias.find(p=>p.id===pdvState.parceriaId)||null;
  const taxa=db.taxas_deslocamento.find(t=>t.id===pdvState.taxaId)||null;
  const pct=descontoFaixa(parceria,qtdItens);
  const subtotal=itens.reduce((s,x)=>s+x.qtd*x.prod.preco,0);
  const desconto=subtotal*pct/100;
  const taxaValor=taxa?taxa.valor:0;
  const total=Math.max(0,subtotal-desconto+taxaValor);
  const cota=itens.reduce((s,x)=>s+(x.qtd*x.prod.preco)*(1-pct/100)*fatorRateio(x.prod),0)+(taxaValor*(db.aliquota_taxa_deslocamento||0)/100);
  const loja=total-cota;
  return {itens,qtdItens,parceria,taxa,pct,subtotal,desconto,taxaValor,total,cota,loja};
}

          <input class="qtd-in" type="number" min="1" value="${x.qtd}" onchange="setQtd('${x.prod.id}',this.value)" onfocus="this.select()">
          <span class="money">${fmt(x.qtd*x.prod.preco)}</span>
          <button class="iconbtn" onclick="rmCupom('${x.prod.id}')">✕</button>
        </div>`).join(''):'<div class="empty" style="padding:16px">Cupom vazio — toque em um produto.</div>'}</div>
      <div style="margin-top:14px">
        <div class="tot-line"><span>Subtotal (${cup.qtdItens} itens)</span><b>${fmt(cup.subtotal)}</b></div>
        <div class="tot-line"><span>Desconto ${cup.parceria?esc(cup.parceria.nome):''} (${cup.pct}%)</span><b style="color:var(--danger)">−${fmt(cup.desconto)}</b></div>
        <div class="tot-line"><span>Taxa de deslocamento</span><b>+${fmt(cup.taxaValor)}</b></div>
        <div class="tot-line"><span>Repasse equipe</span><b style="color:var(--purple)">${fmt(cup.cota)}</b></div>
        <div class="tot-line"><span>Receita líquida da loja</span><b style="color:var(--green)">${fmt(cup.loja)}</b></div>
        <div class="tot-line grande"><span>Valor Total</span><b>${fmt(cup.total)}</b></div>
      </div>
      <div style="margin-top:16px">
        <button class="btn btn-primary" style="width:100%;justify-content:center" ${cup.itens.length?'':'disabled'} onclick="finalizarVenda()">Finalizar venda</button>
      </div>
    </div>
  </div>`;
}
function addCupom(pid,qtd){
  const l=pdvState.cupom.find(x=>x.prodId===pid);
  if(l)l.qtd+=(qtd||1);else pdvState.cupom.push({prodId:pid,qtd:qtd||1});
  renderPDV(document.getElementById('main-content'));
}
function decCupom(pid){
  const l=pdvState.cupom.find(x=>x.prodId===pid);
  if(!l)return;
  l.qtd--;if(l.qtd<=0)pdvState.cupom=pdvState.cupom.filter(x=>x.prodId!==pid);
  renderPDV(document.getElementById('main-content'));
}
function setQtd(pid,v){
  const l=pdvState.cupom.find(x=>x.prodId===pid);if(!l)return;
  const n=parseInt(v);
  if(!n||n<1){renderPDV(document.getElementById('main-content'));return}
  l.qtd=n;
  renderPDV(document.getElementById('main-content'));
}
function rmCupom(pid){pdvState.cupom=pdvState.cupom.filter(x=>x.prodId!==pid);renderPDV(document.getElementById('main-content'))}
function limparCupom(){pdvState={cupom:[],parceriaId:null,taxaId:null,auxiliares:[]};renderPDV(document.getElementById('main-content'))}
async function finalizarVenda(){
  const cup=calcCupom();
  if(!cup.itens.length)return;
  const somaPct=(pdvState.auxiliares||[]).reduce((s,a)=>s+(parseFloat(a.pct)||0),0);
  if(somaPct>100)return toast('⚠️ A soma dos % dos auxiliares não pode passar de 100.');
  const cabecalho={
    usuario_id:sessionUser().id,usuario_nome:sessionUser().nome,
    parceria_id:pdvState.parceriaId,parceria_nome:cup.parceria?cup.parceria.nome:null,
    taxa_id:pdvState.taxaId,taxa_nome:cup.taxa?cup.taxa.nome:null,taxa_valor:cup.taxaValor,
    subtotal:cup.subtotal,desconto:cup.desconto,pct_desconto:cup.pct,
    total:cup.total,cota_funcionario:cup.cota,receita_loja:cup.loja,
    auxiliares:(pdvState.auxiliares||[]).filter(a=>a.nome||a.pct).map(a=>({nome:a.nome,pct:parseFloat(a.pct)||0})),
    status:'ativa'
  };
  const{data:vRow,error:e1}=await sb.from('vendas').insert(cabecalho).select().single();
  if(e1)return toast('⚠️ Erro ao registrar venda: '+e1.message);
  const itensRows=cup.itens.map(x=>({venda_id:vRow.id,produto_id:x.prod.id,nome:x.prod.nome,qtd:x.qtd,preco_unit:x.prod.preco,rateio:x.prod.rateio}));
  const{data:itensInseridos,error:e2}=await sb.from('venda_itens').insert(itensRows).select();
  if(e2){await sb.from('vendas').delete().eq('id',vRow.id);return toast('⚠️ Erro ao registrar itens da venda: '+e2.message)}
  const v={...vRow,itens:itensInseridos.map(i=>({produto_id:i.produto_id,nome:i.nome,qtd:Number(i.qtd),preco_unit:Number(i.preco_unit),rateio:i.rateio}))};
  db.vendas.unshift(v);
  reg('Venda finalizada',`${v.itens.map(i=>i.qtd+'× '+i.nome).join(', ')} — total ${fmt(v.total)}`);
  limparCupom();
  toast(`✅ Venda registrada!\nTotal: ${fmt(v.total)} · Repasse: ${fmt(v.cota_funcionario)} · Loja: ${fmt(v.receita_loja)}`);
  render();
}

function catNome(c){return catInfo(c).nome}
function controlaEstoque(c){return !!catInfo(c).controla_estoque}
function catCompravel(c){return !!catInfo(c).compravel&&!!catInfo(c).controla_estoque}
function catReceitas(c){return !!catInfo(c).aparece_receitas}
function itensCompraveis(){return db.itens.filter(i=>i.status==='ativo'&&catCompravel(i.categoria)).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'))}

  </table></div>${paginacao('bau',paginaBau)}`;

function modalAjusteBau(itemId,tipo){
  const it=db.itens.find(i=>i.id===itemId);if(!it)return;
  openModal(`<h3>${tipo==='entrada'?'➕ Entrada avulsa':'➖ Saída avulsa'} — ${esc(it.nome)}</h3>
  <p style="color:var(--muted);margin-bottom:14px">Saldo atual: <b style="color:var(--green)">${saldoItem(it.id)} ${esc(it.unidade_medida)}</b></p>
  <div class="field"><label>Quantidade (${esc(it.unidade_medida)})</label><input id="aj-qtd" type="number" min="0.01" step="0.01"></div>
  <div class="field"><label>Motivo / observação (opcional)</label><input id="aj-motivo" placeholder="ex.: ajuste de inventário, perda, doação"></div>
  <p id="aj-err" style="color:var(--danger);font-size:13px;display:none"></p>
  <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
  <button class="btn btn-primary" onclick="salvarAjusteBau('${itemId}','${tipo}')">Confirmar</button></div>`);
}
async function salvarAjusteBau(itemId,tipo){
  if(!isGerente())return toast('⚠️ Vendedores não podem realizar entradas e saídas avulsas.');
  const it=db.itens.find(i=>i.id===itemId);if(!it)return;
  const qtd=parseFloat(document.getElementById('aj-qtd').value);
  const motivo=document.getElementById('aj-motivo').value.trim();
  const e=document.getElementById('aj-err');
  if(!(qtd>0)){e.textContent='Informe uma quantidade maior que zero.';e.style.display='block';return}
  const saldoAnt=saldoItem(itemId);
  if(tipo==='saida'&&qtd>saldoAnt){e.textContent=`Saldo insuficiente (disponível: ${saldoAnt}).`;e.style.display='block';return}
  const operacaoId=await nextOpId();
  const mv={operacao_id:operacaoId,item_id:itemId,tipo_movimento:tipo==='entrada'?'ajuste_entrada':'ajuste_saida',quantidade:qtd,usuario_id:sessionUser().id,usuario_nome:sessionUser().nome,origem:(motivo||'ajuste manual')+' — por '+sessionUser().nome,saldo_resultante:tipo==='entrada'?saldoAnt+qtd:saldoAnt-qtd};
  const{data,error}=await sb.from('estoque_bau').insert(mv).select().single();
  if(error)return toast('⚠️ Erro ao registrar movimentação: '+error.message);
  db.estoque_bau.unshift({...data,quantidade:Number(data.quantidade),saldo_resultante:Number(data.saldo_resultante)});
  reg(tipo==='entrada'?'Ajuste de estoque (+)':'Ajuste de estoque (−)',`${it.nome}: ${tipo==='entrada'?'+':'−'}${qtd} ${it.unidade_medida}${motivo?' — '+motivo:''}`);
  closeModal();toast('✅ Movimentação registrada no Baú.');render();
}

  const r=id?db.receitas.find(x=>x.id===id):null;
  const ins=r?(r.insumos||[]):[];
  const usados=new Set(ins.map(x=>x.item_id));
  const itensSel=db.itens.filter(i=>(i.status==='ativo'&&catReceitas(i.categoria))||usados.has(i.id));
  const cons=ins.filter(x=>x.papel==='consumo'),prod=ins.filter(x=>x.papel==='produzido');
  openModal(`<h3>${r?'Editar receita':'Nova receita'}</h3>
  <div class="field"><label>Nome da receita</label><input id="r-nome" value="${r?esc(r.nome):''}"></div>

  <p style="color:var(--muted);font-size:12px;margin-top:8px">Se o bloco 2 ficar vazio, a receita é de <b>Produto Final</b> (apenas deduz insumos).</p>
  <div style="display:flex;align-items:center;gap:8px;margin-top:8px">

  <p id="r-err" style="color:var(--danger);font-size:13px;display:none;margin-top:10px"></p>

function linhaReceita(ri,itensSel,tipo){
  const opts=itensSel.map(i=>`<option value="${i.id}" ${ri.item_id===i.id?'selected':''}>${esc(i.nome)} (${catNome(i.categoria)})</option>`).join('');
  return`<div class="row2" style="margin-bottom:8px" data-${tipo}>
    <select class="ri-item">${opts}</select>
    <div style="display:flex;gap:6px">
      <input class="ri-qtd" type="number" min="0.01" step="0.01" placeholder="Qtd" value="${ri.quantidade||''}">
      <button class="iconbtn" title="Remover linha" onclick="this.closest('[data-${tipo}]').remove()">✕</button>
    </div></div>`;
}
function addLinhaReceita(tipo){
  const itensSel=db.itens.filter(i=>i.status==='ativo'&&catReceitas(i.categoria));
  const d=document.createElement('div');
  d.innerHTML=linhaReceita({item_id:'',quantidade:''},itensSel,tipo);
  document.getElementById(tipo==='cons'?'r-cons':'r-prod').appendChild(d.firstElementChild);
}
async function salvarReceita(id){
  if(!isGerente())return toast('⚠️ Apenas Gerentes, Diretores ou Sócios podem criar ou editar receitas.');
  const nome=document.getElementById('r-nome').value.trim();
  const e=document.getElementById('r-err');
  const fail=m=>{e.textContent=m;e.style.display='block'};
  const cons=[...document.querySelectorAll('#r-cons [data-cons]')].map(d=>({
    item_id:d.querySelector('.ri-item').value,quantidade:parseFloat(d.querySelector('.ri-qtd').value),papel:'consumo'
  })).filter(x=>x.item_id&&x.quantidade>0);
  const prod=[...document.querySelectorAll('#r-prod [data-prod]')].map(d=>({
    item_id:d.querySelector('.ri-item').value,quantidade:parseFloat(d.querySelector('.ri-qtd').value),papel:'produzido'
  })).filter(x=>x.item_id&&x.quantidade>0);
  if(!nome)return fail('Informe o nome da receita.');
  if(!cons.length)return fail('Adicione ao menos um insumo consumido no Bloco 1.');
  if(!prod.length&&!document.getElementById('r-prodfinal').checked)
    return fail('Bloco 2 vazio = receita de Produto Final. Marque a caixa de confirmação para salvar.');
  const todos=[...cons,...prod];
  let receitaId=id;
  if(id){
    const{error}=await sb.from('receitas').update({nome}).eq('id',id);
    if(error)return fail('Erro ao salvar: '+error.message);
    await sb.from('receita_insumos').delete().eq('receita_id',id);
  }else{
    const{data,error}=await sb.from('receitas').insert({nome,ordem:db.receitas.length+1,criado_por:sessionUser().id}).select().single();
    if(error)return fail('Erro ao salvar: '+error.message);
    receitaId=data.id;
  }
  const linhas=todos.map(x=>({receita_id:receitaId,item_id:x.item_id,quantidade:x.quantidade,tipo:x.papel==='produzido'?'producao':'consumo'}));
  const{data:insInseridos,error:e2}=await sb.from('receita_insumos').insert(linhas).select();
  if(e2)return fail('Erro ao salvar insumos: '+e2.message);
  const insumosLocal=insInseridos.map(ri=>({item_id:ri.item_id,quantidade:Number(ri.quantidade),papel:ri.tipo==='producao'?'produzido':'consumo',_id:ri.id}));
  if(id){const i=db.receitas.findIndex(x=>x.id===id);db.receitas[i]={...db.receitas[i],nome,insumos:insumosLocal}}
  else db.receitas.push({id:receitaId,nome,ordem:db.receitas.length+1,status:'ativo',criado_em:nowISO(),criado_por:sessionUser().id,insumos:insumosLocal});
  reg(id?'Receita editada':'Receita criada',nome);
  closeModal();toast('✅ Receita salva.');render();
}
async function delReceita(id){
  const r=db.receitas.find(x=>x.id===id);if(!r)return;
  confirmar('Excluir receita',`A receita "${r.nome}" será removida. Confirmar?`,async()=>{
    const{error}=await sb.from('receitas').delete().eq('id',id);
    if(error)return toast('⚠️ Erro ao excluir: '+error.message);
    db.receitas=db.receitas.filter(x=>x.id!==id);
    reg('Receita excluída',r.nome);render();
  });
}
function excluirReceita(id){
  if(!isSocioOuDiretor())return toast('⚠️ Apenas Sócio ou Diretor podem excluir linhas de cadastro.');
  delReceita(id);
}
function execProducao(rid){
  const r=db.receitas.find(x=>x.id===rid);if(!r)return;
  const cons=(r.insumos||[]).filter(x=>x.papel==='consumo').map(x=>({ri:x,it:db.itens.find(i=>i.id===x.item_id)}));
  const prd=(r.insumos||[]).filter(x=>x.papel==='produzido').map(x=>({ri:x,it:db.itens.find(i=>i.id===x.item_id)}));
  openModal(`<h3>Produzir — ${esc(r.nome)}</h3>
    <p class="muted" style="margin-bottom:14px">Informe a quantidade inteira a produzir. Nenhum movimento será criado antes da confirmação.</p>
    <div class="field"><label>Quantidade de lotes/unidades</label><input id="prod-qtd" type="number" min="1" step="1" value="1" oninput="atualizarPreviaProducao('${rid}')"></div>
    <div id="prod-previa"></div>
    <p id="prod-err" style="color:var(--danger);font-size:13px;display:none"></p>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="confirmarProducao('${rid}')">Confirmar produção</button></div>`);
  atualizarPreviaProducao(rid);
}
function atualizarPreviaProducao(rid){
  const r=db.receitas.find(x=>x.id===rid);if(!r)return;
  const q=Math.max(1,parseInt(document.getElementById('prod-qtd')?.value)||1);
  const cons=(r.insumos||[]).filter(x=>x.papel==='consumo').map(x=>({ri:x,it:db.itens.find(i=>i.id===x.item_id)}));
  const prd=(r.insumos||[]).filter(x=>x.papel==='produzido').map(x=>({ri:x,it:db.itens.find(i=>i.id===x.item_id)}));
  const falt=cons.filter(x=>x.it&&saldoItem(x.it.id)<x.ri.quantidade*q);
  const max=falt.length?Math.min(...falt.map(x=>Math.floor(saldoItem(x.it.id)/x.ri.quantidade))):null;
  const el=document.getElementById('prod-previa');if(!el)return;
  el.innerHTML=`<div class="card" style="padding:12px;margin-top:10px"><b>Resumo da produção</b>
    <div style="margin-top:8px;color:var(--warning-light)"><b>⬇️ Insumos consumidos</b>${cons.map(x=>`<div style="display:flex;justify-content:space-between;padding:3px 0"><span>${x.it?esc(x.it.nome):'?'}</span><span>−${x.ri.quantidade*q} ${x.it?esc(x.it.unidade_medida):''}</span></div>`).join('')||'<div>—</div>'}</div>
    <div style="margin-top:8px;color:var(--green)"><b>⬆️ Itens produzidos</b>${prd.map(x=>`<div style="display:flex;justify-content:space-between;padding:3px 0"><span>${x.it?esc(x.it.nome):'?'}</span><span>+${x.ri.quantidade*q} ${x.it?esc(x.it.unidade_medida):''}</span></div>`).join('')||'<div>Produto final — não entra no Baú</div>'}</div>
    ${falt.length?`<div style="color:var(--danger);margin-top:10px">Saldo insuficiente. Quantidade máxima possível: <b>${Math.max(0,max)}</b>.</div>${blocoCascata(rid,q)}`:''}</div>`;
}

/* ================= PRODUÇÃO EM CASCATA =================
   Quando faltam insumos, procura receitas ativas que os produzam e monta um plano que começa pela
   primeira receita da cadeia (a mais "de baixo") até chegar à receita pedida. Tudo é simulado sobre
   o saldo atual do Baú; nada é gravado antes da confirmação. */
function receitaProdutora(itemId,pilha){
  return [...db.receitas].filter(r=>r.status==='ativo'&&!pilha.includes(r.id)&&(r.insumos||[]).some(x=>x.papel==='produzido'&&x.item_id===itemId&&x.quantidade>0))
    .sort((a,b)=>(a.ordem||99)-(b.ordem||99))[0]||null;
}
function planejarCascata(rid,q){
  const saldo={};db.itens.forEach(i=>{saldo[i.id]=saldoItem(i.id)});
  const inicial={...saldo},passos=[];
  const produzir=(r,qtd,pilha)=>{
    const cons=(r.insumos||[]).filter(x=>x.papel==='consumo');
    for(let tentativa=0;tentativa<10;tentativa++){
      let produziuAlgo=false;
      for(const x of cons){
        const it=db.itens.find(i=>i.id===x.item_id);if(!it||!controlaEstoque(it.categoria))continue;
        const falta=x.quantidade*qtd-saldo[it.id];if(falta<=0)continue;
        const r2=receitaProdutora(it.id,[...pilha,r.id]);if(!r2)continue;
        const porLote=(r2.insumos||[]).find(y=>y.papel==='produzido'&&y.item_id===it.id).quantidade;
        produzir(r2,Math.ceil(falta/porLote),[...pilha,r.id]);produziuAlgo=true;
      }
      if(!produziuAlgo)break;
    }
    const mov=[];
    cons.forEach(x=>{const it=db.itens.find(i=>i.id===x.item_id);if(it&&controlaEstoque(it.categoria)){saldo[it.id]-=x.quantidade*qtd;mov.push({it,q:-x.quantidade*qtd})}});
    (r.insumos||[]).filter(x=>x.papel==='produzido').forEach(x=>{const it=db.itens.find(i=>i.id===x.item_id);if(it&&controlaEstoque(it.categoria)){saldo[it.id]+=x.quantidade*qtd;mov.push({it,q:x.quantidade*qtd})}});
    passos.push({r,qtd,mov});
  };
  produzir(db.receitas.find(x=>x.id===rid),q,[]);
  const faltas=db.itens.filter(i=>saldo[i.id]<-1e-9).map(i=>({it:i,falta:-saldo[i.id]}));
  const efeito=db.itens.filter(i=>Math.abs(saldo[i.id]-inicial[i.id])>1e-9).map(i=>({it:i,antes:inicial[i.id],depois:saldo[i.id]}));
  return{passos,faltas,efeito,possivel:!faltas.length,temCascata:passos.length>1};
}
function blocoCascata(rid,q){
  const pl=planejarCascata(rid,q);
  if(!pl.temCascata)return '';
  if(!pl.possivel)return `<div style="margin-top:10px;font-size:12px;color:var(--muted)">Nem com produção em cascata é possível: falta${pl.faltas.length>1?'m':''} ${pl.faltas.map(f=>`<b style="color:var(--danger)">${fmtQtd(f.falta)} ${esc(f.it.unidade_medida)} de ${esc(f.it.nome)}</b>`).join(', ')} (compre antes de produzir).</div>`;
  return `<div style="margin-top:12px;padding:10px;border:1px dashed var(--purple);border-radius:8px">
    <div style="font-size:13px">É possível produzir em <b>cascata</b>: ${pl.passos.length-1} produção(ões) anterior(es) geram os insumos que faltam.</div>
    <button class="btn btn-purple btn-sm" style="margin-top:8px" onclick="revisarCascata('${rid}')">🔗 Ver produção em cascata</button></div>`;
}
function fmtQtd(n){return Number(n.toFixed(4)).toLocaleString('pt-BR')}
function revisarCascata(rid){
  const q=Math.max(1,parseInt(document.getElementById('prod-qtd')?.value)||1);
  const pl=planejarCascata(rid,q);
  if(!pl.possivel||!pl.temCascata)return toast('⚠️ A produção em cascata não é possível com o saldo atual.');
  openModal2(`<h3>🔗 Produção em cascata</h3>
    <p class="muted" style="font-size:12px;margin-bottom:10px">As produções serão feitas nesta ordem, numa única operação. Confira antes de confirmar.</p>
    <div class="resumo">${pl.passos.map((p,i)=>`
      <div class="rs-sec">${i+1}. ${esc(p.r.nome)} × ${p.qtd}${i===pl.passos.length-1?' <span style="color:var(--green)">(pedida)</span>':''}</div>
      ${p.mov.map(m=>`<div class="rs-l"><span>${esc(m.it.nome)}</span><b style="color:${m.q<0?'var(--warning-light)':'var(--green)'}">${m.q<0?'−':'+'}${fmtQtd(Math.abs(m.q))} ${esc(m.it.unidade_medida)}</b></div>`).join('')||'<div class="rs-l"><span class="muted">Produto final — não movimenta o Baú</span></div>'}`).join('')}
      <div class="rs-sec" style="margin-top:14px">Saldo no Baú (antes → depois)</div>
      ${pl.efeito.map(e=>`<div class="rs-l"><span>${esc(e.it.nome)}</span><span>${fmtQtd(e.antes)} → <b>${fmtQtd(e.depois)}</b> ${esc(e.it.unidade_medida)}</span></div>`).join('')}
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal2()">Voltar</button>
    <button class="btn btn-primary" id="btn-conf-cascata" onclick="confirmarCascata('${rid}',${q})">Confirmar produção em cascata</button></div>`);
}
async function confirmarCascata(rid,q){
  if(!isGerente())return toast('⚠️ Apenas Gerente, Diretor ou Sócio podem produzir.');
  const pl=planejarCascata(rid,q);
  if(!pl.possivel)return toast('⚠️ O saldo mudou e a cascata não é mais possível. Revise a produção.');
  const btn=document.getElementById('btn-conf-cascata');if(btn){btn.disabled=true;btn.textContent='Produzindo…'}
  let opId;try{opId=await nextOpId()}catch(e){if(btn){btn.disabled=false;btn.textContent='Confirmar produção em cascata'}return toast('⚠️ Erro ao gerar ID: '+(e.message||e))}
  const alvo=pl.passos[pl.passos.length-1].r.nome,saldo={},movimentos=[];
  pl.passos.forEach(p=>p.mov.forEach(m=>{
    if(saldo[m.it.id]===undefined)saldo[m.it.id]=saldoItem(m.it.id);
    saldo[m.it.id]+=m.q;
    const tipo=m.q>0?'entrada_producao':(m.it.categoria==='produto_nao_acabado'?'saida_deducao':'saida_producao');
    movimentos.push({operacao_id:opId,item_id:m.it.id,tipo_movimento:tipo,quantidade:Math.abs(m.q),usuario_id:sessionUser().id,usuario_nome:sessionUser().nome,
      origem:'produção em cascata: '+p.r.nome+(p.r.nome!==alvo?' (para '+alvo+')':''),saldo_resultante:saldo[m.it.id]});
  }));
  // um único insert: ou grava a cascata inteira, ou nada
  const{data,error}=await sb.from('estoque_bau').insert(movimentos).select();
  if(error){if(btn){btn.disabled=false;btn.textContent='Confirmar produção em cascata'}return toast('⚠️ Erro ao gravar a produção: '+error.message)}
  data.forEach(d=>db.estoque_bau.unshift({...d,quantidade:Number(d.quantidade),saldo_resultante:Number(d.saldo_resultante)}));
  reg('Produção em cascata',`${alvo} × ${q} — ID ${opId} — ${pl.passos.map(p=>p.r.nome+' ×'+p.qtd).join(' → ')}`);
  closeModal2();closeModal();toast('✅ Produção em cascata executada. ID: '+opId);render();
}
async function confirmarProducao(rid){
  const r=db.receitas.find(x=>x.id===rid);if(!r)return;
  const q=parseInt(document.getElementById('prod-qtd').value);
  const err=document.getElementById('prod-err');
  if(!Number.isInteger(q)||q<1){err.textContent='Informe uma quantidade inteira mínima de 1.';err.style.display='block';return}
  const cons=(r.insumos||[]).filter(x=>x.papel==='consumo').map(x=>({ri:x,it:db.itens.find(i=>i.id===x.item_id)}));
  const falt=cons.filter(x=>x.it&&saldoItem(x.it.id)<x.ri.quantidade*q);
  if(falt.length){err.textContent='Estoque insuficiente. Reduza a quantidade'+(planejarCascata(rid,q).possivel&&planejarCascata(rid,q).temCascata?' ou use a produção em cascata indicada no resumo.':' conforme a sugestão do resumo.');err.style.display='block';return}
  const producaoId=await nextOpId();
  const prd=(r.insumos||[]).filter(x=>x.papel==='produzido').map(x=>({ri:x,it:db.itens.find(i=>i.id===x.item_id)}));
  const movimentos=[];
  cons.forEach(x=>{
    if(!x.it||!controlaEstoque(x.it.categoria))return;
    const tipo=x.it.categoria==='produto_nao_acabado'?'saida_deducao':'saida_producao';
    movimentos.push({operacao_id:producaoId,item_id:x.it.id,tipo_movimento:tipo,quantidade:x.ri.quantidade*q,usuario_id:sessionUser().id,usuario_nome:sessionUser().nome,origem:'produção: '+r.nome,saldo_resultante:saldoItem(x.it.id)-x.ri.quantidade*q});
  });
  prd.forEach(x=>{
    if(!x.it||!controlaEstoque(x.it.categoria))return;
    movimentos.push({operacao_id:producaoId,item_id:x.it.id,tipo_movimento:'entrada_producao',quantidade:x.ri.quantidade*q,usuario_id:sessionUser().id,usuario_nome:sessionUser().nome,origem:'produção: '+r.nome,saldo_resultante:saldoItem(x.it.id)+x.ri.quantidade*q});
  });
  const{data,error}=await sb.from('estoque_bau').insert(movimentos).select();
  if(error){err.textContent='Erro ao gravar produção: '+error.message;err.style.display='block';return}
  data.forEach(d=>db.estoque_bau.unshift({...d,quantidade:Number(d.quantidade),saldo_resultante:Number(d.saldo_resultante)}));
  reg('Produção executada',`${r.nome} — ID ${producaoId} — quantidade ${q}`);closeModal();toast('✅ Produção executada. ID: '+producaoId);render();
}

/* ================= COMPRAS (ABA PRÓPRIA) ================= */
/* Formulário de compra com duas seções independentes (ambas opcionais, ao menos uma linha no total):
   • Insumos — item e fornecedor escolhidos só entre cadastrados; preço vem do cadastro; dá entrada no Baú.
   • Itens não controlados — tudo digitado; só registro financeiro.
   O mesmo formulário serve a Nova compra (prefixo "c") e à edição no Histórico Financeiro (prefixo "ec"). */
function fornOptionsHTML(itemId,selId){
  const ativos=db.fornecedores.filter(f=>f.status==='ativo'||f.id===selId).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  const vinc=itemId?fornecedoresDoItem(itemId).map(f=>f.id):[];
  const op=f=>`<option value="${f.id}" ${f.id===selId?'selected':''}>${esc(f.nome)}</option>`;
  const a=ativos.filter(f=>vinc.includes(f.id)),b=ativos.filter(f=>!vinc.includes(f.id));
  return `<option value="" disabled hidden ${selId?'':'selected'}>Selecione o fornecedor...</option>`+
    (a.length?`<optgroup label="Vinculados a este item">${a.map(op).join('')}</optgroup>`+(b.length?`<optgroup label="Outros fornecedores">${b.map(op).join('')}</optgroup>`:''):b.map(op).join(''));
}
function linhaInsumo(p,ci){
  ci=ci||{};
  const disp=itensCompraveis();
  if(ci.item_id&&!disp.some(i=>i.id===ci.item_id)){const it=db.itens.find(i=>i.id===ci.item_id);if(it)disp.unshift(it)}
  const preco=ci.preco_unitario!=null?ci.preco_unitario:'';
  return`<div class="cmp-row" data-ins data-preco="${preco}" oninput="this.classList.remove('linha-erro')" onchange="this.classList.remove('linha-erro')">
    <select class="ins-item" onchange="aoTrocarInsumo(this,'${p}')"><option value="" disabled hidden ${ci.item_id?'':'selected'}>Selecione um insumo...</option>${disp.map(i=>`<option value="${i.id}" data-preco="${i.preco_unitario||0}" ${ci.item_id===i.id?'selected':''}>${esc(i.nome)} (${esc(i.unidade_medida)})</option>`).join('')}</select>
    <select class="ins-forn" data-ssel-extra="fornSselExtra" onchange="recalcCompra('${p}')">${fornOptionsHTML(ci.item_id,ci.fornecedor_id)}</select>
    <input class="ins-qtd" type="number" min="0.01" step="0.01" placeholder="Qtd" value="${ci.quantidade??''}" oninput="recalcCompra('${p}')">
    <span class="cmp-val ins-preco" title="Valor unitário do cadastro">${preco!==''?fmt(preco):'—'}</span>
    <span class="cmp-val cmp-sub">—</span>
    <button class="iconbtn btn-del-linha" title="Remover linha" onclick="this.closest('.cmp-row').remove();recalcCompra('${p}')">✕</button></div>`;
}
function linhaNC(p,ci){
  ci=ci||{};
  return`<div class="cmp-row" data-nc oninput="this.classList.remove('linha-erro')">
    <input class="nc-nome" placeholder="Item" value="${esc(ci.nome||'')}">
    <input class="nc-forn" list="${p}-forn-dl" autocomplete="off" placeholder="Fornecedor" value="${esc(ci.fornecedor_nome||'')}">
    <input class="nc-qtd" type="number" min="0.01" step="0.01" placeholder="Qtd" value="${ci.quantidade??''}" oninput="recalcCompra('${p}')">
    <input class="nc-preco" type="number" min="0.01" step="0.01" placeholder="Valor unit." value="${ci.preco_unitario??''}" oninput="recalcCompra('${p}')">
    <span class="cmp-val cmp-sub">—</span>
    <button class="iconbtn btn-del-linha" title="Remover linha" onclick="this.closest('.cmp-row').remove();recalcCompra('${p}')">✕</button></div>`;
}
function formCompraHTML(p,k){
  const its=(k&&k.itens)||[];
  const ins=its.filter(i=>i.item_id),nc=its.filter(i=>!i.item_id);
  const cab=`<div class="cmp-row cmp-head"><span>${'%s'}</span><span>Fornecedor</span><span>Qtd</span><span>Valor unit.</span><span>Subtotal</span><span></span></div>`;
  return`
    <div class="section-title" style="margin-top:6px">📦 Insumos <span class="cmp-hint">opcional — dá entrada no Baú</span></div>
    ${cab.replace('%s','Insumo')}
    <div id="${p}-ins">${ins.map(i=>linhaInsumo(p,i)).join('')}</div>
    <button class="btn btn-ghost btn-sm" onclick="addLinhaCompra('${p}','ins')">+ Adicionar insumo</button>
    <div class="section-title" style="margin-top:18px">🧾 Itens não controlados <span class="cmp-hint">opcional — não dá entrada no Baú</span></div>
    ${cab.replace('%s','Item')}
    <div id="${p}-nc">${nc.map(i=>linhaNC(p,i)).join('')}</div>
    <button class="btn btn-ghost btn-sm" onclick="addLinhaCompra('${p}','nc')">+ Adicionar item não controlado</button>
    <datalist id="${p}-forn-dl">${db.fornecedores.filter(f=>f.status==='ativo').map(f=>`<option value="${esc(f.nome)}">`).join('')}</datalist>
    <div class="cmp-total" id="${p}-total"></div>
    <p id="${p}-err" style="color:var(--danger);font-size:13px;display:none;margin-top:10px"></p>`;
}
function addLinhaCompra(p,sec){
  const d=document.createElement('div');d.innerHTML=sec==='ins'?linhaInsumo(p):linhaNC(p);
  document.getElementById(p+'-'+sec).appendChild(d.firstElementChild);recalcCompra(p);
}
/* Troca de insumo: preço do cadastro + fornecedores vinculados no topo; 1 vinculado → já selecionado */
function aoTrocarInsumo(sel,p){
  const linha=sel.closest('.cmp-row'),opt=sel.options[sel.selectedIndex];
  const preco=opt?parseFloat(opt.getAttribute('data-preco')||'0'):0;
  linha.dataset.preco=preco;linha.querySelector('.ins-preco').textContent=fmt(preco);
  const fs=linha.querySelector('.ins-forn'),vinc=fornecedoresDoItem(sel.value);
  const atual=fs.value;
  fs.innerHTML=fornOptionsHTML(sel.value,atual||(vinc.length===1?vinc[0].id:''));
  fs.value=atual||(vinc.length===1?vinc[0].id:'');
  recalcCompra(p);
}
/* Lê as duas seções. Linha incompleta é destacada e bloqueia o registro. */
function lerFormCompra(p){
  const erros=[],ins=[],nc=[];
  document.querySelectorAll(`#${p}-ins [data-ins]`).forEach(r=>{
    const item_id=r.querySelector('.ins-item').value,fornecedor_id=r.querySelector('.ins-forn').value;
    const quantidade=parseFloat(r.querySelector('.ins-qtd').value),preco_unitario=parseFloat(r.dataset.preco);
    const it=db.itens.find(i=>i.id===item_id),f=db.fornecedores.find(x=>x.id===fornecedor_id);
    const falta=[!it&&'insumo',!f&&'fornecedor cadastrado',!(quantidade>0)&&'quantidade'].filter(Boolean);
    r.classList.toggle('linha-erro',falta.length>0);
    if(falta.length)erros.push(`Insumos — ${it?'"'+it.nome+'"':'linha '+(ins.length+1)}: falta ${falta.join(', ')}.`);
    ins.push({item_id,nome:it?it.nome:'?',quantidade,preco_unitario:preco_unitario||0,fornecedor_id:f?f.id:null,fornecedor_nome:f?f.nome:'',_it:it});
  });
  document.querySelectorAll(`#${p}-nc [data-nc]`).forEach(r=>{
    const nome=r.querySelector('.nc-nome').value.trim(),fn=r.querySelector('.nc-forn').value.trim();
    const quantidade=parseFloat(r.querySelector('.nc-qtd').value),preco_unitario=parseFloat(r.querySelector('.nc-preco').value);
    const falta=[!nome&&'item',!fn&&'fornecedor',!(quantidade>0)&&'quantidade',!(preco_unitario>0)&&'valor unitário'].filter(Boolean);
    r.classList.toggle('linha-erro',falta.length>0);
    if(falta.length)erros.push(`Itens não controlados — ${nome?'"'+nome+'"':'linha '+(nc.length+1)}: falta ${falta.join(', ')}.`);
    const f=db.fornecedores.find(x=>x.nome.toLowerCase()===fn.toLowerCase());
    nc.push({item_id:null,nome,quantidade,preco_unitario,fornecedor_id:f?f.id:null,fornecedor_nome:f?f.nome:fn});
  });
  const sub=l=>(l.quantidade>0&&l.preco_unitario>0)?l.quantidade*l.preco_unitario:0;
  const totIns=ins.reduce((s,l)=>s+sub(l),0),totNc=nc.reduce((s,l)=>s+sub(l),0);
  return{ins,nc,erros,totIns,totNc,total:totIns+totNc};
}
function recalcCompra(p){
  const box=document.getElementById(p+'-total');if(!box)return;
  document.querySelectorAll(`#${p}-ins .cmp-row, #${p}-nc .cmp-row`).forEach(r=>{
    const q=parseFloat((r.querySelector('.ins-qtd,.nc-qtd')||{}).value);
    const pu=r.hasAttribute('data-ins')?parseFloat(r.dataset.preco):parseFloat(r.querySelector('.nc-preco').value);
    r.querySelector('.cmp-sub').textContent=(q>0&&pu>0)?fmt(q*pu):'—';
  });
  const f=lerFormCompraSilencioso(p);
  box.innerHTML=`<span>Insumos <b>${fmt(f.totIns)}</b></span><span class="op">+</span><span>Itens não controlados <b>${fmt(f.totNc)}</b></span><span class="op">=</span><span class="tot">Total <b>${fmt(f.total)}</b></span>`;
}
/* Mesmo cálculo sem marcar erros (usado enquanto o usuário digita) */
function lerFormCompraSilencioso(p){
  const marcadas=[...document.querySelectorAll(`#${p}-ins .cmp-row, #${p}-nc .cmp-row`)].map(r=>[r,r.classList.contains('linha-erro')]);
  const f=lerFormCompra(p);marcadas.forEach(([r,m])=>r.classList.toggle('linha-erro',m));return f;
}
/* Cabeçalho da compra: 1 fornecedor → ele; vários → nomes unidos por " + " */
function fornecedorCabecalho(linhas){
  const d=[...new Map(linhas.filter(l=>l.fornecedor_nome).map(l=>[l.fornecedor_nome.toLowerCase(),l])).values()];
  if(d.length===1)return{fornecedor_id:d[0].fornecedor_id,fornecedor_nome:d[0].fornecedor_nome};
  if(d.length>1)return{fornecedor_id:null,fornecedor_nome:d.map(l=>l.fornecedor_nome).join(' + ')};
  return{fornecedor_id:null,fornecedor_nome:'Fornecedor avulso'};
}
function validarFormCompra(p){
  const f=lerFormCompra(p),e=document.getElementById(p+'-err');
  e.style.display='none';
  if(!f.ins.length&&!f.nc.length){e.textContent='Adicione pelo menos uma linha em Insumos ou em Itens não controlados.';e.style.display='block';return null}
  if(f.erros.length){

let _compraPendente=null;
function salvarCompra(){
  const data=document.getElementById('c-data').value;
  const e=document.getElementById('c-err');
  if(!data){e.textContent='Informe a data da compra.';e.style.display='block';return}
  const f=validarFormCompra('c');if(!f)return;
  const cab=fornecedorCabecalho([...f.ins,...f.nc]);
  if(db.compras.some(x=>x.status==='ativa'&&x.fornecedor_nome===cab.fornecedor_nome&&(x.data_local||x.data.slice(0,10))===data&&Math.abs(x.valor_total-f.total)<0.005)){
    e.textContent='Compra duplicada (mesmo fornecedor, data e valor) — verifique antes de registrar.';e.style.display='block';return;
  }
  const desc=document.getElementById('c-desc').value.trim();
  _compraPendente={f,cab,data,desc};
  openModal2(`<h3>Confirmar compra</h3>
    ${resumoCompraHTML(f,`<div class="rs-meta">${dataBR(data)}${desc?' · '+esc(desc):''}</div>`)}

    <button class="btn btn-primary" id="btn-conf-compra" onclick="efetivarCompra()">Confirmar compra</button></div>`);

async function efetivarCompra(){
  const pend=_compraPendente;if(!pend)return;
  const btn=document.getElementById('btn-conf-compra');if(btn){btn.disabled=true;btn.textContent='Registrando…'}
  const{f,cab,data,desc}=pend;
  const fail=m=>{closeModal2();const e=document.getElementById('c-err');e.textContent=m;e.style.display='block'};
  let operacaoId;try{operacaoId=await nextOpId()}catch(err){return fail('Erro ao gerar ID da operação: '+(err.message||err))}
  const cabecalho={operacao_id:operacaoId,fornecedor_id:cab.fornecedor_id,fornecedor_nome:cab.fornecedor_nome,
    data:new Date(data+'T'+new Date().toTimeString().slice(0,8)).toISOString(),data_local:data,
    valor_total:f.total,descricao:desc,usuario_id:sessionUser().id,usuario_nome:sessionUser().nome,status:'ativa'};
  const{data:kRow,error:e1}=await sb.from('compras').insert(cabecalho).select().single();
  if(e1)return fail('Erro ao registrar compra: '+e1.message);
  const linhas=[...f.ins,...f.nc].map(({_it,...l})=>({...l,compra_id:kRow.id}));
  const{data:itd,error:e2}=await sb.from('compra_itens').insert(linhas).select();
  if(e2){await sb.from('compras').delete().eq('id',kRow.id);return fail('Erro ao registrar itens: '+e2.message)}
  const saldos={};
  const movimentos=f.ins.filter(l=>l._it&&controlaEstoque(l._it.categoria)).map(l=>{
    const ant=saldos[l.item_id]??saldoItem(l.item_id);saldos[l.item_id]=ant+l.quantidade;
    return{item_id:l.item_id,tipo_movimento:'entrada_compra',operacao_id:operacaoId,quantidade:l.quantidade,usuario_id:sessionUser().id,usuario_nome:sessionUser().nome,origem:'compra: '+l.fornecedor_nome,saldo_resultante:ant+l.quantidade};
  });
  if(movimentos.length){
    const{data:bd,error:e3}=await sb.from('estoque_bau').insert(movimentos).select();
    if(e3)toast('⚠️ Compra salva, mas houve erro ao lançar no Baú: '+e3.message);
    else bd.forEach(d=>db.estoque_bau.unshift({...d,quantidade:Number(d.quantidade),saldo_resultante:Number(d.saldo_resultante)}));
  }
  const k={...kRow,itens:(itd||[]).map(i=>({item_id:i.item_id,nome:i.nome,quantidade:Number(i.quantidade),preco_unitario:Number(i.preco_unitario),fornecedor_id:i.fornecedor_id,fornecedor_nome:i.fornecedor_nome})),valor_total:Number(kRow.valor_total)};
  db.compras.unshift(k);
  reg('Compra registrada',`${k.fornecedor_nome} — ${fmt(f.total)}${movimentos.length?` (${movimentos.length} insumo(s) entraram no Baú)`:''}`);
  _compraPendente=null;closeModal2();bauTela=null;
  toast('✅ Compra registrada!'+(movimentos.length?' Entrada de insumos no Baú.':''));
  render();
}

function ordenarLista(arr,key,dir){return arr.sort((a,b)=>{let x=a[key],y=b[key];if(x==null)x='';if(y==null)y='';if(key==='data')return (new Date(x).getTime()-new Date(y).getTime())*(dir==='asc'?1:-1);if(typeof x==='string'&&typeof y==='string')return (x.localeCompare(y,'pt-BR',{numeric:true})||0)*(dir==='asc'?1:-1);return ((Number(x)||0)-(Number(y)||0))*(dir==='asc'?1:-1)})}
function pagina(arr,tipo){const q=regConsulta[tipo];const total=arr.length;const ini=(q.page-1)*q.size;const fim=Math.min(total,ini+q.size);return {rows:arr.slice(ini,fim),total,ini,fim,pages:Math.max(1,Math.ceil(total/q.size))}}

  <div class="field"><label>Valor ($)</label><input id="ac-valor" type="number" min="0.01" step="0.01"></div>

async function salvarAjusteCaixa(tipo){
  if(!isGerente())return toast('⚠️ Apenas Gerentes, Diretores ou Sócios podem ajustar o caixa.');
  const valor=parseFloat(document.getElementById('ac-valor').value);
  const motivo=document.getElementById('ac-motivo').value.trim();
  const e=document.getElementById('ac-err');
  if(!(valor>0)){e.textContent='Informe um valor maior que zero.';e.style.display='block';return}
  const registro={tipo,valor,motivo,usuario_id:sessionUser().id,usuario_nome:sessionUser().nome};
  const{data,error}=await sb.from('ajustes_caixa').insert(registro).select().single();
  if(error){e.textContent='Erro ao salvar: '+error.message;e.style.display='block';return}
  db.ajustes_caixa.unshift({...data,valor:Number(data.valor)});
  reg(tipo==='entrada'?'Ajuste de caixa (+)':'Ajuste de caixa (−)',fmt(valor)+(motivo?' — '+motivo:''));
  closeModal();toast('✅ Caixa ajustado.');render();
}
function excluirAjusteCaixa(id){
  if(!isSocioOuDiretor())return toast('⚠️ Apenas Sócio ou Diretor podem excluir ajustes de caixa.');
  const a=db.ajustes_caixa.find(x=>x.id===id);if(!a)return;

/* Reverter: só muda o status (sem estorno no Baú) */
function reverterFin(tipo,id){
 if(!isGerente())return;
 const realId=tipo==='venda'?id.replace('venda:',''):id.replace('compra:','');
 confirmar('Reverter lançamento','O registro será marcado como revertido e sairá dos totais. Confirmar?',async()=>{
  const tabela=tipo==='venda'?'vendas':'compras';
  const{error}=await sb.from(tabela).update({status:'revertida'}).eq('id',realId);
  if(error)return toast('⚠️ Erro ao reverter: '+error.message);
  if(tipo==='venda'){const v=db.vendas.find(x=>x.id===realId);if(v){v.status='revertida';reg('Venda revertida',fmt(v.total))}}
  else{const k=db.compras.find(x=>x.id===realId);if(k){k.status='revertida';reg('Compra revertida',fmt(k.valor_total))}}
  render();
 });
}
/* Apagar: exclui a linha por completo — só permitido se status = revertida */
function apagarFin(tipo,id){
 if(!isSocioOuDiretor())return toast('⚠️ Apenas Sócio ou Diretor podem apagar linhas.');
 const realId=tipo==='venda'?id.replace('venda:',''):id.replace('compra:','');
 const obj=tipo==='venda'?db.vendas.find(x=>x.id===realId):db.compras.find(x=>x.id===realId);
 if(!obj)return;
 if(obj.status!=='revertida')return toast('⚠️ Só é possível apagar linhas com status "revertida".');
 confirmar('Apagar linha','A linha será excluída por completo do histórico. Confirmar?',async()=>{
  const tabela=tipo==='venda'?'vendas':'compras';
  const{error}=await sb.from(tabela).delete().eq('id',realId);
  if(error)return toast('⚠️ Erro ao apagar: '+error.message);
  if(tipo==='venda')db.vendas=db.vendas.filter(x=>x.id!==realId);
  else db.compras=db.compras.filter(x=>x.id!==realId);
  selExclusao.financeiro.delete(id);
  reg('Lançamento apagado',tipo+' '+realId);
  render();toast('✅ Linha apagada.');
 });
}

function editCompraFin(id){

   return{...i,fornecedor_id:f?f.id:null,fornecedor_nome:i.fornecedor_nome||(f?f.nome:(k.fornecedor_nome!=='Fornecedor avulso'?k.fornecedor_nome:''))};
 });

 recalcCompra('ec');

async function salvarEdicaoCompraFin(id){
 const k=db.compras.find(x=>x.id===id);if(!k)return;
 const desc=document.getElementById('ec-desc').value.trim();
 const semLinhas=!document.querySelector('#ec-ins .cmp-row, #ec-nc .cmp-row');
 let patch,linhas=null;
 if(semLinhas&&!(k.itens||[]).length){patch={descricao:desc}} // compra antiga só com valor total
 else{
   const f=validarFormCompra('ec');if(!f)return;
   patch={...fornecedorCabecalho([...f.ins,...f.nc]),descricao:desc,valor_total:f.total};
   linhas=[...f.ins,...f.nc].map(({_it,...l})=>({...l,compra_id:id}));
 }
 const e=document.getElementById('ec-err');
 const{error:e1}=await sb.from('compras').update(patch).eq('id',id);
 if(e1){e.textContent='Erro ao salvar: '+e1.message;e.style.display='block';return}
 if(linhas){
  const{error:ed}=await sb.from('compra_itens').delete().eq('compra_id',id);
  if(ed){e.textContent='Erro ao salvar itens: '+ed.message;e.style.display='block';return}
  const{data,error:e2}=await sb.from('compra_itens').insert(linhas).select();
  if(e2){e.textContent='Erro ao salvar itens: '+e2.message;e.style.display='block';return}
  k.itens=data.map(i=>({item_id:i.item_id,nome:i.nome,quantidade:Number(i.quantidade),preco_unitario:Number(i.preco_unitario),fornecedor_id:i.fornecedor_id,fornecedor_nome:i.fornecedor_nome}));
 }
 Object.assign(k,patch);
 reg('Compra editada',k.fornecedor_nome+' — '+fmt(k.valor_total));
 closeModal();render();toast('✅ Compra atualizada.');
}

function podeGerenciarUsuario(alvo){
  // Sócio gerencia todos, inclusive outros Sócios.
  if(isSocio())return true;
  // Diretor gerencia todo mundo, MENOS contas de Sócio (não edita, não ativa/inativa, não exclui).
  if(isDiretor()&&alvo&&alvo.perfil!=='socio')return true;
  // Gerente só gerencia Vendedores.
  if(isGerente()&&alvo&&alvo.perfil==='vendedor')return true;
  return false;
}
function modalUsuario(id){

  const sociosAtivos=db.usuarios.filter(x=>x.perfil==='socio'&&x.status==='ativo').length;
  const ehUltimoSocio=u&&u.perfil==='socio'&&u.status==='ativo'&&sociosAtivos<=1;
  const alvoEhSocio=u&&u.perfil==='socio';

  const podePerfil=u&&u.id!==session.usuario_id&&!ehUltimoSocio&&(isSocio()||(isDiretor()&&!alvoEhSocio));

const ADMIN_USERS_URL=SUPABASE_URL+'/functions/v1/admin-users';
async function chamarAdminUsers(payload){
  const{data:{session:sessAuth}}=await sb.auth.getSession();
  const r=await fetch(ADMIN_USERS_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json',...(sessAuth?.access_token?{'Authorization':'Bearer '+sessAuth.access_token}:{})},
    body:JSON.stringify(payload)
  });
  const j=await r.json().catch(()=>({error:'Resposta inválida do servidor.'}));
  if(!r.ok)throw new Error(j.error||'Erro desconhecido.');
  return j;
}
async function salvarUsuario(id){
  const nome=document.getElementById('u-nome').value.trim();
  const usuario=document.getElementById('u-usuario').value.trim().toLowerCase().replace(/\s+/g,'.');
  const senha=document.getElementById('u-senha').value;
  const selPerfil=document.getElementById('u-perfil');
  const perfil=selPerfil.disabled?(id?db.usuarios.find(x=>x.id===id).perfil:'vendedor'):selPerfil.value;
  const e=document.getElementById('u-err');
  const fail=m=>{e.textContent=m;e.style.display='block'};
  if(!nome||!usuario)return fail('Informe nome e nome de usuário.');
  if(db.usuarios.some(x=>(x.usuario||'').toLowerCase()===usuario&&x.id!==id))return fail('Nome de usuário já existe.');
  if(!id&&senha.length<6)return fail('Senha deve ter no mínimo 6 caracteres.');
  if(senha&&senha.length<6)return fail('Senha deve ter no mínimo 6 caracteres.');
  if(id){
    const u=db.usuarios.find(x=>x.id===id);
    if(!podeGerenciarUsuario(u))return fail('Você não tem permissão para editar este usuário.');
    if(perfil!==u.perfil){
      if(u.id===session.usuario_id)return fail('Você não pode alterar o seu próprio perfil.');
      if(u.perfil==='socio'||perfil==='socio'){
        if(!isSocio())return fail('Apenas o Sócio pode alterar o perfil de um Sócio ou promover alguém a Sócio.');
      }else if(!isSocioOuDiretor()){
        return fail('Apenas Sócio ou Diretor podem alterar cargos.');
      }
      const sociosAtivos=db.usuarios.filter(x=>x.perfil==='socio'&&x.status==='ativo'&&x.id!==u.id).length;
      if(u.perfil==='socio'&&u.status==='ativo'&&sociosAtivos<1)return fail('Deve existir ao menos um sócio ativo.');
    }
    const{error}=await sb.from('profiles').update({nome,usuario,perfil}).eq('id',id);
    if(error)return fail('Erro ao salvar: '+error.message);
    if(senha){
      try{await chamarAdminUsers({action:'reset_password',targetUserId:id,senha})}catch(err){return fail('Usuário salvo, mas a senha não foi redefinida: '+err.message)}
    }
    u.nome=nome;u.usuario=usuario;u.perfil=perfil;
    reg('Usuário editado',nome+' ('+(PERFIL_LABEL[perfil]||perfil)+')');
  }else{
    if(!isSocioOuDiretor()&&perfil!=='vendedor')return fail('Apenas Sócio ou Diretor podem criar gerentes.');
    if(perfil==='socio'&&!isSocio())return fail('Apenas o Sócio pode criar outro Sócio.');
    let resp;
    try{resp=await chamarAdminUsers({action:'create',nome,usuario,perfil,senha})}catch(err){return fail(err.message)}
    db.usuarios.push({id:resp.id,nome,usuario,perfil,status:'ativo',troca_senha_obrigatoria:true,criado_em:nowISO(),ultimo_login:null});
    reg('Usuário criado',`${nome} (${PERFIL_LABEL[perfil]||perfil})`);
  }
  closeModal();render();
}
async function toggleStatusUsuario(id){
  const u=db.usuarios.find(x=>x.id===id);if(!u)return;
  if(u.id===session.usuario_id)return toast('⚠️ Você não pode inativar a sua própria conta.');
  if(!podeGerenciarUsuario(u))return toast('⚠️ Você não tem permissão para alterar '+PERFIL_LABEL[u.perfil]+'.');
  if(u.perfil==='socio'&&u.status==='ativo'){
    const sociosAtivos=db.usuarios.filter(x=>x.perfil==='socio'&&x.status==='ativo').length;
    if(sociosAtivos<=1)return toast('⚠️ Deve existir ao menos um sócio ativo.');
  }
  const novo=u.status==='ativo'?'inativo':'ativo';
  const{error}=await sb.from('profiles').update({status:novo}).eq('id',id);
  if(error)return toast('⚠️ Erro ao alterar status: '+error.message);
  u.status=novo;
  reg('Usuário '+(u.status==='ativo'?'ativado':'inativado'),u.nome);
  render();
}
function excluirUsuario(id){
  if(!isSocioOuDiretor())return toast('⚠️ Apenas Sócio ou Diretor podem excluir linhas.');

    db.usuarios=db.usuarios.filter(x=>x.id!==id);

    render();
  });
}

function pImgTmp(input){

async function salvarProduto(id){
  const nome=document.getElementById('p-nome').value.trim();
  const preco=parseFloat(document.getElementById('p-preco').value);
  const rateio=document.getElementById('p-rateio').value;
  const e=document.getElementById('p-err');
  if(!nome||!(preco>=0)){e.textContent='Informe nome e preço válido.';e.style.display='block';return}
  let imagemUrl=id?(db.produtos.find(x=>x.id===id)||{}).imagem||null:null;
  if(window._pImgFile){
    try{imagemUrl=await uploadImagem(window._pImgFile,'produtos')}catch(err){e.textContent='Erro ao enviar imagem: '+err.message;e.style.display='block';return}
  }
  const campos={nome,preco,rateio,imagem_url:imagemUrl};
  if(id){
    const{error}=await sb.from('produtos').update(campos).eq('id',id);
    if(error){e.textContent='Erro ao salvar: '+error.message;e.style.display='block';return}
    Object.assign(db.produtos.find(x=>x.id===id),{nome,preco,rateio,imagem:imagemUrl});
    reg('Produto editado',nome);
  }else{
    const{data,error}=await sb.from('produtos').insert({...campos,ordem:db.produtos.length+1,criado_por:sessionUser().id}).select().single();
    if(error){e.textContent='Erro ao salvar: '+error.message;e.style.display='block';return}
    db.produtos.push({...data,preco:Number(data.preco),imagem:data.imagem_url});
    reg('Produto criado',nome);
  }
  window._pImgFile=null;closeModal();render();
}

async function moverProduto(id,dir){
  const ps=[...db.produtos].sort((a,b)=>a.ordem-b.ordem);
  const i=ps.findIndex(p=>p.id===id),j=i+dir;
  if(j<0||j>=ps.length)return;
  const a=ps[i],b=ps[j],oa=a.ordem,ob=b.ordem;
  const[r1,r2]=await Promise.all([sb.from('produtos').update({ordem:ob}).eq('id',a.id),sb.from('produtos').update({ordem:oa}).eq('id',b.id)]);
  if(r1.error||r2.error)return toast('⚠️ Erro ao reordenar.');
  a.ordem=ob;b.ordem=oa;render();
}

function simNao(v){return `<span class="tag ${v?'g':''}">${v?'Sim':'Não'}</span>`}
function slugCategoria(nome){return nome.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'categoria'}
function modalCategoria(codigo){
  const c=codigo?db.categorias.find(x=>x.codigo===codigo):null;
  const chk=(id,label,v,dis,extra='')=>`<label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;font-weight:400;color:var(--text);margin:0 0 10px"><input type="checkbox" id="${id}" style="width:auto" ${v?'checked':''} ${dis?'disabled':''} ${extra}> ${label}</label>`;
  openModal(`<h3>${c?'Editar categoria':'Nova categoria'}</h3>
